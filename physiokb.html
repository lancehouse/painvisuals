<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhysioKB — Pain Visuals</title>
<meta name="description" content="A searchable clinical reference collating musculoskeletal special tests, diagnostic clusters, and clinical reasoning guidance — for clinicians." />
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #222536;
  --border: #3a3f5c;
  --accent: #7ba2ff;
  --accent2: #a58bff;
  --green: #5fd696;
  --orange: #f0a850;
  --red: #f07272;
  --yellow: #e6c96e;
  --text: #f4f6fc;
  --text2: #c2c8e0;
  --text3: #9298b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }

/* Layout */
#app { display: flex; height: 100vh; overflow: hidden; }
#sidebar { width: 220px; min-width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#search-bar { padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
#search-bar input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 4px; font-family: inherit; font-size: 13px; outline: none; }
#search-bar input:focus { border-color: var(--accent); }
#content { flex: 1; overflow-y: auto; padding: 16px; }

/* Sidebar */
#sidebar-header { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; }
#pv-back-link { padding: 7px 14px; border-bottom: 1px solid var(--border); font-size: 11px; }
#pv-back-link a { color: var(--text3); text-decoration: none; transition: color 0.15s; }
#pv-back-link a:hover { color: var(--accent); }
#nav-tabs { display: flex; border-bottom: 1px solid var(--border); }
.nav-tab { flex: 1; padding: 8px 4px; text-align: center; font-size: 11px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
#sidebar-list { flex: 1; overflow-y: auto; }
.sidebar-item { padding: 7px 14px; cursor: pointer; color: var(--text2); font-size: 12px; border-left: 2px solid transparent; transition: all 0.1s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-item:hover { color: var(--text); background: var(--surface2); }
.sidebar-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--surface2); }
.sidebar-group { padding: 8px 14px 2px; font-size: 10px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-bottom: 12px; }
.card-title { font-size: 15px; color: var(--text); margin-bottom: 4px; font-weight: 600; }
.card-sub { font-size: 11px; color: var(--text3); margin-bottom: 10px; }
.card h3 { font-size: 12px; color: var(--text2); margin: 10px 0 6px; letter-spacing: 0.04em; }
.card p { color: var(--text2); font-size: 12px; margin-bottom: 6px; }

/* Stats row */
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; font-size: 12px; }
.stat span { color: var(--text3); margin-right: 4px; }
.stat strong { color: var(--text); }

/* Tags */
.tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; margin-right: 4px; margin-bottom: 3px; }
.tag-diag { background: #1e3a5f; color: #7eb3f5; }
.tag-pres { background: #2d1e5f; color: #b07ef5; }
.tag-obj { background: #1e3a2e; color: #5fcf8a; }
.tag-subj { background: #3a2e1e; color: #cf9e5f; }
.tag-red { background: #3a1e1e; color: #cf5f5f; }
.tag-urg { background: #3a2a1e; color: #cf8f5f; }
.tag-emerg { background: #3a1a1a; color: #ef4444; }
.tag-cat { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }

/* Cluster */
.cluster-block { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 12px 14px; margin-bottom: 10px; }
.cluster-title { font-size: 13px; color: var(--text); margin-bottom: 6px; font-weight: 500; }
.cluster-threshold { font-size: 11px; color: var(--yellow); margin-bottom: 8px; }
.cluster-stats { display: flex; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
.cluster-stat { font-size: 12px; }
.cluster-stat .label { color: var(--text3); }
.cluster-stat .val { color: var(--text); font-weight: 600; }
.cluster-stat .ci { color: var(--text3); font-size: 11px; }
.test-list { list-style: none; }
.test-list li { padding: 3px 0; font-size: 12px; color: var(--text2); cursor: pointer; }
.test-list li:hover { color: var(--accent); }
.test-list li::before { content: '◦ '; color: var(--text3); }

/* Test detail */
.test-detail { }
.test-proc { background: var(--surface2); border-left: 3px solid var(--accent); padding: 10px 12px; margin: 8px 0; border-radius: 0 4px 4px 0; font-size: 12px; color: var(--text2); }
.pitfall-block { background: #362222; border-left: 3px solid var(--red); padding: 10px 12px; margin: 8px 0; border-radius: 0 4px 4px 0; font-size: 12px; color: #f0b3b3; }

/* Feature table */
.feat-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.feat-table th { text-align: left; padding: 5px 8px; color: var(--text3); font-size: 11px; border-bottom: 1px solid var(--border); font-weight: 400; }
.feat-table td { padding: 5px 8px; border-bottom: 1px solid #1e2130; color: var(--text2); vertical-align: top; }
.feat-table tr:hover td { background: var(--surface2); }
.feat-name { color: var(--text); }

/* Red flags table */
.rf-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.rf-table th { text-align: left; padding: 5px 8px; color: var(--text3); font-size: 11px; border-bottom: 1px solid var(--border); }
.rf-table td { padding: 6px 8px; border-bottom: 1px solid #1e2130; vertical-align: top; }
.rf-table tr:hover td { background: var(--surface2); }

/* Dashboard */
.dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
.dash-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px; cursor: pointer; transition: border-color 0.15s; }
.dash-tile:hover { border-color: var(--accent); }
.dash-tile .num { font-size: 28px; color: var(--accent); font-weight: 700; line-height: 1; }
.dash-tile .lbl { font-size: 11px; color: var(--text3); margin-top: 4px; }
.dash-tile .sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.section-title { font-size: 16px; color: var(--text); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.page-title { font-size: 20px; color: var(--text); margin-bottom: 4px; }
.page-sub { font-size: 12px; color: var(--text3); margin-bottom: 16px; }

/* Search results */
.search-result { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.search-result:hover { background: var(--surface2); }
.search-result .r-type { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
.search-result .r-title { font-size: 13px; color: var(--text); }
.search-result .r-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
mark { background: #3a4a1e; color: #c8d85f; border-radius: 2px; padding: 0 2px; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* Diff block */
.diff-block { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 10px 12px; margin-bottom: 8px; }
.diff-conds { font-size: 12px; color: var(--accent); margin-bottom: 4px; }
.diff-text { font-size: 12px; color: var(--text2); }

/* Checklist */
.cl-item { padding: 7px 0; border-bottom: 1px solid #1e2130; }
.cl-question { font-size: 12px; color: var(--text); }
.cl-pos { font-size: 11px; color: var(--green); margin-top: 2px; }
.cl-sig { font-size: 11px; color: var(--text3); margin-top: 1px; font-style: italic; }
.cl-cat { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-right: 6px; }

/* Markdown-rendered concept content */
.md-content { font-size: 13px; color: var(--text2); line-height: 1.65; }
.md-content .md-h2 { font-size: 17px; color: var(--text); margin: 22px 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--border); font-weight: 600; }
.md-content .md-h2:first-child { margin-top: 0; }
.md-content .md-h3 { font-size: 14px; color: var(--text); margin: 16px 0 7px; font-weight: 600; }
.md-content .md-h4 { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 5px; font-weight: 600; }
.md-content .md-p { margin-bottom: 10px; }
.md-content .md-ul, .md-content .md-ol { margin: 0 0 10px 22px; }
.md-content .md-ul li, .md-content .md-ol li { margin-bottom: 5px; }
.md-content .md-table { width: 100%; border-collapse: collapse; margin: 6px 0 16px; font-size: 12.5px; }
.md-content .md-table th { text-align: left; padding: 7px 10px; color: var(--text); background: var(--surface2); border-bottom: 1px solid var(--border); font-weight: 600; }
.md-content .md-table td { padding: 7px 10px; border-bottom: 1px solid #1e2130; vertical-align: top; }
.md-content .md-table tr:hover td { background: var(--surface2); }
.md-content .md-hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
.md-content strong { color: var(--text); font-weight: 600; }
.md-content em { color: var(--text2); font-style: italic; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">PhysioKB</div>
    <div id="pv-back-link"><a href="index.html">← Pain Visuals</a></div>
    <div id="nav-tabs">
      <div class="nav-tab active" onclick="setTab('regions')" id="tab-regions">Regions</div>
      <div class="nav-tab" onclick="setTab('tests')" id="tab-tests">Tests</div>
      <div class="nav-tab" onclick="setTab('concepts')" id="tab-concepts">Concepts</div>
    </div>
    <div id="sidebar-list"></div>
  </div>
  <div id="main">
    <div id="search-bar">
      <input id="search-input" placeholder="Search conditions, tests, clusters, features..." oninput="onSearch(this.value)" />
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
const KB = {"regions": [{"id": 1, "pab_id": "abdominal", "label": "Abdominal / Visceral", "body_area": null}, {"id": 2, "pab_id": "ankle", "label": "Ankle", "body_area": "lower_limb"}, {"id": 3, "pab_id": "cervical", "label": "Cervical Spine", "body_area": "spine"}, {"id": 4, "pab_id": "concussion", "label": "Concussion", "body_area": "head_neck"}, {"id": 5, "pab_id": "elbow", "label": "Elbow", "body_area": "upper_limb"}, {"id": 6, "pab_id": "foot", "label": "Foot", "body_area": "lower_limb"}, {"id": 7, "pab_id": "functional", "label": "Functional / Multi-region", "body_area": null}, {"id": 8, "pab_id": "hand", "label": "Hand", "body_area": "upper_limb"}, {"id": 9, "pab_id": "headache", "label": "Headache", "body_area": "head_neck"}, {"id": 10, "pab_id": "hip", "label": "Hip", "body_area": "lower_limb"}, {"id": 11, "pab_id": "knee", "label": "Knee", "body_area": "lower_limb"}, {"id": 12, "pab_id": "lumbar", "label": "Lumbar Spine", "body_area": "spine"}, {"id": 13, "pab_id": "pelvis", "label": "Pelvis", "body_area": "pelvis"}, {"id": 14, "pab_id": "scapular", "label": "Scapular Region", "body_area": "upper_limb"}, {"id": 15, "pab_id": "shoulder", "label": "Shoulder", "body_area": "upper_limb"}, {"id": 16, "pab_id": "thoracic", "label": "Thoracic Spine", "body_area": "spine"}, {"id": 17, "pab_id": "vestibular", "label": "Vestibular / Head", "body_area": "head_neck"}, {"id": 18, "pab_id": "wrist", "label": "Wrist", "body_area": "upper_limb"}], "conditions": [{"id": 1, "primary_region_id": 15, "name": "Subacromial Impingement Syndrome", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Shoulder impingement / rotator cuff tendinopathy", "context": "Impingement of rotator cuff tendons under the coracoacromial arch. Cluster approach significantly improves diagnostic accuracy over individual tests. Gold standard: arthroscopy or imaging.", "reference": "Michener et al. 2009 Arch Phys Med Rehabil; Park et al. 2005 JBJS", "display_priority": 99, "region_pab_id": "shoulder", "region_label": "Shoulder"}, {"id": 2, "primary_region_id": 11, "name": "Anterior Cruciate Ligament (ACL) Injury", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "ACL rupture / partial tear", "context": "Gold standard: arthroscopy or MRI. Lachman is most sensitive; Pivot Shift most specific. Combination of Lachman + Pivot Shift recommended to confirm ACL rupture. Acute effusion reduces test accuracy.", "reference": "Scholten et al. 2003 JAMA; Huang et al. 2016; Decary et al. 2022 meta-analysis", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 3, "primary_region_id": 11, "name": "Meniscal Pathology (Knee)", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Meniscal tear / meniscal injury", "context": "Gold standard: arthroscopy. No single test has high Sn AND Sp. Cluster (composite score) of 3+ of 5 findings is most accurate. Thessaly test original impressive stats not replicated.", "reference": "Lowery et al. 2006 Arthroscopy 22(11):1174-9; Scholten et al. systematic review", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 4, "primary_region_id": 12, "name": "Sacroiliac Joint Pain", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "SIJ dysfunction / sacroiliitis", "context": "10-25% of mechanical LBP is SIJ-sourced. Gold standard: fluoroscopic SIJ block. Cluster approach essential - individual tests have poor accuracy. Thigh Thrust is most sensitive individual test.", "reference": "Laslett et al. 2005 Man Ther; van der Wurff 2006; Laslett 2003", "display_priority": 99, "region_pab_id": "lumbar", "region_label": "Lumbar Spine"}, {"id": 5, "primary_region_id": 3, "name": "Cervical Radiculopathy", "short_name": null, "condition_category": "Musculoskeletal / Neurological", "icd_concept": "Cervical nerve root compression / radiculopathy", "context": "Gold standard: needle EMG and nerve conduction studies. Wainner 4-item CPR is most validated. 3 of 4 positive (Sn 0.39, Sp 0.94, +LR 6.1) is recommended clinical threshold. ULTT-A negative is useful to rule out.", "reference": "Wainner et al. 2003 Spine; Waldrop 2006 JOSPT; Sleijser-Koehorst 2021 Physiotherapy", "display_priority": 99, "region_pab_id": "cervical", "region_label": "Cervical Spine"}, {"id": 6, "primary_region_id": 12, "name": "Lumbar Segmental Instability", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Lumbar instability / non-radicular LBP", "context": "PRESCRIPTIVE CPR - identifies LBP patients likely to respond to lumbar stabilisation exercise. Derivation study only (n=54). Rabin 2014 validation found modified 2-item version (aberrant motion + positive PIT) had better predictive validity.", "reference": "Hicks et al. 2005 Arch Phys Med Rehabil; Rabin et al. 2014 JOSPT (validation)", "display_priority": 99, "region_pab_id": "lumbar", "region_label": "Lumbar Spine"}, {"id": 7, "primary_region_id": 12, "name": "Lumbar Spinal Stenosis", "short_name": null, "condition_category": "Musculoskeletal / Neurological", "icd_concept": "Neurogenic claudication / LSS", "context": "Gold standard: MRI + clinical correlation. No single test has adequate Sn AND Sp. Cluster approach recommended. Key clinical clue: symptoms worse with lumbar extension/walking, relieved with flexion/sitting (shopping cart sign).", "reference": "Fritz et al. 1997 J Spinal Disord; Cook et al. 2020 Eur Spine J; Genevay et al. 2018", "display_priority": 99, "region_pab_id": "lumbar", "region_label": "Lumbar Spine"}, {"id": 8, "primary_region_id": 10, "name": "Hip Femoroacetabular Impingement / Labral Tear", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "FAI / hip labral tear / intra-articular hip pathology", "context": "Gold standard: MRA or hip arthroscopy. FADIR most sensitive (96%) but very low specificity. FABER more specific. No single test is definitive. Cluster approach essential for intra-articular hip pathology.", "reference": "Reiman et al. 2013 BJSM; Tijssen et al. 2012 Arthroscopy; Martin et al. 2008 JOSPT", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 9, "primary_region_id": 18, "name": "Carpal Tunnel Syndrome (CTS)", "short_name": null, "condition_category": "Neurological / Musculoskeletal", "icd_concept": "Median nerve compression neuropathy", "context": "Gold standard: nerve conduction studies (NCS) / electrodiagnostic testing. Individual tests have variable accuracy. Wainner CPR combines history + clinical tests. When Phalen + Tinel + shaking hands relieves symptoms + nocturnal symptoms all positive: post-test probability 86%.", "reference": "Ozdag et al. 2023 Cureus (meta-analysis 67 studies); Wainner et al. 2005 (CPR); MacDermid 2004 systematic review", "display_priority": 99, "region_pab_id": "wrist", "region_label": "Wrist"}, {"id": 10, "primary_region_id": 5, "name": "Lateral Epicondylalgia (Tennis Elbow)", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Lateral elbow tendinopathy / lateral epicondylitis", "context": "Gold standard: clinical diagnosis (combination of lateral epicondyle tenderness + provocation tests). Cozen most sensitive; grip strength difference adds specificity. No validated CPR. Combination of 3 tests recommended.", "reference": "Karanasios et al. systematic review 2022; Saroja et al. 2014 IJPR; Zwerus et al. 2019", "display_priority": 99, "region_pab_id": "elbow", "region_label": "Elbow"}, {"id": 11, "primary_region_id": 3, "name": "Thoracic Outlet Syndrome (TOS)", "short_name": null, "condition_category": "Musculoskeletal / Neurological / Vascular", "icd_concept": "Neurogenic / venous / arterial TOS", "context": "No single test is definitive or validated. TOS is controversial. Combination of 4-5 tests recommended. Neurogenic TOS (95% of cases) has no objective gold standard. Rayan 1998: combination of Adson + Eden + Wright + Roos + Tinel = 94% sensitivity.", "reference": "Gillard et al. 2001; Rayan 1998; Physiopedia TOS and Roos Stress Test pages", "display_priority": 99, "region_pab_id": "cervical", "region_label": "Cervical Spine"}, {"id": 12, "primary_region_id": 17, "name": "Benign Paroxysmal Positional Vertigo (BPPV)", "short_name": null, "condition_category": "Vestibular / Neurological", "icd_concept": "Posterior or horizontal canal BPPV", "context": "Gold standard: Dix-Hallpike test with characteristic nystagmus pattern. Dix-Hallpike is gold standard for posterior canal BPPV (most common type). Supine Roll test for horizontal canal BPPV. No nystagmus = atypical BPPV or look for central cause.", "reference": "Dix & Hallpike 1952; Cohen 2004; Physiopedia BPPV page; CMAJ 2020", "display_priority": 99, "region_pab_id": "vestibular", "region_label": "Vestibular / Head"}, {"id": 13, "primary_region_id": 8, "name": "Rheumatoid Arthritis (Clinical Detection)", "short_name": null, "condition_category": "Rheumatological", "icd_concept": "Rheumatoid arthritis / inflammatory arthritis", "context": "Gold standard: ACR/EULAR 2010 Classification Criteria (score >=6). Physical examination findings support early detection. Squeeze test sensitivity is low (53% MCP) but specific (82%). Combination with serological tests (RF, anti-CCP) and imaging essential.", "reference": "van den Bosch et al. 2015 ARD (squeeze test); 2010 ACR/EULAR Classification Criteria; Physiopedia RA page", "display_priority": 99, "region_pab_id": "hand", "region_label": "Hand"}, {"id": 14, "primary_region_id": 2, "name": "Ankle Lateral Ligament Injury", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "ATFL / CFL sprain / ankle instability", "context": "Gold standard: stress radiography, arthrography, or MRI. Anterior drawer tests ATFL. Talar tilt tests CFL. Ottawa Rules exclude fracture. Clinical tests are more accurate after 5 days (initial spasm reduces test sensitivity in acute phase).", "reference": "Physiopedia Stress Tests for Ankle Ligaments; Physiopedia Talar Tilt; Physiopedia Anterior Drawer Ankle", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 15, "primary_region_id": 10, "name": "Hip Osteoarthritis (Cluster of Sutlive)", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Hip OA / symptomatic hip osteoarthritis", "context": "Gold standard: radiographic OA confirmation. 5-item cluster reduces need for imaging. Derivation study only. 3+ of 5 items positive substantially increases probability of hip OA.", "reference": "Sutlive et al. 2008 JOSPT 38(9):542-550", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 16, "primary_region_id": 12, "name": "LBP \u2013 Response to Lumbar Manipulation (Flynn CPR)", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Non-specific low back pain amenable to spinal manipulation", "context": "PRESCRIPTIVE CPR - identifies LBP patients most likely to respond to lumbopelvic thrust manipulation. Validated by Childs 2004 RCT. 4+ of 5 criteria: +LR 24.4, probability of success ~95%. Key criterion: symptoms < 16 days is the most powerful single predictor.", "reference": "Flynn et al. 2002 Spine 27:2835-2843; Childs et al. 2004 Ann Intern Med (validation)", "display_priority": 99, "region_pab_id": "lumbar", "region_label": "Lumbar Spine"}, {"id": 17, "primary_region_id": 12, "name": "Lumbar Disc Herniation / Radiculopathy", "short_name": null, "condition_category": "Musculoskeletal / Neurological", "icd_concept": "Lumbar disc herniation / lumbosacral radiculopathy", "context": "Gold standard: MRI + surgical/injection confirmation. Slump test most sensitive (84%), SLR high sensitivity but lower in chronic. Crossed SLR highly specific. Cluster of SLR + Slump + crossed SLR + neurological signs recommended.", "reference": "Majlesi et al. 2008 J Clin Rheumatol; Devill\u00e9 et al. 2000 Ann Rheum Dis (SLR meta-analysis); Archives PMR 2017", "display_priority": 99, "region_pab_id": "lumbar", "region_label": "Lumbar Spine"}, {"id": 18, "primary_region_id": 11, "name": "Patellofemoral Pain Syndrome (PFPS)", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Patellofemoral pain / chondromalacia patellae / anterior knee pain", "context": "No gold standard clinical test. PFPS is diagnosis of exclusion. No individual test has both high Sn and Sp. Patellar tilt test has best +LR (5.3). Active instability test has very high +LR but rare. Cluster approach recommended. History of anterior knee pain with activity is most reliable diagnostic feature.", "reference": "Cook et al. 2012 Physiotherapy; Nijs et al. 2006 Man Ther; StatPearls PFPS", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 19, "primary_region_id": 15, "name": "Glenohumeral Instability / SLAP Tears", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Anterior shoulder instability / SLAP labral tear", "context": "Gold standard: arthroscopy. Individual tests have poor-moderate accuracy. SLAP tear cluster: if 1 of 3 tests positive Sn ~75%; if all 3 positive Sp ~90%. Anterior instability: Apprehension + Relocation combination recommended. No single test is definitive.", "reference": "Physiopedia SLAP Lesion; Physiopedia Shoulder Instability; Hegedus meta-analysis 2012", "display_priority": 99, "region_pab_id": "shoulder", "region_label": "Shoulder"}, {"id": 20, "primary_region_id": 18, "name": "De Quervain's Tenosynovitis", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "De Quervain stenosing tenosynovitis / first dorsal compartment tendinopathy", "context": "Clinically diagnosed. Gold standard: clinical diagnosis (local pain + provocation). Finkelstein often confused with Eichhoff test. WHAT test (2014) may be more accurate but small study. Finkelstein superior to Eichhoff per Wu 2018.", "reference": "StatPearls Finkelstein; Goubau et al. 2014 J Hand Surg; Physiopedia Finkelstein Test", "display_priority": 99, "region_pab_id": "wrist", "region_label": "Wrist"}, {"id": 21, "primary_region_id": 2, "name": "Achilles Tendinopathy (Mid-portion)", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Mid-portion Achilles tendinopathy", "context": "Gold standard: ultrasound or MRI confirming tendinopathic changes. Clinical diagnosis preferred. 3-test cluster (palpation + Arc Sign + Royal London Hospital test) has Sn 0.586 and Sp 0.833. Reactive/degenerative distinction important for management.", "reference": "Physiopedia Achilles Tendinopathy Toolkit; APTA Royal London Hospital Test; Maffulli et al. 2003", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 22, "primary_region_id": 12, "name": "Ankylosing Spondylitis / Axial Spondyloarthropathy", "short_name": null, "condition_category": "Rheumatological", "icd_concept": "Axial spondyloarthritis / ankylosing spondylitis", "context": "Gold standard: ASAS classification criteria (imaging + clinical). BASMI is validated mobility assessment tool. SIJ tenderness + restricted spinal mobility + chest expansion < 2.5 cm = classic clinical cluster. HLA-B27 positive in 90% of AS.", "reference": "Physiopedia Ankylosing Spondylitis; BASMI (Bath AS Metrology Index); ASAS classification criteria", "display_priority": 99, "region_pab_id": "lumbar", "region_label": "Lumbar Spine"}, {"id": 23, "primary_region_id": 3, "name": "Upper Cervical Instability (C1-C2 / Alar Ligaments)", "short_name": null, "condition_category": "Musculoskeletal / Neurological", "icd_concept": "Atlantoaxial instability / alar ligament injury", "context": "Gold standard: MRI or fluoroscopy with stress views. Upper cervical instability is rare but potentially dangerous. Sharp-Purser must be performed BEFORE Transverse Ligament Stress Test. Alar ligament cluster: > 2 of 3 tests positive = Sn 85.7%, Sp 100%.", "reference": "Physiopedia Sharp-Purser Test; Physiopedia Alar Ligament Test; Physiopedia Cervical Instability", "display_priority": 99, "region_pab_id": "cervical", "region_label": "Cervical Spine"}, {"id": 24, "primary_region_id": 3, "name": "Cervicogenic Headache", "short_name": null, "condition_category": "Neurological / Musculoskeletal", "icd_concept": "Cervicogenic headache (C1-C3 origin)", "context": "Gold standard: anaesthetic nerve block at C1-C2-C3. CFRT most validated test (Sn 91%, Sp 90%). Cluster of CFRT + upper cervical palpation + cranio-cervical muscle control = 100% Sn, 94% Sp for differentiating CGH from migraine. Key: unilateral headache starting in neck.", "reference": "Physiopedia Cervicogenic Headache; Hall & Robinson 2004 Man Ther; Ogince et al. 2007 Man Ther", "display_priority": 99, "region_pab_id": "cervical", "region_label": "Cervical Spine"}, {"id": 25, "primary_region_id": 3, "name": "Degenerative Cervical Myelopathy (DCM)", "short_name": null, "condition_category": "Neurological", "icd_concept": "Cervical myelopathy / cervical cord compression", "context": "Gold standard: MRI + clinical presentation. Cook 2010 proposed 5-item cluster. Tr\u00f6mner sign has best individual accuracy (Sn 94%, Sp 93%). Hoffmann present in 68% of surgical myelopathy cases. Bilateral Hoffmann = 91% correlation with cord compression on MRI.", "reference": "Physiopedia Hoffmanns Sign; Tromner Sign; Cook et al. 2010 J Manual Manip Ther (cluster); Jiang et al. 2024 Global Spine J", "display_priority": 99, "region_pab_id": "cervical", "region_label": "Cervical Spine"}, {"id": 26, "primary_region_id": 11, "name": "Posterior Cruciate Ligament (PCL) Injury", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "PCL rupture / posterior knee instability", "context": "Gold standard: arthroscopy or MRI. Posterior Drawer + Posterior Sag Sign combination gives best accuracy (~96%). PCL injuries less common than ACL; often missed acutely. Posterior sag sign (Godfrey test) is pathognomonic when positive.", "reference": "Physiopedia Posterior Drawer Test (Knee); Rubinstein et al. 1994 AJSM", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 27, "primary_region_id": 11, "name": "Knee Collateral Ligament Injury (MCL/LCL)", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Medial or lateral collateral ligament sprain / tear", "context": "Gold standard: MRI or stress radiography. Limited high-quality diagnostic accuracy data. Valgus stress test for MCL; Varus stress test for LCL. Test at both 0 deg (tests ALL structures) and 30 deg flexion (isolates collateral ligament). Positive = pain AND/OR gapping.", "reference": "Physiopedia Valgus Stress Test; Varus Stress Test; AHPS Special Tests", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 28, "primary_region_id": 15, "name": "Acromioclavicular (AC) Joint Pathology", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "AC joint osteoarthritis / AC joint sprain / separation", "context": "Gold standard: AC joint injection response (>80% pain reduction). AC palpation most sensitive (96%) but least specific (10%). Cluster of Cross-Body Adduction + O'Brien's + AC resisted extension recommended. O'Brien's pain superficial (at AC joint top) = AC pathology vs deep = labral.", "reference": "Physiopedia Scarf Test; O'Briens Test (AC); Resisted AC Joint Extension Test; Park et al. 2005", "display_priority": 99, "region_pab_id": "shoulder", "region_label": "Shoulder"}, {"id": 29, "primary_region_id": 15, "name": "Biceps Tendon Pathology / Bicipital Tendinopathy", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Biceps tendinopathy / bicipital groove tendinitis / biceps LHB tear", "context": "Gold standard: arthroscopy or MRI/ultrasound. No single test reliably diagnoses biceps pathology. Speed's: Sn 50-90%, Sp 14-87% (wide variation). Yergason's: Sp 95% but low Sn. Combined test item cluster (Speed's + Yergason's + bicipital groove palpation) is recommended.", "reference": "Physiopedia Speeds Test; Physiopedia Yergasons Test; Gill et al. 2007 AJSM", "display_priority": 99, "region_pab_id": "shoulder", "region_label": "Shoulder"}, {"id": 30, "primary_region_id": 5, "name": "Cubital Tunnel Syndrome (Ulnar Nerve Entrapment)", "short_name": null, "condition_category": "Neurological / Musculoskeletal", "icd_concept": "Cubital tunnel syndrome / ulnar neuropathy at elbow", "context": "Gold standard: electrodiagnostic testing (nerve conduction studies). Pressure provocative test: Sn 0.75, Sp 0.99, PPV 0.97. Tinel at elbow: Sn 0.70, Sp 0.98. Elbow Flexion Test: Sn 0.32 alone but improves combined with pressure test.", "reference": "Physiopedia Cubital Tunnel Syndrome; Physiopedia Elbow Flexion Test; Rosati et al. 1998 Acta Orthop Belg", "display_priority": 99, "region_pab_id": "elbow", "region_label": "Elbow"}, {"id": 31, "primary_region_id": 5, "name": "Medial Epicondylalgia (Golfer's Elbow)", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Medial elbow tendinopathy / medial epicondylitis", "context": "Gold standard: clinical diagnosis. Diagnosis based on medial epicondyle tenderness + resisted provocation tests. Similar to lateral epicondylalgia but affecting flexor-pronator origin. UCL must be excluded in throwing athletes.", "reference": "Physiopedia Assessment of Tennis Elbow (medial variant); standard orthopaedic assessment", "display_priority": 99, "region_pab_id": "elbow", "region_label": "Elbow"}, {"id": 32, "primary_region_id": 2, "name": "Plantar Fasciitis / Plantar Heel Pain", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Plantar fasciitis / plantar heel pain syndrome", "context": "Gold standard: clinical diagnosis (history + examination). Windlass test: Sp 100% (weight-bearing), Sn only 32%. First-step pain (post-static dyskinesia) is most sensitive history item (Sn 82%). Combination of history + Windlass + heel palpation is diagnostic approach.", "reference": "Physiopedia Windlass Test; De Garceau et al. 2003 Foot Ankle Int; JOSPT CPG 2023", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 33, "primary_region_id": 6, "name": "Morton's Neuroma (Interdigital Neuroma)", "short_name": null, "condition_category": "Musculoskeletal / Neurological", "icd_concept": "Morton neuroma / interdigital neuroma", "context": "Gold standard: ultrasound or MRI. Modified webspace tenderness test: Sn 0.96, -LR 0.04 (excellent rule-out). Mulder's click: low Sn but high Sp when present. Patient-reported clicking rules in Morton's neuroma. Lateral squeeze + thumb-index webspace palpation = best cluster.", "reference": "Physiopedia Metatarsal Squeeze Test; PMC 2024 systematic review; Mulder 1951", "display_priority": 99, "region_pab_id": "foot", "region_label": "Foot"}, {"id": 34, "primary_region_id": 7, "name": "Fall Risk and Balance Assessment (Older Adults)", "short_name": null, "condition_category": "Neurological / Musculoskeletal / Geriatric", "icd_concept": "Fall risk / balance impairment / frailty", "context": "No gold standard single test. TUG > 12 sec = fall risk in community dwelling elderly. Berg < 45 = increased fall risk. TUG Cognitive (dual-task) more discriminative than TUG alone. Multiple tests in combination (TUG + Berg + SPPB) recommended for fall risk profiling.", "reference": "Physiopedia TUG Test; Physiopedia Berg Balance Scale; Podsiadlo & Richardson 1991", "display_priority": 99, "region_pab_id": "functional", "region_label": "Functional / Multi-region"}, {"id": 35, "primary_region_id": 18, "name": "Scaphoid Fracture", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Scaphoid fracture / carpal bone fracture", "context": "Gold standard: MRI (most sensitive <24h) or CT arthrography. Plain X-ray misses up to 16% of fractures. All 3 tests combined: Sn 87-100%, Sp 74% within 24h of injury. Anatomical snuffbox tenderness: Sn 90%, Sp 40% (excellent screening, poor specificity). Any of 3 tests negative = fracture highly unlikely.", "reference": "Physiopedia Scaphoid Fracture; Physiopedia Anatomical Snuff Box; AAFP 2004; Orthobullets", "display_priority": 99, "region_pab_id": "wrist", "region_label": "Wrist"}, {"id": 36, "primary_region_id": 18, "name": "Triangular Fibrocartilage Complex (TFCC) Injury", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "TFCC tear / ulnar-sided wrist pain / DRUJ instability", "context": "Gold standard: MR arthrography or CT arthrography (Sn/Sp 92-94%). Clinical tests have variable accuracy. Fovea sign: Sn 89%, Sp 48% for TFCC injury. Piano Key sign: Sn 59%, Sp 96% for DRUJ instability. Cluster approach recommended: Fovea + Piano Key + TFCC compression.", "reference": "Physiopedia TFCC Injuries; Physiopedia Fovea Sign; Physiopedia Piano Key Sign; Tay et al. 2007 J Hand Surg", "display_priority": 99, "region_pab_id": "wrist", "region_label": "Wrist"}, {"id": 37, "primary_region_id": 15, "name": "Rotator Cuff Tear - Lag Sign Battery", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Full-thickness rotator cuff tear (supraspinatus / infraspinatus / subscapularis / teres minor)", "context": "Gold standard: arthroscopy or MRI/ultrasound. Lag signs are highly specific but variably sensitive. IRLS: Sn 97%, Sp 96% (Hertel). ERLS: high specificity, moderate sensitivity. All lag signs together (ERLS + IRLS + Drop Sign + Hornblower) form comprehensive RCT assessment battery.", "reference": "Physiopedia Lag Sign of Shoulder; Internal Rotation Lag Sign; Hornblowers Sign; Hertel et al. 1996 J Shoulder Elbow Surg", "display_priority": 99, "region_pab_id": "shoulder", "region_label": "Shoulder"}, {"id": 38, "primary_region_id": 3, "name": "Upper Limb Tension Tests (ULTT) - Full Battery", "short_name": null, "condition_category": "Neurological / Musculoskeletal", "icd_concept": "Peripheral neuropathic pain / brachial plexus tension / nerve mechanosensitivity", "context": "ULTTs test mechanosensitivity of upper limb neurological structures. ULTT-1 (median nerve bias): best validated, Sn 97% for cervical radiculopathy (Wainner). Only ULTT-1 has strong clinical validity evidence. ULTT-2b (radial) and ULTT-3 (ulnar): biomechanical evidence for selectivity is questionable.", "reference": "Physiopedia Upper Limb Tension Tests; Physiopedia Neurodynamic Assessment; Wainner 2003; ScienceDirect 2023 systematic review", "display_priority": 99, "region_pab_id": "cervical", "region_label": "Cervical Spine"}, {"id": 39, "primary_region_id": 6, "name": "Gout (Crystal Arthropathy)", "short_name": null, "condition_category": "Rheumatological", "icd_concept": "Gout / monosodium urate crystal arthropathy", "context": "Gold standard: monosodium urate (MSU) crystal identification in synovial fluid under polarising microscopy (Sn 85-100%, Sp 83-92%). Clinical diagnosis can be made without aspiration. ACR/EULAR 2015 criteria score >=8 = diagnosis. Podagra + rapid onset + resolution < 14 days = highly suggestive. Serum urate normal in 30-40% during acute attack.", "reference": "Physiopedia Gout; 2015 ACR/EULAR Gout Classification Criteria; ACP 2017 Clinical Practice Guideline; Janssens diagnostic rule", "display_priority": 99, "region_pab_id": "foot", "region_label": "Foot"}, {"id": 40, "primary_region_id": 16, "name": "Idiopathic Scoliosis (Screening)", "short_name": null, "condition_category": "Musculoskeletal / Paediatric", "icd_concept": "Adolescent idiopathic scoliosis / structural scoliosis", "context": "Gold standard: Cobb angle measurement on standing X-ray (positive if > 10 degrees). Adam's Forward Bend Test: Sn 83-92%, Sp 60-99% depending on Cobb angle threshold. Most sensitive for thoracic curves > 20 deg. Scoliometer (inclinometer) used as adjunct to improve specificity.", "reference": "Physiopedia Adam's Forward Bend Test; WikiSM; Spine 1999 Karachalios", "display_priority": 99, "region_pab_id": "thoracic", "region_label": "Thoracic Spine"}, {"id": 41, "primary_region_id": 10, "name": "Greater Trochanteric Pain Syndrome (GTPS)", "short_name": null, "condition_category": "Musculoskeletal", "icd_concept": "Gluteal tendinopathy / lateral hip pain syndrome", "context": "GTPS is the clinical syndrome of lateral hip pain centred on the greater trochanter, predominantly due to gluteus medius and minimus tendinopathy rather than trochanteric bursitis as previously thought. Common in women >40, runners, and those with sustained hip adduction loading. Gold standard: MRI with gadolinium.", "reference": "Grimaldi & Fearon 2015 J Orthop Sports Phys Ther; Reiman et al. 2013 Br J Sports Med; Reiman et al. 2015b", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 42, "primary_region_id": 1, "name": "Musculoskeletal / Abdominal Wall", "short_name": null, "condition_category": null, "icd_concept": null, "context": null, "reference": null, "display_priority": 99, "region_pab_id": "abdominal", "region_label": "Abdominal / Visceral"}, {"id": 43, "primary_region_id": 1, "name": "Visceral", "short_name": null, "condition_category": null, "icd_concept": null, "context": null, "reference": null, "display_priority": 99, "region_pab_id": "abdominal", "region_label": "Abdominal / Visceral"}, {"id": 44, "primary_region_id": 2, "name": "Syndesmosis / High Ankle Sprain", "short_name": null, "condition_category": null, "icd_concept": null, "context": null, "reference": null, "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 45, "primary_region_id": 2, "name": "Peroneal Tendinopathy", "short_name": null, "condition_category": null, "icd_concept": null, "context": null, "reference": null, "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 46, "primary_region_id": 2, "name": "Posterior Tibial Tendon Dysfunction", "short_name": null, "condition_c
