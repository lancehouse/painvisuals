mptoms?", "positive_finding": "Yes \u2014 trauma or manipulation preceding onset", "significance": "Screen for CAD \u2014 dissection can follow minor trauma, lifting, or cervical manipulation; onset may be delayed by hours to days", "display_order": 1, "region_label": "Cervical Spine"}, {"id": 116, "region_id": 3, "condition_id": null, "category": "history", "question_text": "For headache: is it associated with nausea, photophobia, phonophobia, or pulsating quality?", "positive_finding": "Yes \u2014 migraine-associated features", "significance": "Differentiates cervicogenic headache (unilateral, occipital onset, neck movement triggers, no pulsating) from migraine (pulsating, nausea, photophobia/phonophobia)", "display_order": 2, "region_label": "Cervical Spine"}, {"id": 117, "region_id": 3, "condition_id": null, "category": "aggravating", "question_text": "Is looking up (overhead work \u2014 painting ceiling, watching a fireworks display) a main aggravating position?", "positive_finding": "Yes \u2014 sustained cervical extension provokes", "significance": "Cervical extension loads the IVF and posterior joints; also provocative in TOS \u2014 clarify whether arm symptoms worsen with overhead", "display_order": 1, "region_label": "Cervical Spine"}, {"id": 118, "region_id": 3, "condition_id": null, "category": "aggravating", "question_text": "Is reversing the car, crossing the road (shoulder check), or turning to look behind painful?", "positive_finding": "Yes \u2014 cervical rotation provokes", "significance": "Rotation loads the facet, IVF, and disc; if accompanied by neurological symptoms consider VBI; screen before sustained rotation testing", "display_order": 2, "region_label": "Cervical Spine"}, {"id": 119, "region_id": 3, "condition_id": null, "category": "aggravating", "question_text": "Does sustained reading, computer work, or looking down worsen symptoms?", "positive_finding": "Yes \u2014 sustained cervical flexion provokes", "significance": "Flexion loading of the cervical disc and posterior musculature; common postural aggravator in cervicogenic headache and discogenic pain", "display_order": 3, "region_label": "Cervical Spine"}, {"id": 120, "region_id": 3, "condition_id": null, "category": "aggravating", "question_text": "Is the sleeping position provocative \u2014 particularly sleeping prone, or with awkward rotation or side flexion?", "positive_finding": "Yes \u2014 nocturnal posture provokes", "significance": "Assess sleeping posture; prone sleeping requires sustained cervical rotation throughout the night and should be modified", "display_order": 4, "region_label": "Cervical Spine"}, {"id": 121, "region_id": 3, "condition_id": null, "category": "easing", "question_text": "Does supporting the head or neck (hand under occiput, pillow adjustment) relieve symptoms?", "positive_finding": "Yes \u2014 unloading cervical spine reduces pain", "significance": "Compressive/positional mechanical cervical pain \u2014 relief with head support confirms loading as a pain driver", "display_order": 1, "region_label": "Cervical Spine"}, {"id": 122, "region_id": 3, "condition_id": null, "category": "easing", "question_text": "Does resting the hand on top of the head relieve arm or hand pain or tingling?", "positive_finding": "Yes \u2014 arm pain relieved by shoulder abduction / hand-on-head position", "significance": "Shoulder abduction sign \u2014 relieves tension on the nerve root by reducing IVF compression; specific for cervical radiculopathy", "display_order": 2, "region_label": "Cervical Spine"}, {"id": 123, "region_id": 3, "condition_id": null, "category": "easing", "question_text": "Does supporting the arm (resting on a pillow or support) ease shoulder or arm symptoms?", "positive_finding": "Yes \u2014 arm support relieves shoulder/arm symptoms", "significance": "Implicates the neurovascular bundle \u2014 brachial plexus or TOS; arm elevation reduces tension on structures traversing the first rib and clavicle", "display_order": 3, "region_label": "Cervical Spine"}, {"id": 124, "region_id": 15, "condition_id": null, "category": "pain_character", "question_text": "Is the pain associated with a painful arc of movement, particularly between 60\u00b0 and 120\u00b0 of arm elevation?", "positive_finding": "Yes \u2014 painful arc", "significance": "Subacromial impingement or rotator cuff pathology \u2014 pain in mid-arc reflects contact of inflamed tissue under the acromion; clearing above 120\u00b0 is confirmatory", "display_order": 1, "region_label": "Shoulder"}, {"id": 125, "region_id": 15, "condition_id": null, "category": "pain_character", "question_text": "Any clunking or clicking at the shoulder associated with a sense of the shoulder slipping or giving way?", "positive_finding": "Yes \u2014 mechanical clunk with instability", "significance": "Glenohumeral instability and/or labral pathology (SLAP); distinguish from AC joint click (end-range horizontal flexion) and benign crepitus", "display_order": 2, "region_label": "Shoulder"}, {"id": 126, "region_id": 15, "condition_id": null, "category": "pain_character", "question_text": "Any vascular symptoms in the arm \u2014 coldness, colour change, or loss of sensation, particularly during or after overhead activity?", "positive_finding": "Yes \u2014 vascular symptoms provoked by overhead or sustained arm position", "significance": "Thoracic outlet syndrome \u2014 vascular supply to upper limb passes through the thoracic outlet; assess Allen Test and vascular provocation tests", "display_order": 3, "region_label": "Shoulder"}, {"id": 127, "region_id": 15, "condition_id": null, "category": "aggravating", "question_text": "Is reaching behind the back (internal rotation in adduction \u2014 hand-behind-back position) a main aggravating movement?", "positive_finding": "Yes \u2014 hand-behind-back provokes", "significance": "Implicates posterior capsule tightness or inferior stability; also provocative in subscapularis and SLAP pathology", "display_order": 1, "region_label": "Shoulder"}, {"id": 128, "region_id": 15, "condition_id": null, "category": "aggravating", "question_text": "Is overhead activity (reaching up, throwing, heavy lifting overhead) the main aggravating pattern?", "positive_finding": "Yes \u2014 overhead loading provokes", "significance": "Subacromial impingement or rotator cuff \u2014 overhead movement positions the cuff under the coracoacromial arch; also TOS with vascular symptoms overhead", "display_order": 2, "region_label": "Shoulder"}, {"id": 129, "region_id": 15, "condition_id": null, "category": "aggravating", "question_text": "Is lying on the affected shoulder (ipsilateral side lying) painful?", "positive_finding": "Yes \u2014 ipsilateral side lying compresses shoulder", "significance": "Rotator cuff pathology and subacromial impingement \u2014 compression of inflamed tissue; also common in AC joint pathology", "display_order": 3, "region_label": "Shoulder"}, {"id": 130, "region_id": 15, "condition_id": null, "category": "history", "question_text": "Any previous shoulder dislocation or episodes of the shoulder slipping or feeling unstable?", "positive_finding": "Yes \u2014 prior dislocation or instability", "significance": "Prior dislocation is the strongest single risk factor for recurrence and labral tear; changes the direction and priority of examination", "display_order": 1, "region_label": "Shoulder"}, {"id": 131, "region_id": 15, "condition_id": null, "category": "red_flag_screen", "question_text": "Any cough, breathlessness, or chest pain accompanying the shoulder pain?", "positive_finding": "Yes \u2014 concurrent respiratory or cardiac symptoms", "significance": "Screen for visceral referral \u2014 lungs, heart, diaphragm, gallbladder, and spleen can all refer to the shoulder; also screen for cervical artery dysfunction", "display_order": 1, "region_label": "Shoulder"}, {"id": 132, "region_id": 10, "condition_id": null, "category": "pain_character", "question_text": "Any locking, clicking, or catching sensation deep in the hip (felt inside the joint rather than around it)?", "positive_finding": "Yes \u2014 intra-articular mechanical symptoms", "significance": "Associated with FAI (labral tear or impingement) \u2014 locking and catching suggest loose body or labral displacement; distinguish from external snapping hip (ITB or psoas)", "display_order": 1, "region_label": "Hip"}, {"id": 133, "region_id": 10, "condition_id": null, "category": "pain_character", "question_text": "Deep coarse crepitus in the hip, particularly in an older patient?", "positive_finding": "Yes \u2014 coarse articular crepitus", "significance": "Degenerative changes \u2014 consider hip OA; distinguish from soft tissue clicking (benign)", "display_order": 2, "region_label": "Hip"}, {"id": 134, "region_id": 10, "condition_id": null, "category": "pain_character", "question_text": "Where precisely is the main pain \u2014 groin, anterior thigh, lateral hip, or buttock?", "positive_finding": "Note specific location", "significance": "Location guides differential: groin / anterior = FAI / OA / psoas; lateral hip = GTPS / gluteal tendinopathy; buttock = SIJ / deep gluteal / proximal hamstring", "display_order": 3, "region_label": "Hip"}, {"id": 135, "region_id": 10, "condition_id": null, "category": "aggravating", "question_text": "Is crossing the legs, or sitting with the hip in an adducted or flexed position, painful?", "positive_finding": "Yes \u2014 hip adduction / flexion loading provokes", "significance": "Implicates FAI (FADDIR position) or hip OA \u2014 activities loading the anterior hip in flexion are characteristically provocative", "display_order": 1, "region_label": "Hip"}, {"id": 136, "region_id": 10, "condition_id": null, "category": "aggravating", "question_text": "Does putting on shoes or socks (hip flexion past 90\u00b0) provoke pain?", "positive_finding": "Yes \u2014 hip flexion past 90\u00b0 provokes", "significance": "FAI or hip OA \u2014 requires full hip flexion with compression; a reliable and simple aggravating pattern to ask about", "display_order": 2, "region_label": "Hip"}, {"id": 137, "region_id": 10, "condition_id": null, "category": "aggravating", "question_text": "Is lying on the painful side (ipsilateral side lying) painful at the outer hip or buttock?", "positive_finding": "Yes \u2014 ipsilateral side lying provokes lateral hip", "significance": "Greater trochanteric pain syndrome (GTPS) / gluteal tendinopathy \u2014 compression of the tendon against the greater trochanter; one of the most characteristic aggravating patterns", "display_order": 3, "region_label": "Hip"}, {"id": 138, "region_id": 10, "condition_id": null, "category": "aggravating", "question_text": "Is lying on the opposite side painful \u2014 with the painful hip falling across into adduction?", "positive_finding": "Yes \u2014 contralateral side lying provokes", "significance": "Hip OA or adductor / groin pain \u2014 the hip adducts under gravity when lying on the contralateral side", "display_order": 4, "region_label": "Hip"}, {"id": 139, "region_id": 10, "condition_id": null, "category": "red_flag_screen", "question_text": "Any pulsing or throbbing sensation felt in the groin?", "positive_finding": "Yes \u2014 groin pulsation", "significance": "Screen for AAA \u2014 groin pulsation is a vascular red flag; refer urgently if cardiovascular risk factors present", "display_order": 1, "region_label": "Hip"}, {"id": 140, "region_id": 10, "condition_id": null, "category": "red_flag_screen", "question_text": "Any blood in the urine (haematuria)?", "positive_finding": "Yes \u2014 haematuria", "significance": "Screen for renal or urological pathology \u2014 malignant and non-malignant causes; hip pain with haematuria requires urgent investigation", "display_order": 2, "region_label": "Hip"}, {"id": 141, "region_id": 10, "condition_id": null, "category": "red_flag_screen", "question_text": "Any testicular swelling, pain, or change in size?", "positive_finding": "Yes \u2014 testicular abnormality", "significance": "Screen for testicular pathology \u2014 malignant and non-malignant causes; urgent referral", "display_order": 3, "region_label": "Hip"}, {"id": 142, "region_id": 11, "condition_id": null, "category": "pain_character", "question_text": "Is the knee locking \u2014 does it get stuck at a certain point and refuse to straighten, requiring manipulation to unlock?", "positive_finding": "Yes \u2014 true mechanical locking", "significance": "Strongly implicates intra-articular derangement such as bucket-handle meniscal tear; distinguish from pseudo-locking due to pain inhibition or spasm (where full extension is eventually possible)", "display_order": 1, "region_label": "Knee"}, {"id": 143, "region_id": 11, "condition_id": null, "category": "pain_character", "question_text": "Does the knee give way unexpectedly?", "positive_finding": "Yes \u2014 giving way", "significance": "Implicates ligamentous instability (ACL/PCL/collateral) or pain inhibition / quadriceps weakness \u2014 establish which is more likely from mechanism and patient description", "display_order": 2, "region_label": "Knee"}, {"id": 144, "region_id": 11, "condition_id": null, "category": "pain_character", "question_text": "Is the main pain felt at the front of the knee (kneecap area), or deeper within the joint?", "positive_finding": "Anterior / kneecap = PFJ; deep within = tibio-femoral", "significance": "Depth of symptoms discriminates patellofemoral (PFJ) from tibio-femoral pathology \u2014 useful before objective testing", "display_order": 3, "region_label": "Knee"}, {"id": 145, "region_id": 11, "condition_id": null, "category": "history", "question_text": "Did the knee swell up within a few hours of an injury (immediate haemarthrosis)?", "positive_finding": "Yes \u2014 rapid onset swelling after injury", "significance": "Immediate haemarthrosis is strongly associated with ACL rupture \u2014 also consider patellar dislocation or osteochondral injury", "display_order": 1, "region_label": "Knee"}, {"id": 146, "region_id": 11, "condition_id": null, "category": "history", "question_text": "What was the mechanism of injury \u2014 twisting under load, direct blow, hyperextension, or valgus force?", "positive_finding": "Note direction and loading pattern", "significance": "Mechanism determines at-risk structure: ACL = flexion/rotation under load or hyperextension; MCL = valgus; PCL = direct posterior blow ('dashboard'); meniscus = compression + rotation", "display_order": 2, "region_label": "Knee"}, {"id": 147, "region_id": 11, "condition_id": null, "category": "history", "question_text": "Age: is the patient elderly (OA), a young teenager with tibial tubercle pain (Osgood-Schlatter), or middle-aged with mechanical symptoms (meniscal)?", "positive_finding": "Note age group", "significance": "Age is a strong predictor of diagnosis \u2014 this guides differential priority before examination", "display_order": 3, "region_label": "Knee"}, {"id": 148, "region_id": 11, "condition_id": null, "category": "aggravating", "question_text": "Is kneeling, prolonged sitting ('movie sign'), or stair climbing the main aggravating pattern?", "positive_finding": "Yes \u2014 PFJ-loading positions provoke", "significance": "Patellofemoral pain syndrome (PFPS) \u2014 these positions increase patellofemoral joint reaction force; the movie sign (stiffness after prolonged sitting) is highly characteristic", "display_order": 1, "region_label": "Knee"}, {"id": 149, "region_id": 11, "condition_id": null, "category": "aggravating", "question_text": "Is deep squatting or full knee flexion (end range) particularly provocative?", "positive_finding": "Yes \u2014 end-range flexion provokes", "significance": "More consistent with meniscal pathology \u2014 meniscal tissue is compressed at end-range flexion; less typical of PFJ (which is worse in mid-range and loaded positions)", "display_order": 2, "region_label": "Knee"}, {"id": 150, "region_id": 2, "condition_id": null, "category": "pain_character", "question_text": "Any giving way around the ankle, or a sensation of the ankle rolling involuntarily?", "positive_finding": "Yes \u2014 instability / giving way", "significance": "Lateral ankle instability \u2014 common after repeated inversion sprains as capsuloligamentous laxity accumulates", "display_order": 1, "region_label": "Ankle"}, {"id": 151, "region_id": 2, "condition_id": null, "category": "pain_character", "question_text": "Is the ankle or foot pain very precisely localised \u2014 can the patient point to a single spot?", "positive_finding": "Yes \u2014 precise localisation", "significance": "Knowledge of anatomy is essential: precise localisation guides structure identification; also discriminates peripheral nerve from spinal nerve from vascular from CRPS distribution", "display_order": 2, "region_label": "Ankle"}, {"id": 152, "region_id": 2, "condition_id": null, "category": "history", "question_text": "Any history of previous ankle sprains, with each one happening from less provocation than the last?", "positive_finding": "Yes \u2014 recurrent sprains with progressive instability", "significance": "Progressive ligamentous instability \u2014 each inversion sprain causes cumulative capsuloligamentous laxity; assess for functional instability", "display_order": 1, "region_label": "Ankle"}, {"id": 153, "region_id": 2, "condition_id": null, "category": "aggravating", "question_text": "Is pain worst in the morning on the first few steps \u2014 and does it improve after warming up?", "positive_finding": "Yes \u2014 start-up pain that eases with walking", "significance": "Start-up pain is a hallmark of tendinopathy or plantar fasciitis \u2014 the tendon is stiff from overnight rest; distinguishes from arthritis where pain persists throughout", "display_order": 1, "region_label": "Ankle"}, {"id": 154, "region_id": 2, "condition_id": null, "category": "aggravating", "question_text": "Does walking barefoot feel better than wearing shoes?", "positive_finding": "Yes \u2014 prefers unshod walking", "significance": "Morton's neuroma or hallux valgus \u2014 footwear compresses the forefoot and provokes neuromas; prefer to walk barefoot", "display_order": 2, "region_label": "Ankle"}, {"id": 155, "region_id": 2, "condition_id": null, "category": "red_flag_screen", "question_text": "After an ankle injury, is the patient unable to weight bear at all (take 4 steps both immediately after and at presentation)?", "positive_finding": "Yes \u2014 unable to weight bear", "significance": "Ottawa Ankle Rules \u2014 inability to weight bear closely correlates with fracture; apply rules to determine imaging need", "display_order": 1, "region_label": "Ankle"}, {"id": 156, "region_id": 2, "condition_id": null, "category": "red_flag_screen", "question_text": "Any history of diabetes mellitus \u2014 particularly with altered foot sensation, ulcers, or slow wound healing?", "positive_finding": "Yes \u2014 diabetes with foot involvement", "significance": "Diabetic neuropathy \u2014 stocking-and-glove distribution affecting light touch, proprioception, temperature, and pain; Charcot arthropathy risk; altered healing; infection risk", "display_order": 2, "region_label": "Ankle"}, {"id": 157, "region_id": 2, "condition_id": null, "category": "red_flag_screen", "question_text": "Family history of rheumatoid arthritis?", "positive_finding": "Yes \u2014 RA family history", "significance": "RA commonly presents in the small joints of the feet \u2014 screen for bilateral symmetrical joint involvement and early morning stiffness", "display_order": 3, "region_label": "Ankle"}, {"id": 158, "region_id": 5, "condition_id": null, "category": "aggravating", "question_text": "Is gripping \u2014 power gripping or lifting with the elbow extended \u2014 the main aggravating activity?", "positive_finding": "Yes \u2014 gripping provokes, especially with elbow extended", "significance": "Implicates lateral epicondylalgia (common extensor origin) with wrist extension loading or medial epicondylalgia (common flexor origin) with wrist flexion loading", "display_order": 1, "region_label": "Elbow"}, {"id": 159, "region_id": 5, "condition_id": null, "category": "aggravating", "question_text": "Is a tennis backhand, or any activity loading the wrist extensors under resistance, provocative?", "positive_finding": "Yes \u2014 wrist extensor loading reproduces elbow pain", "significance": "Common extensor origin / lateral epicondylalgia \u2014 eccentric loading of the extensor tendons is the primary mechanism", "display_order": 2, "region_label": "Elbow"}, {"id": 160, "region_id": 5, "condition_id": null, "category": "aggravating", "question_text": "Is a golf swing, or any activity loading the wrist flexors or forearm pronators under resistance, provocative?", "positive_finding": "Yes \u2014 wrist flexor / pronator loading reproduces medial elbow pain", "significance": "Common flexor origin / medial epicondylalgia \u2014 distinguish from ulnar nerve symptoms at the medial elbow", "display_order": 3, "region_label": "Elbow"}, {"id": 161, "region_id": 5, "condition_id": null, "category": "aggravating", "question_text": "Is turning a door handle, key, or any supination/pronation activity under load painful?", "positive_finding": "Yes \u2014 forearm rotation under load provokes", "significance": "Implicates the inferior radioulnar joint (IRUJ) or biceps tendon \u2014 distinguish from wrist joint pathology", "display_order": 4, "region_label": "Elbow"}, {"id": 162, "region_id": 5, "condition_id": null, "category": "aggravating", "question_text": "Is leaning on the elbow (on a table or armrest) painful at the back of the joint?", "positive_finding": "Yes \u2014 posterior elbow compression provokes", "significance": "Posterior elbow structures \u2014 olecranon bursa (olecranon bursitis) or triceps tendon insertion", "display_order": 5, "region_label": "Elbow"}, {"id": 163, "region_id": 5, "condition_id": null, "category": "aggravating", "question_text": "Does working with the arm elevated or in overhead positions worsen elbow symptoms?", "positive_finding": "Yes \u2014 elevated arm use provokes", "significance": "Altered neuromechanosensitivity \u2014 consider neural contribution alongside lateral or medial epicondylalgia", "display_order": 6, "region_label": "Elbow"}, {"id": 164, "region_id": 18, "condition_id": null, "category": "pain_character", "question_text": "Is the wrist pain more constant, present at rest, and unrelated to loading or movement?", "positive_finding": "Yes \u2014 constant rest pain", "significance": "Consider avascular necrosis \u2014 most commonly affects the scaphoid post-fracture or the lunate; insidious progressive onset", "display_order": 1, "region_label": "Wrist"}, {"id": 165, "region_id": 18, "condition_id": null, "category": "history", "question_text": "Was there a fall on an outstretched hand (FOOSH)?", "positive_finding": "Yes \u2014 FOOSH mechanism", "significance": "In older patients: distal radius or ulnar fracture; in younger patients: scaphoid fracture or TFCC / ligamentous instability \u2014 age determines most likely injury", "display_order": 1, "region_label": "Wrist"}, {"id": 166, "region_id": 18, "condition_id": null, "category": "history", "question_text": "Is the wrist pain worse at night \u2014 particularly tingling, numbness, or aching that wakes the patient from sleep?", "positive_finding": "Yes \u2014 nocturnal worsening of neural symptoms", "significance": "Carpal tunnel syndrome \u2014 nocturnal provocation is characteristic due to sustained wrist flexion posture during sleep and venous stasis in the carpal tunnel", "display_order": 2, "region_label": "Wrist"}, {"id": 167, "region_id": 18, "condition_id": null, "category": "red_flag_screen", "question_text": "Family history of rheumatoid arthritis?", "positive_finding": "Yes \u2014 RA family history", "significance": "RA commonly presents in the small joints of the hands \u2014 screen for bilateral symmetrical MCP and PIP joint swelling and prolonged morning stiffness", "display_order": 1, "region_label": "Wrist"}, {"id": 168, "region_id": 18, "condition_id": null, "category": "red_flag_screen", "question_text": "Any history of thyroid disease?", "positive_finding": "Yes \u2014 thyroid disease", "significance": "Thyroid disease increases incidence of Dupuytren's contracture, trigger finger, and CTS \u2014 screen for all three in the hand", "display_order": 2, "region_label": "Wrist"}, {"id": 169, "region_id": 18, "condition_id": null, "category": "red_flag_screen", "question_text": "Family history of Dupuytren's disease, or personal history of diabetes, alcohol use, epilepsy, or smoking?", "positive_finding": "Yes \u2014 Dupuytren's risk factors", "significance": "Risk factors for Dupuytren's contracture \u2014 fixed flexion deformity particularly affecting ring and little fingers; strong familial link", "display_order": 3, "region_label": "Wrist"}, {"id": 170, "region_id": 18, "condition_id": null, "category": "red_flag_screen", "question_text": "Known osteoporosis, or risk factors (postmenopausal, long-term steroid use, low BMI)?", "positive_finding": "Yes \u2014 osteoporosis risk", "significance": "Increased risk of radial and ulnar fractures \u2014 even low-energy FOOSH mechanism can cause fracture", "display_order": 4, "region_label": "Wrist"}, {"id": 171, "region_id": 18, "condition_id": null, "category": "red_flag_screen", "question_text": "Any history of diabetes?", "positive_finding": "Yes \u2014 diabetes", "significance": "Increased incidence of CTS, flexor tendon tenosynovitis, and Dupuytren's disease in diabetics; also impaired tissue healing post-fracture due to vascular deficits", "display_order": 5, "region_label": "Wrist"}], "clinical_concepts": [{"id": 1, "name": "Chronic Pain & Central Sensitisation Screening", "category": "screening", "region_id": null, "content": "## A Physiotherapy Clinical Reference\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## PART 1: DEFINITIONS & CONCEPTUAL FRAMEWORK\n\n### What is Central Sensitisation (CS)?\n\nCentral sensitisation (CS) is defined by the IASP as \"increased responsiveness of nociceptive neurons in the central nervous system to their normal or subthreshold afferent input.\" It represents a fundamental form of synaptic plasticity that amplifies pain signals and underlies chronic pain hypersensitivity.\n\nCS involves:\n\n- Altered sensory processing in the brain\n\n- Increased activity in nociceptive facilitatory pathways\n\n- Poor functioning of endogenous analgesia\n\n- Increased responsiveness to a variety of sensory inputs (tactile, thermal, mechanical)\n\n### Nociplastic Pain (IASP 2017/2022)\n\nNociplastic pain is the third mechanistic pain descriptor (alongside nociceptive and neuropathic), adopted by the IASP in 2017. Clinical criteria focus on:\n\n- Presence of central sensitisation features (widespread pain, hypersensitivity to sensory stimuli)\n\n- Associated symptoms: fatigue, cognitive difficulties (\"brain fog\"), sleep disturbance\n\n- Ruling out predominantly nociceptive or neuropathic origins\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## PART 2: STEP-BY-STEP CLINICAL SCREENING FRAMEWORK\n\n### STEP 1 \u2014 Subjective Red Flags for CS/Nociplastic Pain\n\nAsk these questions during history-taking:\n\n**Pain Characteristics**\n\n- \"Does your pain spread beyond where you originally injured/hurt yourself?\"\n\n- \"Does your pain seem out of proportion to what you'd expect from your injury?\"\n\n- \"Does your pain seem to move around or change location?\"\n\n- \"Does your whole body feel more sensitive or sore?\"\n\n**Sensory Hypersensitivity**\n\n- \"Are you sensitive to light, noise, or smells more than usual?\"\n\n- \"Does light touch \u2014 like clothing or a gentle brush \u2014 cause pain?\"\n\n- \"Does temperature (hot or cold) affect your pain more than expected?\"\n\n**Associated Symptoms (CSS Cluster)**\n\n- \"Do you experience significant fatigue regardless of activity?\"\n\n- \"Do you have difficulty concentrating or remembering things (brain fog)?\"\n\n- \"Do you have sleep problems that don't seem to improve?\"\n\n- \"Do you have irritable bowel, bladder urgency, or headaches alongside your pain?\"\n\n- \"Does stress or emotional upset significantly worsen your pain?\"\n\n**Temporal Pattern**\n\n- \"Has your pain stayed the same or gotten worse despite treatment that should be helping?\"\n\n- \"Do you have good days and bad days that seem unrelated to what you've done physically?\"\n\n- \"Is your pain worse in the morning and improves through the day \u2014 or unpredictably variable?\"\n\n**Yellow Flags (Psychosocial)**\n\n- \"Do you believe your pain means something is seriously damaged or wrong?\"\n\n- \"Do you avoid activities because you fear making things worse?\"\n\n- \"Has your pain affected your mood, relationships, or work significantly?\"\n\n- \"Do you feel like nothing will help your pain?\"\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n### STEP 2 \u2014 Objective Clinical Indicators of CS\n\n**On Physical Examination \u2014 Look for:**\n\n| **Feature** | **What to Look For** | **CS Indicator** |\n|----|----|----|\n| **Widespread pain on palpation** | Tenderness beyond the primary complaint region | Positive \u2014 CS if pain spreads beyond expected anatomical area |\n| **Allodynia** | Pain from normally non-painful stimuli (light touch, clothing) | Strong CS indicator |\n| **Hyperalgesia** | Exaggerated pain response to normally mildly painful stimuli | Strong CS indicator |\n| **Secondary hyperalgesia** | Tenderness at sites remote from the primary pain | Indicates central wind-up |\n| **Disproportionate pain on exam** | Pain response exceeds what examination findings would predict | Key clinical indicator |\n| **Inconsistent/variable findings** | Mechanical tests positive one session, negative the next | Suggests central rather than peripheral driver |\n| **Antalgic postures** | Global protective posturing beyond the injured region | Possible CS contribution |\n| **Diffuse muscle tenderness** | Generalised myofascial tenderness beyond primary site | Consistent with central sensitisation |\n\n**Quantitative Sensory Testing (QST) \u2014 if available:**\n\n- Pressure Pain Threshold (PPT): reduced at local AND remote sites = CS\n\n- Conditioned Pain Modulation (CPM): impaired = reduced descending inhibition (CS)\n\n- Temporal Summation: exaggerated wind-up to repeated stimuli = CS\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n### STEP 3 \u2014 Validated Screening Tools\n\n#### Central Sensitisation Inventory (CSI)\n\n- **What it is:** 25-item self-report questionnaire measuring symptoms associated with central sensitivity syndromes\n\n- **Scoring:** 0\u2013100 (each item 0\u20134)\n\n- **Cutoff:** Score \u226540 best distinguishes CSS patients from non-patient sample (Sensitivity 81%, Specificity 75%, AUC 0.86)\n\n- **Psychometrics:** Test-retest reliability 0.82; Cronbach's alpha 0.88\u20130.91\n\n- **Important caveat:** CSI is a screening tool, NOT a diagnostic gold standard. Elevated score in presence of active peripheral pathology does not automatically confirm nociplastic pain as the primary driver \u2014 integrate with clinical reasoning.\n\n- **Predictive value:** Higher preoperative CSI scores (\u226540) predict worse outcomes post-TKR and lumbar fusion surgery \u2014 useful for surgical risk stratification.\n\n- **Short forms:** CSI-9 and CSI-7 now available for quicker administration (cutoff ~21/36 for CSI-9); more validation work still needed.\n\n#### PainDETECT\n\n- **What it is:** Screening tool for neuropathic pain components (also used as indirect CS indicator)\n\n- **Scoring:** 0\u201338\n\n- **Interpretation:** \u226412 = neuropathic unlikely; 13\u201318 = uncertain; \u226519 = neuropathic likely\n\n- **Note:** Screening tool only \u2014 not diagnostic for neuropathic or nociplastic pain\n\n#### STarT Back Screening Tool\n\n- **What it is:** 9-item psychosocial risk stratification tool for low back pain\n\n- **Produces:** Low / medium / high risk categories for persistent disabling back pain\n\n- **Validated** for treatment matching \u2014 low risk = minimal intervention; high risk = psychologically informed physiotherapy\n\n- **Predictive validity:** Successfully separates patients into distinct categories of risk for persistent disabling back pain\n\n#### Other Useful Tools\n\n| **Tool** | **What it Measures** | **Cutoff / Score** |\n|----|----|----|\n| **Pain Catastrophising Scale (PCS)** | Rumination, magnification, helplessness | \u226530 = clinically significant catastrophising |\n| **Tampa Scale of Kinesiophobia (TSK-11)** | Fear of movement / re-injury | Higher = greater kinesiophobia |\n| **Pain Self-Efficacy Questionnaire (PSEQ)** | Confidence to do activities despite pain | Lower = poorer self-efficacy |\n| **PHQ-9** | Depression screen | \u226510 = moderate depression |\n| **GAD-7** | Anxiety screen | \u226510 = moderate anxiety |\n| **Orebro Musculoskeletal Pain Screening Questionnaire** | Broad psychosocial yellow flags | Risk stratification for chronicity |\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n### STEP 4 \u2014 CS Pattern Recognition: Clinical Clusters\n\n**HIGH LIKELIHOOD of CS/Nociplastic Pain \u2014 if 5+ of the following present:**\n\n- Pain duration \\>3 months\n\n- Pain disproportionate to structural findings\n\n- Widespread or spreading pain beyond original site\n\n- Allodynia or hyperalgesia on exam\n\n- Associated symptoms: fatigue, brain fog, sleep disturbance\n\n- Stress/emotions as significant pain modulators\n\n- Multiple failed treatments that should theoretically work\n\n- Comorbid conditions: IBS, chronic fatigue, headache, bladder urgency\n\n- CSI score \u226540\n\n- High catastrophising (PCS \u226530) or kinesiophobia (high TSK)\n\n**MIXED PHENOTYPE \u2014 peripheral + central components \u2014 consider if:**\n\n- Structural pathology confirmed on imaging BUT pain exceeds what imaging explains\n\n- Pain spreads beyond the injured structure\n\n- Treatment of the peripheral source provides only partial relief\n\n- CSI 30\u201340 range\n\n- Moderate psychosocial yellow flags\n\n**PRIMARILY PERIPHERAL \u2014 CS less likely if:**\n\n- Pain well-localised and proportionate\n\n- Clear mechanical pattern (on/off with specific movements)\n\n- No spreading or associated symptoms\n\n- Normal sensory testing remote from injury\n\n- CSI \\<30, low psychosocial flags\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## PART 3: TREATMENT IMPLICATIONS BY PHENOTYPE\n\n| **Component** | **Primarily Peripheral** | **Mixed** | **CS/Nociplastic Dominant** |\n|----|----|----|----|\n| **Hands-on manual therapy** | High utility | Moderate utility | Use carefully \u2014 may reinforce tissue-focused model |\n| **Exercise** | Biomechanical focus | Combined approach | Graded exposure \u2014 pacing critical |\n| **Pain neuroscience education (PNE)** | Brief / optional | Important adjunct | **Essential \u2014 first-line** |\n| **Graded activity / exposure** | Secondary | Important | **Core component** |\n| **Psychologically informed practice** | Not primary | Important | **Essential** |\n| **Mindfulness / relaxation** | Optional | Useful | Strongly recommended |\n| **Sleep hygiene** | Optional | Important | Important |\n| **Referral for psychological support** | Not usually needed | Consider | **Recommend if available** |\n| **Multidisciplinary pain program** | Not indicated | Consider if stalled | **Strongly consider** |\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## PART 4: RED FLAGS WITHIN CHRONIC PAIN PRESENTATIONS\n\nThe following require urgent medical review regardless of CS features:\n\n- New neurological deficits (weakness, bowel/bladder change)\n\n- Pain at rest unrelated to position or activity + night sweats, unexplained weight loss (malignancy screen)\n\n- Severe, unremitting pain not responding to any intervention\n\n- New onset widespread pain in patient \\>50 years (inflammatory screen: ESR, CRP, ANA, RF)\n\n- Significant mood disorder or suicidality \u2014 immediate psychology/psychiatry referral\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## SOURCES\n\n1.  IASP (2017/2022). Nociplastic Pain Clinical Criteria and Grading System. International Association for the Study of Pain.\n\n2.  Kosek E et al. (2021). Do we need a third mechanistic pain descriptor, nociplastic pain? Pain, 162(7):1849\u20131860.\n\n3.  Mayer TG et al. (2012). The development and psychometric validation of the Central Sensitization Inventory. Pain Practice, 12(4):276\u2013285. \\[PubMed 21951710\\]\n\n4.  Neblett R et al. (2013). The Central Sensitization Inventory (CSI): establishing clinically significant values. Journal of Pain, 14(5):438\u2013445. \\[PubMed 23490634\\]\n\n5.  Nijs J, Huysmans E (2022). Clinimetrics: The Central Sensitisation Inventory. Journal of Physiotherapy, 68(3).\n\n6.  Woolf CJ (2011). Central sensitization: implications for the diagnosis and treatment of pain. Pain, 152(3 Suppl):S2-15.\n\n7.  Bodes Pardo G et al. (2018). Pain Neuroscience Education for Patients With Chronic Musculoskeletal Pain. Physical Therapy, 98(5):356\u2013368.\n\n8.  Hill JC et al. (2011). Comparison of STarT Back risk groups. The Lancet.\n\n9.  George SZ et al. (2016). Development of a Yellow Flag Assessment Tool for Orthopaedic Physical Therapy. JOSPT, 46(5):334\u2013347.\n\n10. Nijs J et al. (2014). Applying modern pain neuroscience in clinical practice: criteria for the classification of central sensitization pain. Pain Physician, 17(5):447\u2013457.\n\n11. IASP (2020). Raja SN et al. The revised IASP definition of pain. Pain, 161(9):1976\u20131982.\n\n12. Smart KM et al. (2012). Mechanisms-based classifications of musculoskeletal pain. Clinical Journal of Pain, 28(5):397\u2013405.", "source_file": "Chronic Pain and Central Sensitisation Screening.md"}, {"id": 2, "name": "Clinical Special Tests \u2014 Pitfalls and False Positives", "category": "pitfalls", "region_id": null, "content": "## Overarching Principle \u2014 Apply to ALL Tests\n\nThe quality of special test evidence is often poor: most studies are underpowered, use case-control rather than real clinical populations (spectrum bias), and have varying reference standards. Single positive tests should rarely drive clinical decisions \u2014 use test clusters and integrate with history and subjective findings.\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Shoulder\n\n**Hawkins-Kennedy & Neer \u2014 impingement tests:**\n\n- High sensitivity (~80%) but low specificity (~59\u201360%) \u2014 positive in many non-impingement shoulder conditions\n\n- Also positive in AC joint pathology, SLAP tears, internal impingement, and even Bankart lesions\n\n- **Pitfall:** A positive Hawkins-Kennedy does not confirm impingement \u2014 use it to rule *out* (high sensitivity), not rule *in*\n\n- Pain inhibition confounds strength-based tests (Empty Can, Full Can, Lag Sign) \u2014 a \"weak\" test may reflect pain inhibition rather than true tear\n\n**Internal impingement false positives:**\n\n- Neer, Hawkins, and horizontal adduction tests can provoke the mechanism of internal impingement in overhead athletes \u2014 positive findings may be misattributed to subacromial pathology\n\n**Rotator cuff test clusters:**\n\n- No single test confirms RC tendinopathy \u2014 requires 3 of 5 positive (Hawkins-Kennedy, Neer, Painful Arc, Empty Can, ER resistance) for meaningful LR+\n\n- **Pitfall:** Using one test in isolation grossly overestimates diagnostic confidence\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Lumbar Spine & Neural Tests\n\n**Straight Leg Raise (SLR):**\n\n- Back pain on SLR is not a positive test \u2014 only dermatomal leg pain below the knee is a true positive\n\n- Hamstring tightness must be differentiated from posterior thigh tension \u2014 tight hamstrings cause posterior thigh pull at low angles, mimicking neural tension\n\n- SLR is unreliable at higher lumbar levels (L1\u2013L3) \u2014 poor sensitivity for stenosis\n\n- **Pitfall:** Pain only in the posterior thigh without distal radiation = often hamstring, not radiculopathy\n\n**Slump Test:**\n\n- Very sensitive for neural mechanosensitivity but not specific to a structural cause \u2014 positive in athletes with hamstring tightness, in nociplastic presentations, and in people with adverse neural tension unrelated to disc pathology\n\n- **Pitfall:** A positive slump does not equal disc herniation \u2014 it confirms neural sensitivity only\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## SIJ Tests\n\n**Individual SIJ provocation tests:**\n\n- No single test is reliable \u2014 Laslett's cluster (\u22653 of 5 positive) is required for meaningful diagnostic accuracy (Sn 0.94, Sp 0.78)\n\n- **Pitfall:** Testing only one or two SIJ tests and calling it positive \u2014 this is clinically meaningless without the full cluster\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Hip\n\n**FADIR:**\n\n- Extremely sensitive (0.96) but very low specificity (0.11) \u2014 almost everyone with hip pain will test positive\n\n- **Pitfall:** FADIR positive \u2260 FAI \u2014 it is a screening tool only; a negative is useful to rule out intra-articular pathology, a positive tells you almost nothing specific\n\n**FABER:**\n\n- Sensitive for intra-articular pathology but also positive in SIJ dysfunction, hip flexor tightness, and adductor pathology\n\n- **Pitfall:** Always consider which structure is being stressed \u2014 anterior groin pain = hip joint; posterior pain = SIJ; medial = adductor\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Knee\n\n**Lachman's Test:**\n\n- Very high specificity (\\>95%) but sensitivity is reduced in acute presentations with guarding, haemarthrosis, and patient apprehension\n\n- **Pitfall:** Acute injury with swelling and pain can produce a false negative due to muscle splinting \u2014 repeat at 7\u201310 days if clinical suspicion remains high\n\n**McMurray:**\n\n- Positive click \u2260 meniscal pathology \u2014 clicks are common in asymptomatic knees\n\n- **Pitfall:** Only a painful click with reproduction of familiar symptoms is a true positive; an audible but painless click should not be over-interpreted\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Ankle\n\n**Ottawa Ankle Rules:**\n\n- Sensitivity is excellent (94\u201395%) but specificity is poor (37\u201357%) \u2014 high false positive rate\n\n- **Pitfall:** Ottawa rules tell you when to image, not when a fracture is present; positive = image, not \"fracture confirmed\"\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Neural/Sensory Tests\n\n**Pressure Pain Threshold (PPT):**\n\n- Operator technique and patient anxiety/expectation heavily influence results\n\n- **Pitfall:** PPT is most useful for tracking change within a patient over time \u2014 cross-sectional single measurements without normative reference values have limited diagnostic specificity\n\n**Central Sensitisation Inventory (CSI):**\n\n- Self-report tool \u2014 does not diagnose nociplastic pain; it identifies features consistent with central sensitisation\n\n- **Pitfall:** Elevated CSI score in the presence of active peripheral pathology does not automatically mean nociplastic pain is the primary driver \u2014 always integrate with clinical reasoning\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## The Big Three Universal Pitfalls\n\n1.  **Pain inhibition** \u2014 any strength-based test (power assessment, resisted tests) can produce false weakness due to pain, fear, or apprehension \u2014 always factor this in before attributing weakness to true myotomal deficit\n\n2.  **Single test reliance** \u2014 virtually no individual special test has sufficient specificity to stand alone; use clusters\n\n3.  **Pre-test probability** \u2014 a positive test in a low-prevalence population produces mostly false positives (Bayesian reasoning); always anchor to the clinical picture before applying test results\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Sources\n\n- Hegedus et al. (2008, 2012) \u2014 Systematic reviews of shoulder special test diagnostic accuracy. British Journal of Sports Medicine.\n\n- Laslett et al. (2005) \u2014 Diagnosis of sacroiliac joint pain. Manual Therapy.\n\n- Cook & Hegedus (2013) \u2014 Orthopedic Physical Examination Tests: An Evidence-Based Approach. Pearson.\n\n- Cleland & Koppenhaver (2011) \u2014 Netter's Orthopaedic Clinical Examination. Elsevier.\n\n- Smart et al. (2012) \u2014 Mechanisms-based classifications of musculoskeletal pain. Manual Therapy.\n\n- Tasmanian Guidelines for Assessment of Permanent Impairment, Version 3.\n\n- PubMed Central: Tests for diagnosing subacromial impingement syndrome and rotator cuff disease (PMC4935057).\n\n- PubMed Central: Internal Impingement of the Shoulder \u2014 Risk of False Positive Test Results (PMC5585665).", "source_file": "Clinical Special Tests - Pitfalls and False Positi.md"}, {"id": 3, "name": "Mechanical vs Inflammatory Pain Patterns", "category": "inflammatory", "region_id": null, "content": "## Physiotherapy Clinical Reference\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Core Differentiation: Mechanical vs Inflammatory\n\n| **Feature** | **Mechanical** | **Inflammatory** |\n|----|----|----|\n| **Onset** | Often sudden or related to activity/load | Insidious, gradual |\n| **Age of onset** | Any age | Often \\<40 years (especially SpA) |\n| **Pain with activity** | Worsens | Often improves with movement |\n| **Pain at rest** | Improves | Persists or worsens |\n| **Night pain** | Uncommon (positional only) | Common \u2014 wakes patient in second half of night |\n| **Morning stiffness** | Short: \\<30 minutes | Prolonged: \\>45\u201360 minutes |\n| **Eased by** | Rest, position change | Gentle movement, exercise, warm shower |\n| **Aggravated by** | Specific movements, loading, end of day | Prolonged rest, inactivity |\n| **Joint pattern** | Often asymmetric, single joint or region | Symmetric, polyarticular common |\n| **Swelling** | Bony / hard; or mild fluid (no warmth) | Soft, warm, sometimes erythematous |\n| **Systemic features** | Absent | Fatigue, fever, weight loss, malaise |\n| **Response to NSAIDs** | Partial / variable | Often marked improvement |\n| **Course** | Fluctuates with activity | Progressive or episodic flares |\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## ASAS Criteria for Inflammatory Back Pain\n\n*(\u22654/5 features = sensitivity 77%, specificity 91.7%)*\n\nRanked by diagnostic strength (odds ratios):\n\n1.  **Improvement with exercise** (OR 23.1)\n\n2.  **Pain at night** with improvement on getting up (OR 20.4)\n\n3.  **Insidious onset** (OR 12.7)\n\n4.  **Age at onset \\<40 years** (OR 9.9)\n\n5.  **No improvement with rest** (OR 7.7)\n\n*Note: Morning stiffness alone is non-specific and does not reliably differentiate mechanical from inflammatory back pain.*\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Inflammatory Subtypes: Key Clinical Differentiation\n\n| **Feature** | **Rheumatoid Arthritis (RA)** | **Ankylosing Spondylitis (AS)** | **Psoriatic Arthritis (PsA)** | **Reactive Arthritis** |\n|----|----|----|----|----|\n| **Joint pattern** | Symmetric polyarthritis | Axial (sacroiliac + spine) | Asymmetric oligoarthritis OR axial | Asymmetric oligoarthritis |\n| **Predominant location** | Small joints: MCP, PIP, wrists, MTP | Spine, SIJ, hips | Spine, DIP joints, peripheral large joints | Lower limb large joints |\n| **DIP involvement** | Rare | No | **Yes \u2014 classic** | Uncommon |\n| **Axial involvement** | Cervical spine (late) | **Primary feature** | Variable | Uncommon |\n| **Enthesitis** | No | **Yes** (Achilles, plantar fascia, tibial tubercle) | **Yes** | Yes |\n| **Dactylitis (sausage digit)** | No | Uncommon | **Yes \u2014 characteristic** | Yes |\n| **Extra-articular features** | Rheumatoid nodules, anaemia, vasculitis | Uveitis, aortic valve disease, pulmonary fibrosis | Psoriasis, nail changes, IBD | Uveitis, urethritis, oral ulcers |\n| **HLA-B27** | No association | 95% positive | 50\u201370% (if axial) | 60\u201385% |\n| **Rheumatoid factor** | Positive (seropositive RA) | Negative | Negative | Negative |\n| **Imaging clue** | Joint erosions, periarticular osteoporosis | Sacroiliitis, syndesmophytes, bamboo spine | Asymmetric syndesmophytes, erosions + proliferation | Periostitis |\n| **Gender predominance** | Female \\> Male | Male \\> Female | Equal | Male \\> Female |\n| **Trigger** | Autoimmune | Genetic (HLA-B27) | Psoriasis / genetic | Infection (GI or GU) |\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Osteoarthritis vs RA: Quick Differentiator\n\n| **Feature** | **Osteoarthritis** | **Rheumatoid Arthritis** |\n|----|----|----|\n| **Joints** | DIP, PIP (Heberden's/Bouchard's nodes), 1st CMC, hips, knees | MCP, PIP, wrists, MTP \u2014 spares DIP |\n| **Stiffness** | \\<30 min, morning or after rest | \\>60 min morning stiffness |\n| **Swelling** | Bony, hard | Soft, boggy, warm |\n| **Systemic features** | None | Fatigue, anaemia, weight loss |\n| **Symmetry** | Often asymmetric | Symmetric |\n| **Bloods** | Normal CRP/ESR | Elevated CRP/ESR; RF / anti-CCP positive |\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Physiotherapy Clinical Implications\n\n**When to suspect inflammatory over mechanical:**\n\n- Morning stiffness \\>45 minutes\n\n- Night pain waking patient from sleep\n\n- Multiple joint involvement, especially symmetric\n\n- Improvement with activity (not rest)\n\n- Age \\<40 with insidious onset back/SIJ pain\n\n- Associated uveitis, psoriasis, IBD, or oral ulcers\n\n- Poor response to usual mechanical physiotherapy\n\n**Physiotherapy considerations in confirmed inflammatory arthritis:**\n\n- During flares: prioritise range of motion, gentle hydrotherapy, load reduction\n\n- Between flares: progressive strengthening, postural correction, aerobic conditioning\n\n- In AS: spinal extension and breathing exercises are priority; avoid sustained flexion postures\n\n- Joint protection strategies and activity pacing are core skills for RA management\n\n- Coordinate with rheumatology \u2014 do not manage inflammatory arthritis in isolation\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Red Flags Requiring Urgent Referral\n\n- Joint swelling + fever + systemic unwellness \u2014 suspect septic arthritis (emergency)\n\n- Progressive polyarthritis with systemic features \\>6 weeks \u2014 urgent rheumatology referral\n\n- Back pain in \\<45 years, insidious onset, night pain improving with activity \u2014 screen for axial SpA\n\n- Bilateral sacroiliac pain + eye inflammation \u2014 high suspicion for AS\n\n- Joint destruction or deformity on imaging without prior diagnosis\n\n- Failure to respond to 6\u20138 weeks of appropriate physiotherapy management\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Sources\n\n6.  Assessment of SpondyloArthritis International Society (ASAS) criteria for inflammatory back pain \u2014 sensitivity 77%, specificity 91.7% (\u22654/5 features). UBC CPD \u2014 This Changed My Practice. https://thischangedmypractice.com/inflammatory-back-pain/\n\n7.  StatPearls \u2014 Ankylosing Spondylitis. NCBI Bookshelf. https://www.ncbi.nlm.nih.gov/books/NBK470173/\n\n8.  APTA Orthopaedic Section Clinical Practice Guidelines \u2014 Low Back Pain. JOSPT 2012. https://www.orthopt.org/uploads/content_files/ICF/2014/6.\\_Low_Back_Pain_Guidelines\\_\\_\\_April_2012\\_\\_\\_JOSPT.pdf\n\n9.  StatPearls \u2014 Low Back Pain: Evaluation and Management. NCBI. https://www.ncbi.nlm.nih.gov/books/NBK538173/\n\n10. CMAJ \u2014 Diagnosis and management of low-back pain in primary care. https://www.cmaj.ca/content/189/45/e1386\n\n11. Reumatolog\u00eda Cl\u00ednica \u2014 Recommendations for detection, study and referral of inflammatory low back pain in primary care. https://www.reumatologiaclinica.org/en-reccomendations-for-detection-study-referral-articulo-S2173574314001518\n\n12. PMC \u2014 Physiotherapy in Rheumatoid Arthritis. https://pmc.ncbi.nlm.nih.gov/articles/PMC1395797/\n\n13. European Medical Journal \u2014 Performance of different criteria sets for inflammatory back pain in axial spondyloarthritis. https://www.emjreviews.com/rheumatology/article/performance-of-different-criteria-sets-for-inflammatory-back-pain-in-radiographic-and-nonradiographic-axial-spondyloarthritis/", "source_file": "Mechanical vs Inflammatory Pain Patterns_20260506_121751.md"}, {"id": 4, "name": "Nociceptive vs Neuropathic vs Nociplastic Pain Phenotypes", "category": "pain_mechanism", "region_id": null, "content": "## Physiotherapy Clinical Reference \u2014 Pain Mechanism-Based Classification\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## IASP Definitions\n\n- **Nociceptive:** Pain arising from actual or threatened damage to non-neural tissue, due to activation of peripheral nociceptors\n\n- **Neuropathic:** Pain caused by a lesion or disease of the somatosensory nervous system\n\n- **Nociplastic:** Pain arising from altered nociception despite no clear evidence of actual/threatened tissue damage or somatosensory system pathology \u2014 reflecting central sensitisation\n\nMixed phenotypes are common. Classification is probabilistic, not definitive.\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Core Differentiation Table\n\n| **Feature** | **Nociceptive** | **Neuropathic** | **Nociplastic** |\n|----|----|----|----|\n| **Mechanism** | Peripheral tissue nociceptor activation | Peripheral or central somatosensory system lesion/disease | Altered central nociceptive processing / central sensitisation |\n| **Pain location** | Localised to area of tissue damage / injury | Follows nerve distribution (dermatomal / peripheral nerve territory) | Widespread, diffuse, poorly localised \u2014 may spread beyond original site |\n| **Pain quality** | Aching, throbbing, sharp \u2014 proportionate to tissue state | Burning, electric, shooting, stabbing; pins & needles; numbness | Burning, deep aching, diffuse heaviness; often multiple descriptors |\n| **Proportionality** | Proportionate to tissue damage | Proportionate to neural lesion | **Disproportionate** to structural findings \u2014 hallmark feature |\n| **Onset** | Clear precipitating event / injury / posture | Clear neural event or progressive disease | Often insidious; may follow injury but persists beyond healing |\n| **Behaviour with movement** | Provoked by specific movements loading affected tissue; eases with rest or unloading | Provoked by movement stretching or compressing nerve; neural tension signs | Variable, inconsistent provocation; often difficult to identify clear mechanical pattern |\n| **Night pain** | Uncommon unless posture-related | Common \u2014 often severe, disturbing sleep | Common \u2014 associated with sleep disturbance and non-restorative sleep |\n| **Resting pain** | Mild or absent | Moderate-severe; often constant | Often present; may be spontaneous |\n| **Neurological signs** | Absent | **Present \u2014 dermatomal sensory changes, weakness, reflex change** | Absent (or present due to sensitisation \u2014 allodynia, hyperalgesia) |\n| **Allodynia / Hyperalgesia** | Localised to injury site only | In nerve territory | **Widespread, beyond original area** |\n| **Psychosocial overlay** | Usually low; pain makes sense to patient | Variable | **Often prominent \u2014 catastrophising, fear-avoidance, anxiety, depression** |\n| **Response to treatment** | Good response to local tissue-directed treatment (manual therapy, exercise loading, modalities) | Responds to neural mobilisation, TENS, medications targeting nerve pain (e.g., pregabalin, duloxetine) | Poor response to unimodal local treatment; responds better to pain education, graded exposure, psychological input, exercise pacing |\n| **Common examples** | Acute sprain, OA flare, muscle tear, early tendinopathy | Radiculopathy, carpal tunnel, peripheral neuropathy, CRPS-I/II | Fibromyalgia, widespread chronic LBP, IBS, chronic fatigue syndrome, TMD |\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Key Questions to Ask (Subjective)\n\n### Nociceptive Indicators\n\n- \"Does the pain come on with specific movements or activities and ease quickly with rest?\"\n\n- \"Can you point to exactly where it hurts \u2014 does it stay in one spot?\"\n\n- \"Did it start after a clear injury or overload?\"\n\n- \"Does it make sense to you \u2014 the more you do, the more it hurts?\"\n\n### Neuropathic Indicators\n\n- \"Do you get burning, electric, shooting or stabbing sensations?\"\n\n- \"Do you get pins and needles, numbness, or tingling?\"\n\n- \"Does the pain travel down an arm or leg in a specific path?\"\n\n- \"Do you get pain or tingling at night even when not moving?\"\n\n- \"Does light touch or clothing on the skin sometimes feel painful?\"\n\n### Nociplastic Indicators\n\n- \"Has the pain spread to areas beyond the original site over time?\"\n\n- \"Is it hard to predict what will set it off \u2014 seemingly unrelated things like stress, weather, or poor sleep?\"\n\n- \"Do you notice your whole body feels more sensitive \u2014 sounds, smells, light, other pains?\"\n\n- \"Are you sleeping poorly or feeling exhausted even without doing much?\"\n\n- \"Does the pain feel like it's out of proportion to what showed on your scan?\"\n\n- \"Do you have other conditions like IBS, bladder pain, jaw pain, or widespread achiness?\"\n\n- \"How much is the pain affecting your mood and your ability to do things you care about?\"\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Key Clinical Findings (Objective)\n\n| **Finding** | **Nociceptive** | **Neuropathic** | **Nociplastic** |\n|----|----|----|----|\n| **Palpation** | Localised tenderness over tissue source | Tenderness over nerve trunk / neural structures | Widespread tenderness \u2014 pressure pain thresholds reduced across body |\n| **Sensory testing** | Normal | Dermatomal hypo/hyperaesthesia, allodynia in nerve territory | Generalised allodynia and hyperalgesia beyond lesion site |\n| **Neurological exam** | Normal | Reflex changes, myotomal weakness, sensory loss in territory | Normal neuro exam (no structural deficit) |\n| **Neural tension tests (ULTT/SLR)** | Negative or symptom-unrelated | Positive \u2014 reproduces familiar neural symptoms | Often positive but may not reproduce familiar pain clearly |\n| **Movement assessment** | Clear mechanical pattern \u2014 specific direction provokes, opposite relieves | Neural tension postures provoke | Inconsistent, variable, often no clear directional pattern |\n| **Psychosocial screening** | Usually low distress | Variable | **Elevated \u2014 screen with CSI, PCS, TSK** |\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Screening Tools\n\n| **Tool** | **Targets** | **Use** |\n|----|----|----|\n| **PainDETECT** | Neuropathic features | 9-item questionnaire; score \\>18 = likely neuropathic |\n| **DN4** | Neuropathic features | 10-item clinician-administered; score \u22654/10 = likely neuropathic |\n| **Central Sensitisation Inventory (CSI)** | Nociplastic / central sensitisation | Part A: 25-item; score \u226540/100 = central sensitisation syndrome likely |\n| **Pain Catastrophising Scale (PCS)** | Psychosocial amplification | High scores predict poor prognosis; relevant in nociplastic |\n| **Tampa Scale of Kinesiophobia (TSK)** | Fear-avoidance | Elevated in nociplastic phenotype |\n| **PSEQ** | Pain self-efficacy | Lower scores in nociplastic \u2014 guides education and pacing targets |\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Physiotherapy Management Implications\n\n### Nociceptive\n\n- Address the tissue source directly: manual therapy, graded loading, specific exercise, relative rest\n\n- Educate re: tissue healing timelines\n\n- Progress through expected recovery trajectory\n\n### Neuropathic\n\n- Neural mobilisation (slider vs tensioner techniques based on irritability)\n\n- TENS for symptom modulation\n\n- Posture and ergonomic management to reduce neural compression\n\n- Refer for medical co-management if severe (pregabalin, duloxetine, amitriptyline)\n\n- Clear communication with patient about nerve healing timelines\n\n### Nociplastic\n\n- **Pain Neuroscience Education (PNE)** is a key first-line intervention \u2014 evidence supports significant improvements in pain, disability and catastrophising when combined with other therapies\n\n- Graded exposure / activity pacing over graded loading\n\n- Avoid aggressive manual therapy or repeated high-load testing \u2014 can reinforce threat perception\n\n- Address sleep, stress, mood \u2014 these modulate central sensitisation\n\n- Multidisciplinary input often required (psychology, pain physician, OT)\n\n- Validate the pain experience explicitly \u2014 these patients are often dismissed\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Red Flags Within Each Phenotype\n\n- **Nociceptive:** Persists beyond expected tissue healing \u2192 consider phenotype shift to nociplastic, or missed pathology\n\n- **Neuropathic:** Progressive motor deficit, bilateral symptoms, bladder/bowel involvement \u2192 urgent neurological review\n\n- **Nociplastic:** Severe depression or suicidality, rapid unexplained weight loss, new focal neurology \u2192 refer urgently; do not attribute all symptoms to central sensitisation\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Sources\n\n1.  International Association for the Study of Pain (IASP). Pain Terminology. iasp-pain.org (2018, 2020)\n\n2.  Australian Physiotherapy Association (APA). Acute Low Back Pain \u2014 Nociplastic Pain Case. australian.physio (2021)\n\n3.  APTA Orthopaedics. Pain Education Manual for Physical Therapist Professional Degree Programs. orthopt.org (2021)\n\n4.  Cleveland Clinic Journal of Medicine. Nociplastic Pain: A Practical Guide to Chronic Pain Management. ccjm.org (2023)\n\n5.  Smart KM, Blake C, Staines A, Doody C. Clinical indicators of nociceptive, peripheral neuropathic and central sensitisation mechanisms of musculoskeletal pain. Manual Therapy (2010); Discriminative Validity, Clinical Journal of Pain (2011)\n\n6.  BACPAP Consortium. Nociceptive, neuropathic, or nociplastic low back pain? International and multidisciplinary consensus recommendations. ScienceDirect (2023)\n\n7.  Dove Medical Press. Central Sensitization and Nociplastic Pain: Shared Mechanisms in Fibromyalgia. dovepress.com (2024)\n\n8.  Physiotherapy Management of Nociplastic Pain: A Delphi Study. Pre-print (2022)\n\n9.  Effectiveness of Pain Neuroscience Education in Chronic MSK Pain and Central Sensitisation: Systematic Review. MDPI IJERPH (2023)\n\n10. Nature Reviews. Pathology of Pain and its Implications for Therapeutic Interventions. nature.com (2024)", "source_file": "Nociceptive vs Neuropathic vs Nociplastic Pain Phe_20260506_122030.md"}, {"id": 5, "name": "Physiotherapy Clinical Special Tests \u2014 Complete Reference", "category": "assessment", "region_id": null, "content": "## Patient Positioning \\| Procedure \\| Positive Findings \\| Sensitivity & Specificity\n\n*Compiled from documents across all body areas in this library. Where sensitivity/specificity data is available from peer-reviewed sources, it is included. Where data is limited or conflicting, this is noted.*\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## CERVICAL SPINE\n\n### Spurling's Test (Foraminal Compression Test)\n\n**Indication:** Cervical radiculopathy\n\n**Patient position:** Sitting\n\n**Procedure:** Examiner applies downward axial compression while the patient laterally flexes and rotates toward the symptomatic side. Overpressure applied at end range.\n\n**Positive finding:** Reproduction of concordant arm/radicular pain (not local neck pain)\n\n**Sensitivity:** 30\u201360% \\| **Specificity:** 90\u2013100%\n\n*Clinical note: Low sensitivity means a negative test does not rule out radiculopathy; high specificity means a positive test is highly indicative. Best used to rule IN radiculopathy.*\n\nSources: APTA Orthopedics, ICF Clinical Practice Guidelines for Neck Pain\n\n### Cervical Distraction Test\n\n**Indication:** Cervical radiculopathy\n\n**Patient position:** Supine\n\n**Procedure:** Examiner applies gentle axial traction to the head, unloading the intervertebral foramina\n\n**Positive finding:** Reduction or abolition of arm symptoms with distraction\n\n**Sensitivity:** 40\u201350% \\| **Specificity:** 90%+\n\n*Clinical note: A positive distraction test combined with positive Spurling's and ULNT1 creates a strong clinical cluster for radiculopathy.*\n\nSources: APTA Orthopedics, ICF Clinical Practice Guidelines for Neck Pain\n\n### Upper Limb Neurodynamic Test 1 (ULNT1 / Median Nerve Bias)\n\n**Indication:** Cervical radiculopathy, median nerve sensitisation\n\n**Patient position:** Supine\n\n**Procedure:** Sequential loading: shoulder depression, shoulder abduction to 90\u00b0, forearm supination, wrist/finger extension, elbow extension, cervical lateral flexion away from tested side\n\n**Positive finding:** Reproduction of concordant arm symptoms; symptom change with sensitising movement (cervical lateral flexion)\n\n**Sensitivity:** 72\u201397% \\| **Specificity:** 22\u201333%\n\n*Clinical note: High sensitivity \u2014 good screening test. Use alongside Spurling's and distraction for radiculopathy cluster.*\n\nSources: APTA Orthopedics ICF Neck Pain Guidelines\n\n### Cervical Flexion-Rotation Test (FRT)\n\n**Indication:** Cervicogenic headache (C1\u20132 segment)\n\n**Patient position:** Supine\n\n**Procedure:** Examiner fully flexes the cervical spine (locks C2\u20137), then passively rotates the head to each side. Normal range is approximately 44\u00b0 each side.\n\n**Positive finding:** Restricted rotation (less than 32\u201333\u00b0) and/or reproduction of familiar headache, typically ipsilateral to the restricted side\n\n**Sensitivity:** 86\u201390% \\| **Specificity:** 84\u201391%\n\n*Clinical note: Best validated test for cervicogenic headache. Side of restriction typically indicates the symptomatic C1\u20132 segment.*\n\nSources: JOSPT, International Headache Society\n\n### Hoffman's Sign\n\n**Indication:** Upper motor neuron lesion / cervical myelopathy\n\n**Patient position:** Sitting or supine, hand relaxed\n\n**Procedure:** Examiner flicks the nail of the middle finger downward. Observe for reflex flexion of thumb and index finger.\n\n**Positive finding:** Involuntary flexion of thumb and/or index finger\n\n**Sensitivity:** 58% \\| **Specificity:** 78%\n\n*Clinical note: Bilateral positivity raises concern for myelopathy. Combine with clinical history of hand clumsiness, gait disturbance.*\n\nSources: APTA Orthopedics\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## THORACIC SPINE\n\n### Rib Spring Test (Posterior Rib Pressure)\n\n**Indication:** Rib dysfunction, costovertebral joint involvement\n\n**Patient position:** Prone\n\n**Procedure:** Examiner applies PA (posterior-to-anterior) pressure over each rib angle, assessing mobility and pain reproduction\n\n**Positive finding:** Reproduction of concordant chest wall or thoracic pain; reduced spring compared to adjacent levels\n\n**Sensitivity/Specificity:** Limited data; largely used for clinical reasoning and treatment planning\n\n*Clinical note: Compare symmetry rib to rib. Asymmetrical restriction with pain reproduction suggests costovertebral dysfunction.*\n\n### Slump Test\n\n**Indication:** Neural tension, thoracic and lumbar nerve root involvement\n\n**Patient position:** Sitting at edge of bed, hands behind back\n\n**Procedure:** Sequential slump of thoracic then lumbar spine, then cervical flexion, then knee extension, then ankle dorsiflexion. Sensitise by releasing cervical flexion.\n\n**Positive finding:** Reproduction of concordant symptoms that change with cervical extension (sensitising movement)\n\n**Sensitivity:** 83\u201384% \\| **Specificity:** 55%\n\n*Clinical note: Highly sensitive \u2014 good screening test for neural involvement. Symptom change with cervical extension is the key positive indicator.*\n\nSources: JOSPT\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## LUMBAR SPINE\n\n### Straight Leg Raise (SLR)\n\n**Indication:** Lumbar radiculopathy, disc herniation (L4\u2013S1)\n\n**Patient position:** Supine, legs extended\n\n**Procedure:** Examiner passively raises the straight leg. Positive range is typically 30\u201370\u00b0. Sensitise with ankle dorsiflexion.\n\n**Positive finding:** Reproduction of concordant leg pain (not just hamstring tightness) between 30\u201370\u00b0 of elevation\n\n**Sensitivity:** 80\u201391% \\| **Specificity:** 26\u201357%\n\n*Clinical note: Crossed SLR (symptoms reproduced in opposite leg) is far more specific (90%) for large central/paracentral disc herniation.*\n\nSources: NASS Lumbar Stenosis Guidelines, JOSPT\n\n### Prone Instability Test\n\n**Indication:** Lumbar segmental instability\n\n**Patient position:** Prone, lower legs over edge of table, feet on floor\n\n**Procedure:** Examiner applies PA pressure to lumbar segments. If painful, patient lifts feet off floor (activates stabilisers). Re-apply PA pressure.\n\n**Positive finding:** Pain with PA pressure when feet on floor that diminishes when patient actively stabilises (feet off floor)\n\n**Sensitivity:** 71% \\| **Specificity:** 57%\n\n*Clinical note: Moderate sensitivity/specificity. Best used as part of a broader instability cluster including aberrant movement patterns and hypermobility findings.*\n\nSources: JOSPT (Clinical Tests for Lumbar Segmental Instability), MDPI Journal of Functional Morphology\n\n### Slump Test\n\n*(See Thoracic section \u2014 applies equally to lumbar neural involvement)*\n\n### Waddell's Signs (Non-organic Signs)\n\n**Indication:** Psychosocial overlay, central sensitisation, illness behaviour\n\n**Patient position:** Various\n\n**Procedure:** Five categories assessed: (1) Tenderness \u2014 superficial/non-anatomic; (2) Simulation \u2014 axial loading on skull, passive rotation in standing; (3) Distraction \u2014 SLR supine vs seated; (4) Regional \u2014 non-dermatomal sensory/motor changes; (5) Overreaction \u2014 disproportionate pain behaviour\n\n**Positive finding:** 3 or more of 5 categories positive\n\n**Sensitivity/Specificity:** Not designed as a diagnostic test for malingering \u2014 indicates need for psychosocial screening\n\n*Clinical note: Waddell signs indicate elevated psychosocial contribution, NOT malingering or fabrication. Refer for psychological assessment if 3+ positive.*\n\nSources: NASS Guidelines\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u
