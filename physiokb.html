ement", "feature_domain": "history", "condition_name": "Acute Wry Neck"}, {"id": 1387, "condition_id": 176, "feature_name": "Pain character", "feature_value": "Unilateral or central neck pain with protective muscle guarding", "feature_domain": "subjective", "condition_name": "Acute Wry Neck"}, {"id": 1388, "condition_id": 176, "feature_name": "Disc subtype \u2014 pain", "feature_value": "Pain more central; generally worse with flexion movements", "feature_domain": "subjective", "condition_name": "Acute Wry Neck"}, {"id": 1389, "condition_id": 176, "feature_name": "Disc subtype \u2014 palpation", "feature_value": "TOP over spinous processes centrally", "feature_domain": "objective", "condition_name": "Acute Wry Neck"}, {"id": 1390, "condition_id": 176, "feature_name": "Facet subtype \u2014 pain", "feature_value": "Usually unilateral; worse with ipsilateral lateral flexion or extension", "feature_domain": "subjective", "condition_name": "Acute Wry Neck"}, {"id": 1391, "condition_id": 176, "feature_name": "Facet subtype \u2014 posture", "feature_value": "Often holds neck in protective contralateral lateral flexion (moves away from symptomatic side)", "feature_domain": "objective", "condition_name": "Acute Wry Neck"}, {"id": 1392, "condition_id": 176, "feature_name": "Facet subtype \u2014 palpation", "feature_value": "TOP over facet joints / transverse processes (commonly C5-6 for disc; any level for facet)", "feature_domain": "objective", "condition_name": "Acute Wry Neck"}, {"id": 1393, "condition_id": 176, "feature_name": "Global guarding", "feature_value": "May have guarding of global neck muscles in both subtypes", "feature_domain": "objective", "condition_name": "Acute Wry Neck"}, {"id": 1394, "condition_id": 176, "feature_name": "Imaging", "feature_value": "Not routinely required in absence of red flags. X-ray / CT for disc space; MRI if suspect structural pathology", "feature_domain": "objective", "condition_name": "Acute Wry Neck"}, {"id": 1395, "condition_id": 177, "feature_name": "Pain character", "feature_value": "Diffuse, vague ache at the lateral elbow \u2014 more poorly defined than local lateral epicondylalgia", "feature_domain": "subjective", "condition_name": "Referred Pain to Elbow (Cervical / Thoracic Spine)"}, {"id": 1396, "condition_id": 177, "feature_name": "Associated symptoms", "feature_value": "Pain or stiffness in neck (cervical source) or upper thoracic spine (thoracic source)", "feature_domain": "subjective", "condition_name": "Referred Pain to Elbow (Cervical / Thoracic Spine)"}, {"id": 1397, "condition_id": 177, "feature_name": "Cervical source \u2014 Ox", "feature_value": "Decreased ROM cervical spine, especially ipsilateral lateral flexion. TOP centrally or unilaterally over cervical facets (commonly C5-6). Improved elbow pain after treatment of cervical facet stiffness.", "feature_domain": "objective", "condition_name": "Referred Pain to Elbow (Cervical / Thoracic Spine)"}, {"id": 1398, "condition_id": 177, "feature_name": "Thoracic source \u2014 Ox", "feature_value": "Reduced thoracic ROM. TOP of thoracic facets (mainly ipsilateral upper thoracic). Improved elbow pain after treatment of thoracic facet stiffness.", "feature_domain": "objective", "condition_name": "Referred Pain to Elbow (Cervical / Thoracic Spine)"}, {"id": 1399, "condition_id": 177, "feature_name": "DD vs lateral epicondylalgia", "feature_value": "Lateral epicondylalgia: localised TOP at lateral epicondyle; pain with wrist extension and gripping; insidious load-related onset. Referred pain: diffuse; associated spinal findings; no local epicondyle TOP", "feature_domain": "objective", "condition_name": "Referred Pain to Elbow (Cervical / Thoracic Spine)"}, {"id": 1400, "condition_id": 177, "feature_name": "Imaging", "feature_value": "Not routinely required. X-ray or MRI of spine can show potential source; relevance requires correlation with history and objective findings.", "feature_domain": "objective", "condition_name": "Referred Pain to Elbow (Cervical / Thoracic Spine)"}, {"id": 1401, "condition_id": 177, "feature_name": "Clinical note", "feature_value": "More common in chronic presentations. Can co-exist with local lateral epicondylalgia \u2014 treat both if both present.", "feature_domain": "history", "condition_name": "Referred Pain to Elbow (Cervical / Thoracic Spine)"}], "differentiators": [{"id": 1, "region_id": 2, "condition_a": "Lateral Sprain", "condition_b": "Syndesmosis", "narrative": "Mechanism is the key differentiator: inversion = lateral sprain; external rotation = syndesmosis Pain location: ATFL is anterior to fibula; syndesmosis is above the joint line Squeeze test: compress fibula and tibia at mid-calf \u2014 pain at syndesmosis = positive for syndesmotic injury Kleiger test: external rotation of foot on fixed tibia reproduces syndesmotic pain Syndesmosis injuries take significantly longer to heal and require more aggressive management", "key_test": null, "key_feature": null, "region_label": "Ankle"}, {"id": 2, "region_id": 2, "condition_a": "Achilles Tendinopathy", "condition_b": "Rupture", "narrative": "Mid-portion tendinopathy: gradual onset, localised nodular thickening, pain with load Insertional tendinopathy: pain at calcaneal insertion, worse in shoes with heel counter Rupture: sudden pop, inability to plantarflex, positive Thompson's test (no plantarflexion on calf squeeze), palpable gap \u2014 urgent referral", "key_test": null, "key_feature": null, "region_label": "Ankle"}, {"id": 3, "region_id": 2, "condition_a": "Peroneal Tendinopathy", "condition_b": "Lateral Ligament", "narrative": "Both cause lateral ankle pain \u2014 differentiate by palpation Peroneal pain is along the tendon groove posterior to the fibula, not over the ATFL Resisted eversion reproduces peroneal pain; inversion stress reproduces ligament pain Peroneal subluxation: felt as a snap over the fibula with dorsiflexion/eversion \u2014 retinaculum tear ### Posterior Tibial Tendon Dysfunction (PTTD) Progressive medial arch collapse, too-many-toes sign on posterior view Single-leg heel raise: inability or significant pain = dysfunction Classified in stages (I\u2013IV) based on degree of deformity and reducibility Important to differentiate from spring ligament injury and tarsal tunnel syndrome (both medial) ### Osteochondral Lesion (OLT) Suspect when ankle pain/swelling persists beyond expected healing after a sprain Deep, difficult to localise pain; may have mechanical symptoms (catching, giving way) Requires MRI for diagnosis \u2014 cannot be reliably identified clinically \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Ankle"}, {"id": 4, "region_id": 2, "condition_a": "Peroneal Tendinopathy", "condition_b": "Lateral Ligament", "narrative": "Both cause lateral ankle pain \u2014 differentiate by palpation Peroneal pain is along the tendon groove posterior to the fibula, not over the ATFL Resisted eversion reproduces peroneal pain; inversion stress reproduces ligament pain Peroneal subluxation: felt as a snap over the fibula with dorsiflexion/eversion \u2014 retinaculum tear ### Posterior Tibial Tendon Dysfunction (PTTD) Progressive medial arch collapse, too-many-toes sign on posterior view Single-leg heel raise: inability or significant pain = dysfunction Classified in stages (I\u2013IV) based on degree of deformity and reducibility Important to differentiate from spring ligament injury and tarsal tunnel syndrome (both medial) ### Osteochondral Lesion (OLT) Suspect when ankle pain/swelling persists beyond expected healing after a sprain Deep, difficult to localise pain; may have mechanical symptoms (catching, giving way) Requires MRI for diagnosis \u2014 cannot be reliably identified clinically \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Ankle"}, {"id": 5, "region_id": 2, "condition_a": "Plantar Fasciitis", "condition_b": "Calcaneal Stress Fracture", "narrative": "Both cause heel pain \u2014 location and behaviour differentiate them Plantar fasciitis: pain at medial calcaneal tubercle, worst with first steps, improves with warm-up Stress fracture: diffuse heel pain, does NOT improve with warm-up, progressive with loading Calcaneal squeeze test: medial-lateral compression of calcaneus \u2014 positive = stress fracture until proven otherwise (X-ray often normal early; MRI or bone scan required) Windlass test positive = plantar fasciitis; squeeze test positive = stress fracture", "key_test": null, "key_feature": null, "region_label": "Ankle"}, {"id": 6, "region_id": 2, "condition_a": "Plantar Fasciitis", "condition_b": "Tarsal Tunnel Syndrome", "narrative": "Both cause medial heel / plantar foot pain Tarsal tunnel: neuritic quality (burning, tingling), positive Tinel's over tibial nerve posterior to medial malleolus, sensory deficit on plantar surface Plantar fasciitis: mechanical quality, no neurological signs, windlass positive Can coexist \u2014 screen for both in chronic heel pain", "key_test": null, "key_feature": null, "region_label": "Ankle"}, {"id": 7, "region_id": 2, "condition_a": "Morton's Neuroma", "condition_b": "Metatarsal Stress Fracture vs Metatarsalgia", "narrative": "Morton's neuroma: interspace pain, neuritic quality, Mulder's click, aggravated by tight shoes, 3rd web space most common Stress fracture: shaft tenderness on palpation and axial load; no neuritic features; imaging confirms Metatarsalgia (generalised): diffuse forefoot pain, often from altered load distribution \u2014 rule out neuroma, fracture, and inflammatory arthritis first", "key_test": null, "key_feature": null, "region_label": "Ankle"}, {"id": 8, "region_id": 2, "condition_a": "Hallux Valgus", "condition_b": "Hallux Rigidus", "narrative": "Hallux valgus: lateral deviation of hallux, medial bunion, pain from footwear pressure, MTP ROM relatively preserved Hallux rigidus: no deformity; loss of 1st MTP dorsiflexion (normal \\>65\u00b0), dorsal osteophyte, pain at end-range push-off Both may present with forefoot pain and gait changes \u2014 examine 1st MTP ROM carefully ### Lisfranc Injury (Must Not Miss) Midfoot pain and swelling after axial load or twisting Tenderness over tarsometatarsal joint line Piano key test: vertical stress on individual metatarsals reproduces pain Often missed on plain X-ray \u2014 weight-bearing views essential; MRI if suspected Instability or diastasis = surgical referral urgently \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Ankle"}, {"id": 9, "region_id": 2, "condition_a": "Hallux Valgus", "condition_b": "Hallux Rigidus", "narrative": "Hallux valgus: lateral deviation of hallux, medial bunion, pain from footwear pressure, MTP ROM relatively preserved Hallux rigidus: no deformity; loss of 1st MTP dorsiflexion (normal \\>65\u00b0), dorsal osteophyte, pain at end-range push-off Both may present with forefoot pain and gait changes \u2014 examine 1st MTP ROM carefully ### Lisfranc Injury (Must Not Miss) Midfoot pain and swelling after axial load or twisting Tenderness over tarsometatarsal joint line Piano key test: vertical stress on individual metatarsals reproduces pain Often missed on plain X-ray \u2014 weight-bearing views essential; MRI if suspected Instability or diastasis = surgical referral urgently \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Ankle"}, {"id": 10, "region_id": 8, "condition_a": "Trigger Finger", "condition_b": "CMC OA", "narrative": "Trigger finger: pain and locking at A1 pulley (palmar crease level); CMC OA: pain at thumb base with grind test positive Grind test (CMC) vs A1 pulley palpation \u2014 distinct locations Trigger finger locks in flexion; CMC OA does not lock", "key_test": null, "key_feature": null, "region_label": "Hand"}, {"id": 11, "region_id": 8, "condition_a": "Mallet Finger", "condition_b": "Boutonniere", "narrative": "Mallet: DIP cannot extend (extensor tendon at DIP); Boutonniere: PIP cannot extend (central slip at PIP) Mallet = tip droops; Boutonniere = PIP flexed + DIP hyperextended Both require early splinting \u2014 Elson's test differentiates central slip integrity", "key_test": null, "key_feature": null, "region_label": "Hand"}, {"id": 12, "region_id": 8, "condition_a": "Gamekeeper's", "condition_b": "Skier's Thumb", "narrative": "Same structure (UCL of thumb MCP), different mechanism: acute (skier's) vs chronic (gamekeeper's) Stener lesion = UCL rupture with adductor aponeurosis entrapment \u2014 cannot heal conservatively, needs surgical referral Valgus stress \\>35\u00b0 or \\>15\u00b0 difference from contralateral side = likely complete tear; refer", "key_test": null, "key_feature": null, "region_label": "Hand"}, {"id": 13, "region_id": 8, "condition_a": "Dupuytren's", "condition_b": "Trigger Finger", "narrative": "Dupuytren's: contracture is passive, painless, ring/little finger primarily, no locking Trigger finger: active catching/locking, painful, any digit, nodule at A1 pulley \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Hand"}, {"id": 14, "region_id": 8, "condition_a": "Dupuytren's", "condition_b": "Trigger Finger", "narrative": "Dupuytren's: contracture is passive, painless, ring/little finger primarily, no locking Trigger finger: active catching/locking, painful, any digit, nodule at A1 pulley \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Hand"}, {"id": 15, "region_id": 10, "condition_a": "FAI/Labral Tear", "condition_b": "Hip OA", "narrative": "FAI: younger, FADIR positive, deep groin C-sign, clicking/catching, often activity-related OA: older, global ROM restriction (especially IR), progressive stiffness, morning gelling, X-ray changes Both can co-exist \u2014 FAI accelerates OA progression FABER: more likely to reproduce intra-articular pain (FAI/labral) than lateral hip sources", "key_test": null, "key_feature": null, "region_label": "Hip"}, {"id": 16, "region_id": 10, "condition_a": "GTPS", "condition_b": "FAI", "narrative": "GTPS: lateral pain, lying-on-side pain, GT palpation positive; FABER negative for intra-articular FAI: anterior/groin pain, FADIR positive, C-sign Single-leg stance reproduces GTPS; FADIR reproduces FAI Active resisted abduction specificity 93% for GTPS", "key_test": null, "key_feature": null, "region_label": "Hip"}, {"id": 17, "region_id": 10, "condition_a": "Iliopsoas (Internal Snapping)", "condition_b": "External Snapping (ITB)", "narrative": "Internal snap: felt/heard medially, reproduces groin pain \u2014 iliopsoas over iliopectineal eminence External snap: felt/heard laterally over GT \u2014 ITB snapping Dynamic ultrasound can confirm", "key_test": null, "key_feature": null, "region_label": "Hip"}, {"id": 18, "region_id": 10, "condition_a": "Deep Gluteal / Piriformis", "condition_b": "Lumbar Radiculopathy", "narrative": "Deep gluteal: no lumbar provocation, sciatic referral without back pain, FAIR test positive, prolonged sitting reproduces Lumbar radiculopathy: lumbar AROM provokes, positive SLR/neural tension, dermatomal distribution Key: lumbar flexion/extension provocation separates spinal from hip source", "key_test": null, "key_feature": null, "region_label": "Hip"}, {"id": 19, "region_id": 10, "condition_a": "Hamstring Tendinopathy", "condition_b": "Deep Gluteal Syndrome", "narrative": "Hamstring: ischial tuberosity palpation positive, Puranen-Orava / Bent Knee Stretch positive, worse with sitting + running Deep gluteal: deep buttock pain, sciatic referral, piriformis provocation tests positive \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Hip"}, {"id": 20, "region_id": 10, "condition_a": "Hamstring Tendinopathy", "condition_b": "Deep Gluteal Syndrome", "narrative": "Hamstring: ischial tuberosity palpation positive, Puranen-Orava / Bent Knee Stretch positive, worse with sitting + running Deep gluteal: deep buttock pain, sciatic referral, piriformis provocation tests positive \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Hip"}, {"id": 21, "region_id": 11, "condition_a": "PFPS", "condition_b": "Patellar Tendinopathy", "narrative": "PFPS: diffuse peripatellar pain; theatre sign (prolonged sitting); Clarke's grind test positive Patellar tendinopathy: focal inferior pole tenderness; load-dependent pain; pain improves with warm-up, worsens after PFPS typically worsens with sustained sitting; patellar tendinopathy does not", "key_test": null, "key_feature": null, "region_label": "Knee"}, {"id": 22, "region_id": 11, "condition_a": "ACL Tear", "condition_b": "Meniscal Tear", "narrative": "ACL: mechanism is typically non-contact pivoting; audible \"pop\"; rapid haemarthrosis (within 2 hours); gross instability on Lachman Lachman test is the most valid test for ACL in both acute and chronic injuries \u2014 anterior drawer has poor sensitivity/specificity in acute ACL injury (sensitivity 49%, specificity 58%) Meniscal tear: joint line tenderness; McMurray or Thessaly test positive; locking or catching; delayed or absent effusion in degenerative tears Both can co-exist \u2014 always screen for combined injury after high-energy trauma", "key_test": null, "key_feature": null, "region_label": "Knee"}, {"id": 23, "region_id": 11, "condition_a": "Medial Knee Pain: Meniscal", "condition_b": "Pes Anserine Bursitis", "narrative": "Meniscal: joint line tenderness at level of knee joint; positive McMurray; mechanical symptoms Pes anserine: tenderness 2\u20133cm below the joint line on medial tibia; common in overweight, older, or diabetic patients; night pain; no mechanical symptoms", "key_test": null, "key_feature": null, "region_label": "Knee"}, {"id": 24, "region_id": 11, "condition_a": "ITB Syndrome", "condition_b": "Lateral Meniscal Tear", "narrative": "ITB: lateral pain over femoral condyle, not at joint line; Noble compression test positive at 30\u00b0 flexion; running-specific aggravation Lateral meniscal: joint line tenderness at level of joint; McMurray positive (external rotation); may lock or give way", "key_test": null, "key_feature": null, "region_label": "Knee"}, {"id": 25, "region_id": 11, "condition_a": "Knee OA", "condition_b": "Inflammatory Arthritis", "narrative": "OA: asymmetric, worse with activity, improves with rest; morning stiffness \\<30 minutes; crepitus; bony enlargement Inflammatory (RA, gout): bilateral or migratory; morning stiffness \\>1 hour; warmth, redness; systemic features \u2014 refer for serology and imaging \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Knee"}, {"id": 26, "region_id": 11, "condition_a": "Knee OA", "condition_b": "Inflammatory Arthritis", "narrative": "OA: asymmetric, worse with activity, improves with rest; morning stiffness \\<30 minutes; crepitus; bony enlargement Inflammatory (RA, gout): bilateral or migratory; morning stiffness \\>1 hour; warmth, redness; systemic features \u2014 refer for serology and imaging \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Knee"}, {"id": 27, "region_id": 12, "condition_a": "Discogenic", "condition_b": "Facet", "narrative": "Discogenic: flexion-dominant aggravation, deep constant ache, often worse sitting and at night; may have non-dermatomal leg referral Facet: extension + rotation dominant aggravation, relieved by flexion; PA joint pressure at the level reproduces familiar pain Both can refer to buttock and posterior thigh \u2014 the movement pattern is the primary differentiator Note: MRI findings do not reliably confirm either as the pain source", "key_test": null, "key_feature": null, "region_label": "Lumbar Spine"}, {"id": 28, "region_id": 12, "condition_a": "Radiculopathy", "condition_b": "Non-specific Leg Referral", "narrative": "True radiculopathy = dermatomal leg pain + at least one of: reflex loss, myotomal weakness, dermatomal sensory change Positive straight leg raise (reproduction of leg pain below knee at \\<70\u00b0) significantly raises probability of disc herniation with nerve root compression Slump test adds sensitivity \u2014 positive if leg symptoms reproduced and relieved by cervical extension Diffuse, non-dermatomal leg referral without neuro signs = referred pain (facet, disc, or SIJ) rather than true radiculopathy", "key_test": null, "key_feature": null, "region_label": "Lumbar Spine"}, {"id": 29, "region_id": 12, "condition_a": "Neurogenic", "condition_b": "Vascular Claudication", "narrative": "Neurogenic: relieved by flexion (sitting, leaning on trolley); pain may persist briefly after stopping walking; cycling well tolerated Vascular: relieved rapidly by standing still; ankle pulses reduced; not position-dependent; cycling provokes it Neurogenic claudication: bilateral leg heaviness/cramping, worse with extension, positive shopping trolley sign, age typically \\>60", "key_test": null, "key_feature": null, "region_label": "Lumbar Spine"}, {"id": 30, "region_id": 12, "condition_a": "SIJ", "condition_b": "Lumbar Facet", "narrative": "SIJ rarely refers below the knee Three or more positive SIJ provocation tests (compression, distraction, Thigh Thrust, FABER, Gaenslen's) significantly increases probability of SIJ as pain source SIJ pain is typically unilateral, buttock-dominant, aggravated by stairs, prolonged standing, rolling in bed \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Lumbar Spine"}, {"id": 31, "region_id": 12, "condition_a": "SIJ", "condition_b": "Lumbar Facet", "narrative": "SIJ rarely refers below the knee Three or more positive SIJ provocation tests (compression, distraction, Thigh Thrust, FABER, Gaenslen's) significantly increases probability of SIJ as pain source SIJ pain is typically unilateral, buttock-dominant, aggravated by stairs, prolonged standing, rolling in bed \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Lumbar Spine"}, {"id": 32, "region_id": 12, "condition_a": "SIJ Dysfunction", "condition_b": "Lumbar Spine", "narrative": "SIJ pain is typically localised around or just medial/inferior to the PSIS \u2014 the \"Fortin finger test\" (patient points to pain with one finger at PSIS) is a useful screening tool Lumbar pathology produces midline or bilateral symptoms and is aggravated by spinal movement; SIJ pain is aggravated by single-leg loading and rolling in bed Clinical decision rule: 3 or more of 5 provocation tests positive (distraction, compression, thigh thrust, Gaenslen, sacral thrust) has the best diagnostic accuracy for SIJ dysfunction SIJ motion palpation tests (standing flexion, supine-to-sit) have poor inter-rater reliability and should not be used in isolation", "key_test": null, "key_feature": null, "region_label": "Lumbar Spine"}, {"id": 33, "region_id": 12, "condition_a": "Osteitis Pubis", "condition_b": "Athletic Pubalgia (Sports Hernia)", "narrative": "Osteitis pubis: direct palpation tenderness over pubic symphysis; positive adductor squeeze test; waddling gait in severe cases Athletic pubalgia: inguinal canal tenderness; pain on Valsalva; palpable cough impulse at inguinal ring Both occur in kicking sport athletes \u2014 the two frequently co-exist and may require imaging (MRI) to differentiate Osteitis pubis associated with FAI in 39% of cases \u2014 always screen the hip", "key_test": null, "key_feature": null, "region_label": "Lumbar Spine"}, {"id": 34, "region_id": 12, "condition_a": "Piriformis Syndrome", "condition_b": "Lumbar Radiculopathy", "narrative": "Piriformis: no neurological signs on formal testing; sitting intolerance; FAIR test positive; tenderness on deep gluteal palpation Lumbar radiculopathy: dermatomal sensory change, myotomal weakness, reflex change; Slump/SLR positive Piriformis syndrome is a diagnosis of exclusion \u2014 rule out L5/S1 radiculopathy first ### Pelvic Floor Dysfunction Often underdiagnosed in physiotherapy musculoskeletal contexts Screen for: urinary urgency/leakage, painful intercourse, coccyx pain, perineal heaviness Frequently co-exists with SIJ dysfunction postpartum Requires internal pelvic floor assessment for confirmation \u2014 refer to pelvic floor physiotherapist if outside scope \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Lumbar Spine"}, {"id": 35, "region_id": 12, "condition_a": "Piriformis Syndrome", "condition_b": "Lumbar Radiculopathy", "narrative": "Piriformis: no neurological signs on formal testing; sitting intolerance; FAIR test positive; tenderness on deep gluteal palpation Lumbar radiculopathy: dermatomal sensory change, myotomal weakness, reflex change; Slump/SLR positive Piriformis syndrome is a diagnosis of exclusion \u2014 rule out L5/S1 radiculopathy first ### Pelvic Floor Dysfunction Often underdiagnosed in physiotherapy musculoskeletal contexts Screen for: urinary urgency/leakage, painful intercourse, coccyx pain, perineal heaviness Frequently co-exists with SIJ dysfunction postpartum Requires internal pelvic floor assessment for confirmation \u2014 refer to pelvic floor physiotherapist if outside scope \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Lumbar Spine"}, {"id": 36, "region_id": 15, "condition_a": "Dyskinesis", "condition_b": "Winging", "narrative": "Scapular dyskinesis is a movement control problem \u2014 the scapula moves poorly but serratus anterior is not paralysed True winging from long thoracic nerve palsy shows medial border prominence at rest and inability to hold the scapula against the chest wall on a wall push-up Dyskinesis corrects partially with scapular repositioning (scapular assist test); true winging does not", "key_test": null, "key_feature": null, "region_label": "Shoulder"}, {"id": 37, "region_id": 15, "condition_a": "Suprascapular Nerve Entrapment", "condition_b": "Rotator Cuff Tear", "narrative": "Both cause weakness of supraspinatus and infraspinatus Suprascapular nerve entrapment: infra/supraspinatus fossa atrophy, deep poorly localised pain, no structural rotator cuff defect on imaging Differentiating requires EMG / nerve conduction studies or MRI showing denervation atrophy", "key_test": null, "key_feature": null, "region_label": "Shoulder"}, {"id": 38, "region_id": 15, "condition_a": "Snapping Scapula", "condition_b": "Referred Pain", "narrative": "Snapping scapula: reproducible crepitus / snap at the scapulothoracic interface during circumduction Referred pain: no local mechanical sign at scapula; cervical or thoracic spine movement reproduces the pain \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Shoulder"}, {"id": 39, "region_id": 15, "condition_a": "Snapping Scapula", "condition_b": "Referred Pain", "narrative": "Snapping scapula: reproducible crepitus / snap at the scapulothoracic interface during circumduction Referred pain: no local mechanical sign at scapula; cervical or thoracic spine movement reproduces the pain \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Shoulder"}, {"id": 40, "region_id": 15, "condition_a": "Rotator Cuff Tendinopathy", "condition_b": "Tear", "narrative": "Tendinopathy: painful arc, strength relatively preserved, full passive ROM Tear: true weakness on specific RC tests; lag signs (drop arm, external rotation lag) indicate significant tear Supraspinatus: empty can / full can weakness Infraspinatus: ER lag sign, resisted ER weakness Subscapularis: lift-off test, belly press, bear hug Large / massive tears may cause pseudoparalysis \u2014 apparent inability to elevate arm despite no neurological deficit", "key_test": null, "key_feature": null, "region_label": "Shoulder"}, {"id": 41, "region_id": 15, "condition_a": "Frozen Shoulder", "condition_b": "Other Causes of Restricted ROM", "narrative": "Frozen shoulder: equal loss of active and passive ROM in a capsular pattern \u2014 ER lost first and most, then abduction, then internal rotation Rotator cuff tear: active ROM reduced but passive ROM preserved GH OA: end-stage \u2014 restricted passive ROM but with bony end-feel and crepitus Key clinical check: if passive ER is preserved \u2192 not frozen shoulder", "key_test": null, "key_feature": null, "region_label": "Shoulder"}, {"id": 42, "region_id": 15, "condition_a": "AC Joint", "condition_b": "Subacromial / RC Pathology", "narrative": "AC joint: pain localised to the superior shoulder / AC joint tip; cross-body adduction reproduces pain; Paxinos test positive O'Brien's (active compression): if pain at top of fist position, relieved with palm up \u2192 AC pathology; if pain at bottom of fist position \u2192 labral / SLAP Subacromial: painful arc 60\u2013120\u00b0; AC joint tip not tender", "key_test": null, "key_feature": null, "region_label": "Shoulder"}, {"id": 43, "region_id": 15, "condition_a": "GH Instability", "condition_b": "Labral Tear", "narrative": "Instability: apprehension and/or relocation positive; sulcus sign for MDI SLAP tear: mechanism typically overhead / compression / fall on outstretched hand; O'Brien's + crank test; clicking with overhead activity Overlap is common \u2014 instability and labral tears frequently co-exist in young throwing athletes ### Biceps Tendinopathy \u2014 Usually Not Isolated Isolated primary biceps tendinopathy occurs in fewer than 10% of cases Commonly co-exists with rotator cuff pathology or SLAP tear If Speed's and Yergason's positive \u2192 screen for concurrent RC and labral pathology \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Shoulder"}, {"id": 44, "region_id": 15, "condition_a": "GH Instability", "condition_b": "Labral Tear", "narrative": "Instability: apprehension and/or relocation positive; sulcus sign for MDI SLAP tear: mechanism typically overhead / compression / fall on outstretched hand; O'Brien's + crank test; clicking with overhead activity Overlap is common \u2014 instability and labral tears frequently co-exist in young throwing athletes ### Biceps Tendinopathy \u2014 Usually Not Isolated Isolated primary biceps tendinopathy occurs in fewer than 10% of cases Commonly co-exists with rotator cuff pathology or SLAP tear If Speed's and Yergason's positive \u2192 screen for concurrent RC and labral pathology \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Shoulder"}, {"id": 45, "region_id": 16, "condition_a": "Mechanical / Axial", "condition_b": "Costovertebral", "narrative": "Costovertebral pain is provoked by deep breathing and rib spring testing \u2014 axial pain is not Costovertebral pain is typically unilateral and wraps around the chest wall following an intercostal dermatome Rib spring testing (PA pressure directly on the rib angle) reproduces familiar pain in costovertebral dysfunction", "key_test": null, "key_feature": null, "region_label": "Thoracic Spine"}, {"id": 46, "region_id": 16, "condition_a": "Thoracic Facet", "condition_b": "Discogenic", "narrative": "Facet pain: provoked by extension and rotation, relieved by flexion; PA pressure on the facet joint reproduces it Discogenic: deeper, more constant, worse with sustained flexion loading; may radiate anteriorly Thoracic disc herniation is rare but can compress the cord \u2014 watch for bilateral leg symptoms, gait change, or bladder/bowel dysfunction ### Visceral Referral \u2014 Must Not Miss Cardiac, aortic, pulmonary, oesophageal, and renal pathology can all refer to the thoracic spine Key clue: pain is not reproduced or altered by thoracic movement, posture, or palpation Associated features: diaphoresis, dyspnoea, nausea, haematuria, symptoms at rest or at night unrelated to position \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Thoracic Spine"}, {"id": 47, "region_id": 16, "condition_a": "Thoracic Facet", "condition_b": "Discogenic", "narrative": "Facet pain: provoked by extension and rotation, relieved by flexion; PA pressure on the facet joint reproduces it Discogenic: deeper, more constant, worse with sustained flexion loading; may radiate anteriorly Thoracic disc herniation is rare but can compress the cord \u2014 watch for bilateral leg symptoms, gait change, or bladder/bowel dysfunction ### Visceral Referral \u2014 Must Not Miss Cardiac, aortic, pulmonary, oesophageal, and renal pathology can all refer to the thoracic spine Key clue: pain is not reproduced or altered by thoracic movement, posture, or palpation Associated features: diaphoresis, dyspnoea, nausea, haematuria, symptoms at rest or at night unrelated to position \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "key_test": null, "key_feature": null, "region_label": "Thoracic Spine"}, {"id": 48, "region_id": 9, "condition_a": "Cervicogenic Headache", "condition_b": "Migraine", "narrative": "Onset: cervicogenic starts in neck/occiput and radiates forward; migraine starts in head and radiates backward. Lateralisation: cervicogenic is strictly unilateral without side shift; migraine is predominantly unilateral but may shift sides. Pain character: cervicogenic is non-throbbing and non-lancinating; migraine is throbbing and pulsating. Triggers: cervicogenic is provoked by neck movement and sustained awkward head postures \u2014 these are not typical migraine triggers. Associated features: cervicogenic has limited cervical ROM and tenderness over upper three cervical segments on the symptomatic side with craniocervical flexor weakness; may have mild nausea/photophobia but less pronounced than migraine. Migraine has nausea/vomiting, visual changes, pronounced photophobia and phonophobia. Duration: cervicogenic 1 hour to weeks; migraine 4\u201372 hours.", "key_test": "Cervical flexion-rotation test (positive in cervicogenic; normal in migraine)", "key_feature": "Neck movement as trigger; throbbing quality; side-shift", "region_label": "Headache"}, {"id": 49, "region_id": 9, "condition_a": "Cervicogenic Headache", "condition_b": "Tension-Type Headache", "narrative": "Lateralisation: cervicogenic is unilateral without side shift; tension-type is diffuse and bilateral. Severity: cervicogenic is moderate to severe; tension-type is mild to moderate. Duration: cervicogenic 1 hour to weeks; tension-type days to weeks. Pain character: cervicogenic is non-throbbing; tension-type is dull, pressing, or tightening. Triggers: cervicogenic is specifically provoked by neck movement and sustained awkward postures \u2014 not typical in tension-type. Associated signs: cervicogenic has reproducible cervical findings (limited ROM, upper cervical tenderness, craniocervical flexor weakness); tension-type has no nausea or vomiting but may have photophobia or phonophobia. Frequency: cervicogenic is chronic or episodic with no fixed pattern; tension-type 1\u201330 per month.", "key_test": "Cervical palpation and flexion-rotation test", "key_feature": "Cervical ROM restriction and tenderness; bilateral vs unilateral; neck movement as trigger", "region_label": "Headache"}, {"id": 50, "region_id": 9, "condition_a": "Migraine", "condition_b": "Tension-Type Headache", "narrative": "Severity: migraine is moderate to severe; tension-type is mild to moderate. Pain character: migraine is throbbing and pulsating; tension-type is dull, pressing, or tightening. Duration: migraine 4\u201372 hours; tension-type days to weeks. Associated features: migraine has nausea/vomiting, visual changes, photophobia, and phonophobia; tension-type has no nausea or vomiting but may have mild photophobia or phonophobia. Frequency: migraine typically 1\u20134 per month; tension-type 1\u201330 per month. Location: migraine is frontal/periorbital/temporal; tension-type is diffuse.", "key_test": "Headache diary (frequency / nausea / visual aura)", "key_feature": "Throbbing quality and nausea/vomiting presence; severity level; aura", "region_label": "Headache"}, {"id": 51, "region_id": 12, "condition_a": "Lumbar Disc Herniation / Radiculopathy (DHR)", "condition_b": "Reducible Discogenic Pain (RDP)", "narrative": "DHR has symptoms BELOW the knee in a dermatomal pattern with associated neurological deficit (dermatomal sensory change, myotome weakness, or reflex loss) \u2014 at least one positive neural test (SLR, slump, reduced dermatome/myotome/reflex) is required. RDP has discogenic aggravating factors (\u22654 of: sitting, forward bend, lifting, sit-to-stand, cough/sneeze, worse in morning, manual handling mechanism) but symptoms stay ABOVE the knee and there are no neurological signs. Both may centralise with extension-based mechanical loading (a positive finding for both).", "key_test": "SLR / slump test", "key_feature": "Neural signs below knee vs somatic referral above knee", "region_label": "Lumbar Spine"}, {"id": 52, "region_id": 12, "condition_a": "Reducible Discogenic Pain (RDP)", "condition_b": "Non-Reducible Discogenic Pain (NRD)", "narrative": "Both share the same aggravating factor profile (\u22654 of: sitting, forward bend, lifting, sit-to-stand, cough/sneeze, worse in morning, manual handling). The critical distinction is the response to mechanical loading: RDP \u2014 pain REDUCES or centralises with extension in lying \u00b1 ipsilateral side glide (directional preference present); NRD \u2014 pain does NOT reduce with any mechanical loading strategy. NRD may represent a more sensitised or chemically irritated disc. Neither requires imaging for diagnosis \u2014 history alone usually sufficient.", "key_test": "Repeated extension in lying (McKenzie)", "key_feature": "Centralisation vs no response to mechanical loading", "region_label": "Lumbar Spine"}, {"id": 53, "region_id": 12, "condition_a": "Zygapophysial Joint Pain (Lumbar Facet)", "condition_b": "Reducible Discogenic Pain (RDP)", "narrative": "Z-joint pattern: \u22653 of \u2014 (1) regular extension + ipsilateral lateral flexion reproduces familiar pain, (2) comparable Z-joint findings on lumbar palpation (unilateral tenderness over facet), (3) positive response to mini-treatment (mobilisation over painful Z-joint relieves pain). More unilateral symptoms. RDP pattern: \u22654 flexion-biased aggravating factors with centralisation possible in extension. Z-joint is worse in extension/rotation; RDP is worse in flexion.", "key_test": "Response to Z-joint mobilisation vs extension in lying", "key_feature": "Extension + ipsilateral rotation vs flexion aggravation; unilateral vs central", "region_label": "Lumbar Spine"}, {"id": 54, "region_id": 12, "condition_a": "Multi-factorial Persistent Low Back Pain", "condition_b": "Lumbar Disc Herniation / Radiculopathy", "narrative": "Multi-factorial pain: poorly localised and diffuse pain; pain disproportionate to injury and aggravating factors; lacks predictable mechanical pattern of DHR/RDP/NRD/Z-joint subgroups (mixture or inconsistent); often associated with hyperalgesia or allodynia; \u00d6rebro score >105/210 raises suspicion (not diagnostic). Key differentiator: testing does not fit a predictable pattern \u2014 each test session may produce different results. Multi-factorial pain can overlay nociceptive diagnoses so is not a diagnosis of exclusion \u2014 biopsychosocial screening is required even when structural pathology is present.", "key_test": "\u00d6rebro Musculoskeletal Pain Questionnaire (>105/210)", "key_feature": "Predictable mechanical pattern vs inconsistent multi-test findings", "region_label": "Lumbar Spine"}, {"id": 55, "region_id": 15, "condition_a": "Traumatic Glenohumeral Instability", "condition_b": "Atraumatic Glenohumeral Instability", "narrative": "Traumatic: the mechanism of injury is the most distinguishable factor \u2014 specific recollected incident involving the arm forced into excessive ABD+ER (anterior) or direct trauma/FOOSH (posterior). Presents with acute onset shoulder pain and often a history of \"popping out\". Likely associated with Bankart lesion (anterior) or posterior labral tear. Atraumatic: no specific trauma; onset associated with overhead sport (AIOS) or generalised capsular laxity (AMBRI). AIOS characterised by recurrent pain during throwing, dead arm, and anterior laxity. AMBRI involves multiple directions and generalised ligamentous laxity. Congenital instability is present from birth or early childhood.", "key_test": "Apprehension and relocation tests; load and shift test; sulcus sign", "key_feature": "Mechanism of injury; number of directions involved; laxity pattern", "region_label": "Shoulder"}, {"id": 56, "region_id": 15, "condition_a": "AIOS (Acquired Sport-Specific Instability)", "condition_b": "AMBRI (Atraumatic Multi-Directional Instability)", "narrative": "AIOS: overhead athletes (throwing, racquet sports); most commonly anterior instability; extreme capsular laxity from high-volume overhead use; features include recurrent pain during throwing, subluxations, dead arm, and SLAP lesions. AMBRI: involves multiple direction instability (anterior + posterior + inferior); prominent role of altered muscle activation (decreased lower traps and serratus anterior, increased pec minor/major and lats); scapular dyskinesis often present; ER >90\u00b0 suggests increased laxity; generalised ligamentous laxity throughout the body. Beighton score >4/9 supports AMBRI.", "key_test": "Sulcus sign; multi-direction instability testing", "key_feature": "Sport-specific anterior vs multi-directional; generalised laxity", "region_label": "Shoulder"}, {"id": 57, "region_id": 10, "condition_a": "Hip Femoroacetabular Impingement / Labral Tear", "condition_b": "Hip Osteoarthritis (Cluster of Sutlive)", "narrative": "Labral tear: younger patient; mechanical symptoms (locking, catching, clicking, giving way); vague location within anterior hip or groin; kicking and pivoting sports more common; FABER and FADIR highly sensitive but not specific (rule out with negative test; positive test alone insufficient). OA: gradual insidious onset; age >50; worse with activity, better with rest; end-stage pain at rest; global hip weakness and restriction of flexion and IR on testing; degenerative changes on X-ray.", "key_test": "FADIR (sensitive for labral); hip IR ROM", "key_feature": "Mechanical symptoms vs progressive activity-related stiffness; age of onset", "region_label": "Hip"}, {"id": 58, "region_id": 10, "condition_a": "Greater Trochanteric Pain Syndrome (GTPS)", "condition_b": "Referred Pain from Lumbar Spine (Lateral Hip)", "narrative": "GTPS: local tenderness over the greater trochanter is required; specifically provoked by compressive loads \u2014 ipsilateral side lying, sitting in low chairs, crossing legs, putting pants on, walking up stairs; weakness with isometric hip abduction and ER. Referred lumbar: diffuse or dull ache in gluteal region without consistent GT tenderness; aggravated by lumbar-based movements and loading; onset after development of back pain; no loss of hip ROM or strength; inconsistent pattern not matching GTPS; special tests not indicative of intra-articular pathology.", "key_test": "Local GT tenderness; REDT; sustained SLS", "key_feature": "Compressive load provocation at GT vs diffuse lumbar-linked pattern", "region_label": "Hip"}, {"id": 59, "region_id": 10, "condition_a": "Hip Labral Tear", "condition_b": "Hip Synovitis (Anterior)", "narrative": "Labral tear: mechanical symptoms (locking, catching, clicking, giving way); pain with kicking and pivoting; FABER and FADIR positive; may have painful or reduced global hip ROM. Synovitis: pain felt \"within\" the hip joint; night pain common; pain at rest; pain with most special tests assessing intra-articular pathology (none specific for synovitis alone \u2014 collection of positive outcomes raises suspicion); often co-occurs with FAI, labral tears, ligament teres tears, or chondropathy. MRI differentiates.", "key_test": "MRI (synovitis confirmed vs labral tear)", "key_feature": "Mechanical catching vs constant within-joint rest pain", "region_label": "Hip"}, {"id": 60, "region_id": 11, "condition_a": "Baker's Cyst", "condition_b": "Posterior Knee Joint Pathology (Primary)", "narrative": "Baker's cyst: essentially a chronic knee effusion herniated between the two heads of gastrocnemius \u2014 usually secondary to intra-articular pathology (meniscal tear, OA); palpable swollen and tender mass over posterior medial joint line; pain and restriction at end-range knee flexion; aggravated by deep squats and kneeling. Always assess for underlying intra-articular cause. Primary posterior pathology (referral from Lx spine or PFJ): difficulty reproducing posterior knee pain with local knee testing; minimal findings with objective testing of posterior structures; pain poorly localised and dull, not directly aggravated by posterior knee structures specifically.", "key_test": "Palpation of posterior medial joint line; US", "key_feature": "Palpable fluctuant mass vs no local posterior findings; secondary vs primary", "region_label": "Knee"}, {"id": 61, "region_id": 11, "condition_a": "Acute Meniscal Tear", "condition_b": "Degenerative Meniscal Tear", "narrative": "Acute: mechanism of twisting with planted foot; may be any age but more common in younger patients; locking can occur in more severe bucket-handle tears; positive McMurray, joint line tenderness, Apley grind; MRI will show tear. Degenerative: age >40 where acute knee pain arises from a knee that already had asymptomatic degenerative meniscus; no single traumatic incident recalled; can co-exist with OA; onset more insidious or with minor load increase. Both may present with joint line tenderness and positive McMurray \u2014 history and age guide differential.", "key_test": "McMurray; MRI", "key_feature": "Clear twisting mechanism + age <40 vs insidious >40 with no single incident", "region_label": "Knee"}, {"id": 62, "region_id": 11, "condition_a": "Patellofemoral Pain Syndrome (PFPS)", "condition_b": "Patellar Tendinopathy", "narrative": "PFPS: non-specific and vague retro-patellar or peri-patellar pain; may have no pain on palpation; diffuse ache harder to specifically localise; small effusion possible; worse with prolonged sitting (movie sign), stairs, running, weighted knee flexion; gradually worsening with continued running; can occur in active or sedentary. Patellar tendinopathy: very highly localised pain and tenderness at the inferior pole of the patella or mid-tendon; occurs in active populations only \u2014 very unlikely in sedentary; aggravated by jumping, running, change of direction, decline squats, hopping; quads contraction often painful; no swelling or clicks.", "key_test": "Palpation inferior pole patella; hop test", "key_feature": "Localised inferior pole tenderness vs diffuse/non-localised; active population only vs any population", "region_label": "Knee"}, {"id": 63, "region_id": 2, "condition_a": "Tibialis Posterior Tendinopathy", "condition_b": "Tarsal Tunnel Syndrome", "narrative": "Tibialis posterior tendinopathy: overuse or insidious onset; medial malleolus pain extending to medial midfoot; pain and weakness with resisted inversion; pain with heel raise and lack of hindfoot inversion on single-leg heel raise; excessive subtalar pronation; TOP over tendon behind medial malleolus or at navicular insertion. Tarsal tunnel syndrome: posterior tibial nerve entrapment; idiopathic in 50%; poorly defined burning, tingling, or numbness to plantar aspect of foot into toes; TOP over tarsal tunnel; worse with activity, better with rest; diffuse poorly defined pain \u2014 distinguish from S1 nerve root compression.", "key_test": "Resisted inversion strength; neural tension testing (plantar nerve)", "key_feature": "Overuse tendon pain vs burning/tingling neural distribution", "region_label": "Ankle"}, {"id": 64, "region_id": 2, "condition_a": "Ankle Lateral Ligament Injury", "condition_b": "Peroneal Tendinopathy", "narrative": "Lateral ligament (ATFL/CFL): traumatic inversion mechanism with acute pain and audible snap or tear; rapid swelling; laxity with inversion stress tests (graded I-III); TOP locally over ligaments (ATFL most common); Ottawa ankle rules for fracture exclusion. Peroneal tendinopathy: overuse or recurrent inversion injury; gradual onset; excessive pronation; TOP localised to tendon posterior to lateral malleolus or plantar aspect of cuboid; pain with passive inversion; pain with resisted eversion.", "key_test": "Inversion stress tests (ligament laxity); resisted eversion", "key_feature": "Traumatic acute with laxity vs overuse/pronation with tendon tenderness", "region_label": "Ankle"}, {"id": 65, "region_id": 2, "condition_a": "Peroneal Tendinopathy", "condition_b": "Sinus Tarsi Syndrome", "narrative": "Peroneal tendinopathy: TOP posterior to lateral malleolus or plantar cuboid; pain with resisted eversion; tight plantar flexors often contributing; related to excessive pronation. Sinus tarsi syndrome: influx of inflammatory cells into the sinus tarsi (anterior and inferior to lateral malleolus); single or repeated inversion injury history; poorly localised and vague pain around lateral malleolus; full pain-free ROM at the ankle joint (distinguishes from ligament injury); pain with forced passive eversion at subtalar joint; morning pain worse that eases with movement (inflammatory component). MRI for confirmation.", "key_test": "Subtalar passive eversion; MRI sinus tarsi", "key_feature": "Full ROM with vague lateral pain vs restricted eversion with tendon localisation", "region_label": "Ankle"}, {"id": 66, "region_id": 10, "condition_a": "Adductor-Related Groin Pain", "condition_b": "Iliopsoas-Related Groin Pain", "narrative": "Adductor-related: most common longstanding groin injury; pain at the medial groin most pronounced at the insertion of adductor longus on the pubic bone; pain with resisted adduction testing; sprinting, kicking, cutting sports. Iliopsoas-related: second most common; pain localised to anterior proximal thigh \u2014 more lateral than adductor-related pain; pain on resisted hip flexion AND/OR pain on stretching the hip flexors; TOP over iliopsoas. Location of pain is the primary differentiating criterion.", "key_test": "Resisted adduction vs resisted hip flexion", "key_feature": "Medial pubic insertion vs anterior proximal thigh; adduction vs flexion provocation", "region_label": "Hip"}, {"id": 67, "region_id": 10, "condition_a": "Adductor-Related Groin Pain", "condition_b": "Pubic-Related Groin Pain / Osteitis Pubis", "narrative": "Adductor-related: pain at adductor longus insertion on pubic bone; positive resisted adduction; no specific bone tenderness distinguishes from adductor insertion tenderness. Pubic-related: >6 weeks groin pain located in adductor or pubic bone region; present during and after sport/loading; TOP over pubic symphysis and immediately adjacent bone; no particular resistance test provides specific identification for pubic-related pain; pain with squeeze test is suggestive but not differential diagnostic; bone marrow oedema on MRI distinguishes.", "key_test": "MRI for bone marrow oedema; pubic symphysis palpation", "key_feature": "Duration >6 weeks and bone tenderness vs muscle/tendon provocation", "region_label": "Hip"}, {"id": 68, "region_id": 10, "condition_a": "Acute Groin Tear", "condition_b": "Longstanding / Chronic Groin Pain", "narrative": "Acute groin tear: injury occurs immediately; clear recollection of incident (40% kicking in football-based sports, 31% change of direction); pain immediate and limits further participation; adductor tears most common (66%), followed by iliopsoas (17-25%) and rectus femoris (15-23%). Longstanding: presents late during or after exercise \u2014 not immediately; added morning stiffness that eases with warm-up; if worsens, pain presents immediately on starting exercise; rest helps but pain returns with resumption of activity. Onset and timing of pain are the primary differentiating criteria.", "key_test": "Onset timing relative to activity", "key_feature": "Immediate onset with recollected incident vs late-onset with activity", "region_label": "Hip"}, {"id": 69, "region_id": 10, "condition_a": "Inguinal-Related Groin Pain", "condition_b": "Adductor-Related Groin Pain", "narrative": "Inguinal-related: pain in the inguinal canal region; pain with cough or sneeze; aggravated by abdominal flexion against resistance; no palpable hernia present; TOP of inguinal canal and abdominal insertion. Adductor-related: medial groin pain at pubic bone insertion; pain with resisted adduction; reproduced by sport-specific loading (kicking, cutting). Key: inguinal pain is provoked by abdominal pressure and Valsalva manoeuvre, while adductor pain is provoked by hip adduction loading.", "key_test": "Squeeze test (adductor) vs abdominal resistance test (inguinal)", "key_feature": "Valsalva/abdominal provocation vs hip adduction provocation", "region_label": "Hip"}, {"id": 70, "region_id": 4, "condition_a": "Cervicogenic Subtype", "condition_b": "Vestibular Subtype", "narrative": "Cervicogenic: headache reproduced by cervical provocation (FRT, segmental palpation); dizziness provoked by neck movement; restricted cervical AROM; neck pain present. Vestibular: dizziness provoked by head position change (not neck movement); positive Dix-Hallpike if BPPV; nausea common with positional change; cervical provocation does NOT reproduce dizziness.", "key_test": "FRT vs Dix-Hallpike", "key_feature": "Neck movement provokes dizziness vs head position change provokes dizziness", "region_label": "Concussion"}, {"id": 71, "region_id": 4, "condition_a": "Cervicogenic Subtype", "condition_b": "Post-Traumatic Migraine (Concussion)", "narrative": "Cervicogenic: non-throbbing dull headache starting in neck/occiput and radiating forward; reproduced by cervical provocation; restricted neck movement. Post-Traumatic Migraine: throbbing/pulsating quality; photophobia, phonophobia, and nausea with each episode; not reproduced by cervical testing.", "key_test": "Cervical provocation (FRT) vs symptom history", "key_feature": "Throbbing + nausea + photo/phonophobia = migraine; non-throbbing + cervical reproduction = cervicogenic", "region_label": "Concussion"}, {"id": 72, "region_id": 4, "condition_a": "Vestibular Subtype", "condition_b": "Post-Traumatic Migraine (Concussion)", "narrative": "Vestibular: dizziness is the primary complaint, provoked by head position change; VOMS abnormal; Dix-Hallpike may be positive. Post-Traumatic Migraine: dizziness associated with migraine headache episode; throbbing quality; not provoked by head position change in isolation.", "key_test": "Dix-Hallpike; VOMS", "key_feature": "Positional dizziness independent of headache vs dizziness accompanying migraine episode", "region_label": "Concussion"}, {"id": 73, "region_id": 4, "condition_a": "Autonomic / Exercise Intolerance Subtype", "condition_b": "Cervicogenic Subtype", "narrative": "Autonomic: symptoms exacerbated by aerobic exertion at a reproducible heart rate threshold; orthostatic intolerance; no cervical findings. BCTT establishes symptom threshold. Cervicogenic: exertion may worsen headache but cervical provocation reproduces symptoms independent of exertion; FRT and segmental palpation positive.", "key_test": "BCTT (symptom threshold HR) vs FRT", "key_feature": "Exertion-threshold heart rate provocation vs cervical movement/pressure provocation", "region_label": "Concussion"}], "red_flags": [{"id": 1, "region_id": 1, "condition_id": null, "flag_text": "Fever with abdominal pain", "severity": "urgent", "region_label": "Abdominal / Visceral", "condition_name": null}, {"id": 2, "region_id": 1, "condition_id": null, "flag_text": "Unintentional weight loss", "severity": "urgent", "region_label": "Abdominal / Visceral", "condition_name": null}, {"id": 3, "region_id": 1, "condition_id": null, "flag_text": "Change in bowel habit, blood in stool", "severity": "emergency", "region_label": "Abdominal / Visceral", "condition_name": null}, {"id": 4, "region_id": 1, "condition_id": null, "flag_text": "Haematuria or urinary symptoms with flank pain", "severity": "urgent", "region_label": "Abdominal / Visceral", "condition_name": null}, {"id": 5, "region_id": 1, "condition_id": null, "flag_text": "Pulsatile abdominal mass (suspect AAA", "severity": "refer", "region_label": "Abdominal / Visceral", "condition_name": null}, {"id": 6, "region_id": 1, "condition_id": null, "flag_text": "Peritonism: guarding, rebound tenderness, rigid abdomen", "severity": "urgent", "region_label": "Abdominal / Visceral", "condition_name": null}, {"id": 7, "region_id": 1, "condition_id": null, "flag_text": "Haemodynamic instability", "severity": "urgent", "region_label": "Abdominal / Visceral", "condition_name": null}, {"id": 8, "region_id": 1, "condition_id": null, "flag_text": "Positive pregnancy test with unilateral pelvic/abdominal pain (ectopic)", "severity": "urgent", "region_label": "Abdominal / Visceral", "condition_name": null}, {"id": 9, "region_id": 1, "condition_id": null, "flag_text": "Painless jaundice", "severity": "urgent", "region_label": "Abdominal / Visceral", "condition_name": null}, {"id": 10, "region_id": 1, "condition_id": null, "flag_text": "Epigastric pain with diaphoresis and jaw/left arm pain (cardiac)", "severity": "urgent", "region_label": "Abdominal / Visceral", "condition_name": null}, {"id": 11, "region_id": 1, "condition_id": null, "flag_text": "\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "severity": "urgent", "region_label": "Abdominal / Visceral", "condition_name": null}, {"id": 12, "region_id": 2, "condition_id": null, "flag_text": "Inability to weight-bear + deformity = fracture until proven otherwise", "severity": "urgent", "region_label": "Ankle", "condition_name": null}, {"id": 13, "region_id": 2, "condition_id": null, "flag_text": "Palpable Achilles gap + positive Thompson's = rupture, urgent", "severity": "urgent", "region_label": "Ankle", "condition_name": null}, {"id": 14, "region_id": 2, "condition_id": null, "flag_text": "Bilateral ankle swelling without trauma = systemic cause (cardiac, renal, inflammatory)", "severity": "emergency", "region_label": "Ankle", "condition_name": null}, {"id": 15, "region_id": 2, "condition_id": 8, "region_id": 18, "condition_id": null, "flag_text": "Suspected septic arthritis", "severity": "emergency", "region_label": "Wrist", "condition_name": null}, {"id": 129, "region_id": 18, "condition_id": null, "flag_text": "Night pain + weight loss + age \\>50", "severity": "urgent", "region_label": "Wrist", "condition_name": null}, {"id": 130, "region_id": 18, "condition_id": null, "flag_text": "\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500", "severity": "urgent", "region_label": "Wrist", "condition_name": null}, {"id": 131, "region_id": 12, "condition_id": null, "flag_text": "Lumbar or groin pain with pulsing quality \u2014 age >50 with cardiovascular risk factors (hypertension / smoking / hypercholesterolaemia / obesity / diabetes)", "severity": "urgent", "region_label": "Lumbar Spine", "condition_name": null}, {"id": 132, "region_id": 12, "condition_id": null, "flag_text": "Sudden onset of severe LBP with haemodynamic instability (hypotension / shock) \u2014 ruptured AAA", "severity": "emergency", "region_label": "Lumbar Spine", "condition_name": null}, {"id": 133, "region_id": 12, "condition_id": null, "flag_text": "Exercise-induced bilateral non-dermatomal leg symptoms with cardiovascular risk factors \u2014 screen for vascular claudication (vs neurogenic)", "severity": "urgent", "region_label": "Lumbar Spine", "condition_name": null}, {"id": 134, "region_id": 10, "condition_id": null, "flag_text": "Groin pulsation or throbbing \u2014 screen for AAA (as per lumbar vascular red flags)", "severity": "urgent", "region_label": "Hip", "condition_name": null}, {"id": 135, "region_id": 10, "condition_id": null, "flag_text": "Haematuria with hip or groin pain \u2014 screen for renal or urological pathology", "severity": "urgent", "region_label": "Hip", "condition_name": null}, {"id": 136, "region_id": 10, "condition_id": null, "flag_text": "Testicular swelling or pain with hip / groin symptoms \u2014 screen for testicular malignancy", "severity": "urgent", "region_label": "Hip", "condition_name": null}, {"id": 137, "region_id": 3, "condition_id": null, "flag_text": "3Ns \u2014 spontaneous nystagmus, nausea, numbness or paraesthesia of mouth / nose / face \u2014 CAD screening (with 5Ds)", "severity": "urgent", "region_label": "Cervical Spine", "condition_name": null}, {"id": 138, "region_id": 16, "condition_id": null, "flag_text": "Myocardial ischaemia: onset with exercise / activity / stress / emotions; constricting, vice-like or burning quality; referral into sternum, jaw, neck, inner arms, or interscapular region; age >40; feels generally unwell; inconsistent mechanical aggravation with testing \u2014 urgent medical referral", "severity": "emergency", "region_label": "Thoracic Spine", "condition_name": null}, {"id": 139, "region_id": 12, "condition_id": null, "flag_text": "Spondylolysis (pars stress fracture): progressive onset in active teenager with history of repeated trunk rotation + extension + lateral flexion loading; mechanical pain with ipsilateral lateral flexion and lumbar extension; localised posterior pain \u2014 CT for active fracture", "severity": "urgent", "region_label": "Lumbar Spine", "condition_name": null}, {"id": 140, "region_id": 12, "condition_id": null, "flag_text": "Traumatic vertebral fracture: high-impact mechanism (MVA, fall from height, axial load); severe pain disproportionate to presentation; screen dermatomes, myotomes, and reflexes for neural involvement \u2014 urgent imaging (CT/MRI)", "severity": "emergency", "region_label": "Lumbar Spine", "condition_name": null}, {"id": 141, "region_id": 12, "condition_id": null, "flag_text": "Osteoporotic fracture: older patient; pain disproportionate to minor trauma or trivial mechanism; history of previous fractures or osteoporosis risk \u2014 X-ray / CT to confirm and classify displaced vs non-displaced", "severity": "urgent", "region_label": "Lumbar Spine", "condition_name": null}, {"id": 142, "region_id": 12, "condition_id": null, "flag_text": "Cauda equina syndrome: bladder dysfunction (typically urinary retention \u2014 most important sign); bowel dysfunction (incontinence or constipation); sexual dysfunction (inability to orgasm, erectile failure, loss of vaginal sensation); pain into genitals; bilateral or unilateral radicular pain (bilateral should raise significant suspicion) \u2014 emergency MRI and urgent surgical referral", "severity": "emergency", "region_label": "Lumbar Spine", "condition_name": null}, {"id": 143, "region_id": 12, "condition_id": null, "flag_text": "Spinal tumour: worsening pain that is becoming constant; often severe pain worse at night; fever; unexpected weight loss; past history of cancer is the single highest-validity risk factor \u2014 MRI and blood tests", "severity": "urgent", "region_label": "Lumbar Spine", "condition_name": null}, {"id": 144, "region_id": 12, "condition_id": null, "flag_text": "Spinal infection: recent UTI, surgery, or direct infection; diabetes; significant widespread tenderness out of proportion to presentation; neurological symptoms; malaise and pyrexia \u2014 MRI and blood tests", "severity": "urgent", "region_label": "Lumbar Spine", "condition_name": null}, {"id": 145, "region_id": 11, "condition_id": null, "flag_text": "DVT: post-surgery or period of immobilisation; risk factors include oral contraceptives, obesity, clotting disorder history; distal swelling with calf and/or posterior knee pain \u2014 urgent Doppler ultrasound; do not massage or apply aggressive manual therapy", "severity": "emergency", "region_label": "Knee", "condition_name": null}, {"id": 146, "region_id": 2, "condition_id": null, "flag_text": "DVT (lower leg): occurs after immobilisation of leg or ankle; distal swelling, increased  null, "flag_text": "Deteriorating conscious state or GCS decline after initial assessment", "severity": "emergency", "region_label": "Concussion", "condition_name": null}, {"id": 152, "region_id": 4, "condition_id": null, "flag_text": "Seizure activity", "severity": "emergency", "region_label": "Concussion", "condition_name": null}, {"id": 153, "region_id": 4, "condition_id": null, "flag_text": "Repeated vomiting (>2 episodes)", "severity": "emergency", "region_label": "Concussion", "condition_name": null}, {"id": 154, "region_id": 4, "condition_id": null, "flag_text": "Focal neurological deficit \u2014 unilateral weakness, facial droop, slurred speech", "severity": "emergency", "region_label": "Concussion", "condition_name": null}, {"id": 155, "region_id": 4, "condition_id": null, "flag_text": "Neck pain with neurological signs \u2014 possible spinal cord injury", "severity": "emergency", "region_label": "Concussion", "condition_name": null}, {"id": 156, "region_id": 4, "condition_id": null, "flag_text": "Suspected skull fracture", "severity": "emergency", "region_label": "Concussion", "condition_name": null}, {"id": 157, "region_id": 4, "condition_id": null, "flag_text": "Worsening symptoms >24\u201348 hrs post-injury", "severity": "urgent", "region_label": "Concussion", "condition_name": null}, {"id": 158, "region_id": 4, "condition_id": null, "flag_text": "Worsening headache unresponsive to simple analgesia", "severity": "urgent", "region_label": "Concussion", "condition_name": null}, {"id": 159, "region_id": 4, "condition_id": null, "flag_text": "Visual field defect", "severity": "urgent", "region_label": "Concussion", "condition_name": null}, {"id": 160, "region_id": 4, "condition_id": null, "flag_text": "Suspected myelopathy \u2014 bilateral limb symptoms, bowel or bladder change", "severity": "emergency", "region_label": "Concussion", "condition_name": null}, {"id": 161, "region_id": 4, "condition_id": null, "flag_text": "Symptoms not improving by 4 weeks \ : "Lumbar Spine"}, {"id": 88, "region_id": 12, "condition_id": 22, "category": "aggravating", "question_text": "Does rest (prolonged sitting, inactivity) worsen the pain?", "positive_finding": "Yes \u2014 improves with exercise, worsens with rest", "significance": "Inflammatory pain paradoxically worsens with rest and improves with exercise; opposite to mechanical pain", "display_order": 1, "region_label": "Lumbar Spine"}, {"id": 89, "region_id": 12, "condition_id": 22, "category": "history", "question_text": "Age of onset under 45 years?", "positive_finding": "Yes \u2014 AS typically onset < 45", "significance": "Onset after 45 makes AS unlikely", "display_order": 1, "region_label": "Lumbar Spine"}, {"id": 90, "region_id": 12, "condition_id": 22, "category": "history", "question_text": "Symptoms present for more than 3 months?", "positive_finding": "Yes \u2014 chronic insidious course", "significance": "Duration > 3 months with inflammatory character meets key ASAS criteria", "display_order": 2, "region_label": "Lumbar Spine"}, {"id": 91, "region_id": 12, "condition_id": 22, "category": "history", "question_text": "Family history of AS, psoriasis, inflammatory bowel disease, or iritis?", "positive_finding": "Yes \u2014 HLA-B27 associated conditions", "significance": "Strong familial association with HLA-B27 related conditions", "display_order": 3, "region_label": "Lumbar Spine"}, {"id": 92, "region_id": 12, "condition_id": 22, "category": "history", "question_text": "Previous or current uveitis (red/painful eye), psoriasis, or inflammatory bowel disease?", "positive_finding": "Yes \u2014 extra-articular features of SpA", "significance": "Extra-articular manifestations are diagnostic features of axial spondyloarthropathy", "display_order": 4, "region_label": "Lumbar Spine"}, {"id": 93, "region_id": 12, "condition_id": 22, "category": "history", "question_text": "Any symptoms of systemic involvement \u2014 low grade fever, weight loss, or difficulty taking a deep breath?", "positive_finding": "Yes \u2014 systemic inflammatory features", "significance": "Systemic features including chest expansion limitation and low-grade fever are characteristic of advanced AS", "display_order": 5, "region_label": "Lumbar Spine"}, {"id": 94, "region_id": 16, "condition_id": null, "category": "pain_character", "question_text": "Does the pain radiate around the chest wall in a band or follow the line of an intercostal space?", "positive_finding": "Yes \u2014 circumferential band or intercostal distribution", "significance": "Thoracic disc herniation or intercostal nerve involvement; distinguish from cardiac or visceral referral by behaviour (mechanical vs constant)", "display_order": 1, "region_label": "Thoracic Spine"}, {"id": 95, "region_id": 16, "condition_id": null, "category": "pain_character", "question_text": "Does the pain refer from the upper back into the arm, hand, or lower back / groin?", "positive_finding": "Yes \u2014 wide referral pattern", "significance": "Upper thoracic can refer to upper limb; lower thoracic can refer to lower lumbar and groin \u2014 clear adjacent areas that may be the source or the target", "display_order": 2, "region_label": "Thoracic Spine"}, {"id": 96, "region_id": 16, "condition_id": null, "category": "history", "question_text": "Is the patient a teenager with thoracic pain aggravated by physical activity?", "positive_finding": "Yes \u2014 adolescent with load-related thoracic pain", "significance": "Consider Scheuermann's disease \u2014 kyphosis and end-plate changes; most common in this demographic", "display_order": 1, "region_label": "Thoracic Spine"}, {"id": 97, "region_id": 16, "condition_id": null, "category": "history", "question_text": "Is the patient an adolescent female with postural asymmetry or visible spinal curve?", "positive_finding": "Yes \u2014 adolescent female with spinal deformity", "significance": "Idiopathic scoliosis \u2014 most commonly presents in adolescent females; screen with Adam's forward bend test", "display_order": 2, "region_label": "Thoracic Spine"}, {"id": 98, "region_id": 16, "condition_id": null, "category": "history", "question_text": "Was there recent trauma (even minor) in an older patient, postmenopausal woman, or patient with known osteoporosis?", "positive_finding": "Yes \u2014 trauma in at-risk patient", "significance": "Screen for vertebral compression fracture \u2014 sudden onset with minor trauma in osteoporosis is high-risk; ask about loss of height and increasing kyphosis", "display_order": 3, "region_label": "Thoracic Spine"}, {"id": 99, "region_id": 16, "condition_id": null, "category": "history", "question_text": "Any loss of height, increasing spinal deformity, or pain provoked by standing, walking, coughing, or sneezing \u2014 and eased by lying down?", "positive_finding": "Yes \u2014 load-sensitive spinal pain with postural features", "significance": "Vertebral compression fracture pattern \u2014 lying down relieves compressive load; urgent imaging if suspected", "display_order": 4, "region_label": "Thoracic Spine"}, {"id": 100, "region_id": 16, "condition_id": null, "category": "aggravating", "question_text": "Is rotation (reaching behind, doing up a seatbelt, looking behind) a main aggravating movement?", "positive_finding": "Yes \u2014 rotation provokes", "significance": "Thoracic facet or costovertebral origin \u2014 rotation loads these structures", "display_order": 1, "region_label": "Thoracic Spine"}, {"id": 101, "region_id": 16, "condition_id": null, "category": "aggravating", "question_text": "Does taking a deep breath worsen the pain?", "positive_finding": "Yes \u2014 deep breath provokes", "significance": "Costovertebral joint involvement \u2014 deep breath provocation distinguishes thoracic origin from lumbar; also relevant to screening for pleurisy or pericarditis", "display_order": 2, "region_label": "Thoracic Spine"}, {"id": 102, "region_id": 16, "condition_id": null, "category": "red_flag_screen", "question_text": "Insidious onset of non-mechanical thoracic pain without clear cause, particularly at the T10\u2013L1 level?", "positive_finding": "Yes \u2014 non-mechanical thoracic / thoracolumbar pain", "significance": "Screen for extrapulmonary tuberculosis \u2014 presents at T10-L1; early stages may mimic mechanical backache", "display_order": 1, "region_label": "Thoracic Spine"}, {"id": 103, "region_id": 16, "condition_id": null, "category": "red_flag_screen", "question_text": "History of osteoporosis, menopause, diabetes, hypothyroidism, or long-term low calcium / vitamin D intake?", "positive_finding": "Yes \u2014 osteoporosis risk factors", "significance": "High risk of vertebral compression fracture \u2014 compression fractures most common in mid-thoracic and lumbar spine", "display_order": 2, "region_label": "Thoracic Spine"}, {"id": 104, "region_id": 16, "condition_id": null, "category": "red_flag_screen", "question_text": "Has the patient or a family member been diagnosed with rheumatoid arthritis or ankylosing spondylitis?", "positive_finding": "Yes \u2014 positive family or personal history of inflammatory arthritis", "significance": "Systemic inflammatory condition \u2014 review for other systemic features and refer if suspected", "display_order": 3, "region_label": "Thoracic Spine"}, {"id": 105, "region_id": 16, "condition_id": null, "category": "red_flag_screen", "question_text": "Any circulation problems in the upper extremities \u2014 swelling, coldness, colour change, fatigue, or cramping with overhead or sustained arm use?", "positive_finding": "Yes \u2014 vascular symptoms in upper limbs", "significance": "Thoracic outlet syndrome \u2014 the vascular supply to the upper limb passes through the thoracic outlet; also screen for subclavian vessel compression", "display_order": 4, "region_label": "Thoracic Spine"}, {"id": 106, "region_id": 3, "condition_id": null, "category": "red_flag_screen", "question_text": "5Ds \u2014 any of: dizziness or
