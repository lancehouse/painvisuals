2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## SACROILIAC JOINT (SIJ)\n\n### Laslett's SIJ Provocation Cluster\n\n**Indication:** SIJ dysfunction as source of low back pain\n\n**Tests included:** Distraction (gapping), Thigh Thrust (posterior shear), Compression (side-lying), Gaenslen's Test, Sacral Thrust\n\n**Patient position:** Varies per test (supine, side-lying, prone, side-lying with leg off table)\n\n**Distraction Test:** Patient supine. Examiner crosses arms and applies outward pressure on both ASISs simultaneously, gapping the anterior SIJ.\n\n**Thigh Thrust (Posterior Shear):** Patient supine, hip flexed to 90\u00b0. Examiner applies downward force through the femur, stressing the posterior SIJ.\n\n**Compression Test:** Patient side-lying. Examiner applies downward compression through the iliac crest.\n\n**Gaenslen's Test:** Patient supine at edge of table \u2014 one leg hangs off edge in extension, other hip/knee flexed to chest. Applies torsional stress to SIJ.\n\n**Positive finding:** Reproduction of concordant posterior pelvic/buttock pain with each test\n\n**Cluster interpretation:** 3 or more positive from the cluster (Laslett): Sensitivity 94%, Specificity 78%\n\n*Clinical note: Individual tests in isolation have poor accuracy. The cluster of 3+ positive tests provides clinically useful diagnostic information. Combine with McKenzie assessment (absence of centralisation) for increased specificity.*\n\nSources: JOSPT (Diagnostic Accuracy of Clusters of Pain Provocation Tests for SIJ), RAPM (Consensus Guidelines SIJ Complex Pain), ScienceDirect (Patrick's Test overview)\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## SHOULDER\n\n### Hawkins-Kennedy Test\n\n**Indication:** Subacromial impingement\n\n**Patient position:** Sitting or standing\n\n**Procedure:** Examiner flexes shoulder and elbow to 90\u00b0, then applies downward force at wrist to internally rotate, compressing the greater tuberosity under the coracoacromial arch\n\n**Positive finding:** Pain in the anterior or lateral shoulder\n\n**Sensitivity:** 79\u201380% \\| **Specificity:** 56\u201366%\n\n*Clinical note: High sensitivity \u2014 good ruling-OUT test when negative. Low specificity means positive result requires additional tests to confirm impingement vs other pathology.*\n\nSources: PMC (Comprehensive Examination of the Athlete's Shoulder), Annals of Palliative Medicine\n\n### Neer's Sign\n\n**Indication:** Subacromial impingement\n\n**Patient position:** Sitting or standing\n\n**Procedure:** Examiner stabilises scapula, passively forward flexes the internally rotated arm (thumb pointing down) to end range, compressing subacromial structures\n\n**Positive finding:** Pain in the anterior shoulder\n\n**Sensitivity:** 72\u201375% \\| **Specificity:** 51\u201366%\n\n*Clinical note: Used in combination with Hawkins-Kennedy. Three or more positive impingement tests (painful arc, Neer, Hawkins-Kennedy, external rotation resistance, empty can) significantly increases diagnostic certainty.*\n\nSources: PMC (Comprehensive Examination of the Athlete's Shoulder)\n\n### Painful Arc Test\n\n**Indication:** Subacromial impingement, rotator cuff pathology\n\n**Patient position:** Standing\n\n**Procedure:** Patient actively elevates arm in the scapular plane. Observe for pain through range.\n\n**Positive finding:** Pain occurring between 60\u2013120\u00b0 of elevation\n\n**Sensitivity:** 74\u201380% \\| **Specificity:** 80%\n\n*Clinical note: Highest specificity of the common impingement tests. Pain above 120\u00b0 suggests ACJ pathology. Best combined with Neer and Hawkins-Kennedy.*\n\nSources: Annals of Palliative Medicine\n\n### Full Can Test (Supraspinatus Test)\n\n**Indication:** Supraspinatus tear or weakness\n\n**Patient position:** Standing or sitting\n\n**Procedure:** Patient holds arm at 90\u00b0 elevation in the scapular plane (30\u201345\u00b0 forward of coronal plane), thumb pointing up (full can position). Examiner applies downward resistance.\n\n**Positive finding:** Weakness and/or pain with resistance\n\n**Sensitivity:** 69\u201379% \\| **Specificity:** 66\u201380%\n\n*Clinical note: Generally preferred over Empty Can (Jobe) as it reduces impingement artefact. Pain without weakness may suggest impingement; weakness without pain suggests tear.*\n\nSources: PMC (Comprehensive Examination of the Athlete's Shoulder)\n\n### Empty Can Test (Jobe Test)\n\n**Indication:** Supraspinatus tear\n\n**Patient position:** Standing or sitting\n\n**Procedure:** Arm at 90\u00b0 in scapular plane, internally rotated so thumb points down (empty can position). Examiner applies downward resistance.\n\n**Positive finding:** Weakness and/or pain\n\n**Sensitivity:** 52\u201369% \\| **Specificity:** 66\u201382%\n\n*Clinical note: Similar to Full Can but more provocative. Weakness = likely tear. Pain alone = may indicate impingement or tendinopathy.*\n\nSources: PMC Comprehensive Examination of the Athlete's Shoulder\n\n### External Rotation Lag Sign\n\n**Indication:** Full-thickness infraspinatus/supraspinatus tear\n\n**Patient position:** Sitting\n\n**Procedure:** Examiner passively places arm at near full external rotation with elbow flexed to 90\u00b0. Patient asked to hold position as examiner releases.\n\n**Positive finding:** Inability to maintain position \u2014 arm falls into internal rotation (lag)\n\n**Sensitivity:** 97% \\| **Specificity:** 93%\n\n*Clinical note: Highly accurate for combined full-thickness supraspinatus and infraspinatus tears. A positive lag sign is a significant finding warranting imaging.*\n\nSources: PMC Comprehensive Examination of the Athlete's Shoulder\n\n### Apprehension Test\n\n**Indication:** Anterior glenohumeral instability\n\n**Patient position:** Supine or sitting\n\n**Procedure:** Examiner places shoulder in 90\u00b0 abduction and externally rotates to end range. Apply gentle anterior force.\n\n**Positive finding:** Apprehension or guarding (not just pain). Relocation test: posterior pressure on humeral head relieves apprehension.\n\n*Note: Specificity rises to near 100% when apprehension (not pain) is the criterion for positivity.*\n\n**Sensitivity:** 53\u201372% \\| **Specificity:** 96\u2013100% (when apprehension criterion used)\n\nSources: PMC Physical Exam and Evaluation of the Unstable Shoulder\n\n### Load and Shift Test\n\n**Indication:** Glenohumeral anterior/posterior instability\n\n**Patient position:** Sitting, hand resting on thigh\n\n**Procedure:** Examiner loads humeral head into glenoid then shifts anteriorly and posteriorly. Grade translation: 0 = minimal, 1 = to glenoid rim, 2 = over rim but reduces, 3 = dislocates.\n\n**Positive finding:** Excessive translation grade 2+ or apprehension\n\n**Sensitivity:** 50% (anterior), 14% (posterior) \\| **Specificity:** 100% for both\n\n*Clinical note: Highly specific but poorly sensitive \u2014 a positive result is meaningful but a negative does not rule out instability.*\n\nSources: PMC Physical Exam and Evaluation of the Unstable Shoulder\n\n### Speed's Test\n\n**Indication:** Biceps tendon pathology (SLAP, bicipital tendinopathy)\n\n**Patient position:** Standing\n\n**Procedure:** Arm forward flexed to 90\u00b0, elbow extended, forearm supinated. Examiner applies downward resistance.\n\n**Positive finding:** Anterior shoulder/bicipital groove pain\n\n**Sensitivity:** 54% \\| **Specificity:** 81%\n\nSources: PMC Comprehensive Examination of the Athlete's Shoulder\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## ELBOW\n\n### Cozen's Test (Resisted Wrist Extension)\n\n**Indication:** Lateral epicondylalgia (tennis elbow)\n\n**Patient position:** Sitting, elbow extended or slightly flexed, forearm pronated\n\n**Procedure:** Patient makes a fist. Examiner applies resistance against wrist extension and radial deviation while palpating the lateral epicondyle.\n\n**Positive finding:** Reproduction of pain at the lateral epicondyle or within 2 cm distal\n\n**Sensitivity:** ~84% \\| **Specificity:** ~67%\n\nSources: JOSPT (Lateral Elbow Pain and Muscle Function Impairments, IFSPT)\n\n### Mill's Stretch Test\n\n**Indication:** Lateral epicondylalgia\n\n**Patient position:** Sitting or standing, elbow at 90\u00b0, forearm pronated, wrist fully flexed\n\n**Procedure:** Examiner slowly extends the elbow while palpating the lateral epicondyle\n\n**Positive finding:** Reproduction of lateral epicondyle pain\n\n**Sensitivity:** 53\u201376% \\| **Specificity:** 100%\n\n*Clinical note: Very high specificity \u2014 when positive, strongly confirms lateral epicondylalgia. Low-moderate sensitivity means a negative test does not rule it out.*\n\nSources: JOSPT (Lateral Elbow Pain and Muscle Function Impairments, IFSPT)\n\n### Maudsley's Test (Resisted Middle Finger Extension)\n\n**Indication:** Lateral epicondylalgia\n\n**Patient position:** Elbow extended, forearm pronated\n\n**Procedure:** Examiner resists extension of the middle finger at the proximal phalanx\n\n**Positive finding:** Pain at the lateral epicondyle (stresses ECRB specifically)\n\n**Sensitivity/Specificity:** Limited data; similar pattern to Cozen's\n\n*Clinical note: Targets ECRB more selectively. Useful when Cozen's is equivocal.*\n\nSources: JOSPT (Lateral Elbow Pain and Muscle Function Impairments, IFSPT), StatPearls (Lateral Epicondylitis)\n\n### Valgus Stress Test (Elbow)\n\n**Indication:** Medial collateral ligament (UCL) integrity\n\n**Patient position:** Sitting, elbow at 30\u00b0 flexion (unlocks olecranon), forearm supinated\n\n**Procedure:** Examiner applies valgus stress at the elbow\n\n**Positive finding:** Pain at medial joint line and/or excessive gapping/laxity compared to contralateral side\n\n**Sensitivity/Specificity:** Limited high-quality data; primarily clinical utility test\n\n*Clinical note: Compare bilaterally. Used alongside milking manoeuvre for UCL assessment in overhead athletes.*\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## WRIST AND HAND\n\n### Phalen's Test\n\n**Indication:** Carpal tunnel syndrome\n\n**Patient position:** Sitting\n\n**Procedure:** Patient holds wrists in full passive flexion (90\u00b0) for 60 seconds, forearms horizontal\n\n**Positive finding:** Reproduction of paraesthesia in the median nerve distribution (thumb, index, middle, radial half of ring finger) within 60 seconds\n\n**Sensitivity:** 67\u201368% \\| **Specificity:** 73%\n\n*Clinical note: Most commonly used carpal tunnel screen. Combine with Tinel's for better accuracy. Shorter onset of symptoms indicates more severe compression.*\n\nSources: StatPearls, APTA Orthopedics\n\n### Tinel's Sign (Wrist)\n\n**Indication:** Carpal tunnel syndrome\n\n**Patient position:** Sitting\n\n**Procedure:** Examiner taps over the carpal tunnel at the wrist crease (over median nerve)\n\n**Positive finding:** Tingling or paraesthesia reproducing into the median nerve distribution\n\n**Sensitivity:** 50\u201360% \\| **Specificity:** 77%\n\n*Clinical note: Less sensitive than Phalen's but similar specificity. Used as a supplementary test.*\n\nSources: StatPearls\n\n### Finkelstein's Test\n\n**Indication:** De Quervain's tenosynovitis (APL/EPB tendons)\n\n**Patient position:** Sitting\n\n**Procedure:** Patient places thumb in palm, wraps fingers around thumb (fist position). Examiner passively ulnar deviates the wrist.\n\n**Positive finding:** Sharp pain over the radial styloid / first dorsal compartment\n\n**Sensitivity:** 81\u201389% \\| **Specificity:** 50\u201357%\n\n*Clinical note: High sensitivity \u2014 a negative test makes de Quervain's unlikely. Pain must be at the first compartment, not the CMC joint (which would suggest OA instead).*\n\nSources: Springer Nature (Art of the Musculoskeletal Physical Exam)\n\n### Scaphoid Tenderness (Anatomical Snuffbox)\n\n**Indication:** Scaphoid fracture\n\n**Patient position:** Sitting\n\n**Procedure:** Palpation within the anatomical snuffbox (between EPL and EPB/APL tendons) with wrist in neutral\n\n**Positive finding:** Tenderness on palpation\n\n**Sensitivity:** 87\u2013100% \\| **Specificity:** 40%\n\n*Clinical note: Highly sensitive screening test for scaphoid fracture. A negative test substantially reduces likelihood of fracture. Low specificity means other pathology can also cause tenderness here. Ottawa-style rule: persistent snuffbox tenderness after trauma warrants imaging even if initial X-ray is negative.*\n\nSources: Clinical orthopedic reference texts\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## HIP\n\n### FADIR Test (Flexion-Adduction-Internal Rotation)\n\n**Indication:** Femoroacetabular impingement (FAI), labral tear\n\n**Patient position:** Supine\n\n**Procedure:** Examiner passively flexes hip to 90\u00b0, then adducts and internally rotates with overpressure at end range\n\n**Positive finding:** Reproduction of concordant groin/anterior hip pain; may elicit clicking, catching\n\n**Sensitivity:** 88\u201396% \\| **Specificity:** 11\u201325%\n\n*Clinical note: Very high sensitivity \u2014 excellent screening test. A negative FADIR makes FAI/labral tear unlikely. Low specificity means positive result requires further investigation (MRI arthrogram is gold standard for labral tears). Not diagnostic in isolation.*\n\nSources: PMC Examination of FAI, AAFP (Evaluation of the Patient with Hip Pain), IJSPT (Dysplasia Delphi Study)\n\n### FABER Test (Flexion-Abduction-External Rotation / Patrick's Test)\n\n**Indication:** Hip intra-articular pathology, SIJ dysfunction, iliopsoas tightness\n\n**Patient position:** Supine\n\n**Procedure:** Place test leg in figure-of-4 position (hip flexed, abducted, externally rotated, ankle resting on opposite knee). Examiner gently depresses the knee toward the table.\n\n**Positive finding:** Groin pain = intra-articular hip pathology; posterior pelvic pain = SIJ involvement; limited range = hip OA or iliopsoas tightness\n\n**Sensitivity:** 60\u201399% \\| **Specificity:** low\u2013moderate (varies by pathology)\n\n*Clinical note: Non-specific but highly sensitive screening test. Response location guides diagnosis. For FAI: groin pain is positive indicator. For SIJ: posterior pain is positive indicator.*\n\nSources: AAFP Evaluation of the Patient with Hip Pain, APTA Orthopedics\n\n### Trendelenburg Sign\n\n**Indication:** Hip abductor weakness (glute med), hip OA\n\n**Patient position:** Standing\n\n**Procedure:** Patient stands on one leg. Observe contralateral pelvis.\n\n**Positive finding:** Drop of the contralateral pelvis more than 2 cm when standing on affected limb (weak abductors unable to stabilise pelvis)\n\n**Sensitivity:** 55% \\| **Specificity:** 70%\n\n*Clinical note: Moderate sensitivity/specificity. A positive Trendelenburg is clinically significant but absence does not rule out abductor dysfunction. Combine with hip abductor strength testing.*\n\nSources: PMC Chronic Hip Pain in Adults\n\n### Thomas Test\n\n**Indication:** Hip flexor tightness (iliopsoas), loss of hip extension\n\n**Patient position:** Supine at edge of table\n\n**Procedure:** Patient holds one knee to chest (flattens lumbar lordosis). The opposite leg is allowed to lower toward table. Normal = leg rests flat or close to flat.\n\n**Positive finding:** Contralateral leg rises off table (or cannot lower to table level), indicating hip flexor tightness on the tested side\n\n**Sensitivity/Specificity:** Not well established as a diagnostic test; primarily a mobility/impairment measure\n\n*Clinical note: Modified Thomas Test (knee hanging off edge of table) allows differentiation of hip flexor tightness from rectus femoris tightness (knee flexion angle).*\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## KNEE\n\n### Lachman's Test\n\n**Indication:** Anterior cruciate ligament (ACL) tear\n\n**Patient position:** Supine, knee at 15\u201330\u00b0 flexion\n\n**Procedure:** One hand stabilises distal femur, other grasps proximal tibia and translates anteriorly. Assess amount of translation and quality of end feel (firm vs soft/mushy).\n\n**Positive finding:** Excessive anterior tibial translation with soft end feel compared to contralateral side\n\n**Sensitivity:** 68% (partial tears), 96% (complete tears) \\| **Specificity:** 95%+\n\n*Clinical note: Most accurate clinical test for ACL. Soft or absent end feel is the most important finding \u2014 translation amount alone can be misleading. Lachman is the most sensitive of the ACL tests (vs anterior drawer and pivot shift).*\n\nSources: Medicine Today Australia (ACL injuries in Children and Adolescents), Washington State L&I Conservative Care Options for Knee\n\n### Anterior Drawer Test (Knee)\n\n**Indication:** ACL tear (less sensitive in acute; better for chronic)\n\n**Patient position:** Supine, hip flexed 45\u00b0, knee flexed 90\u00b0, foot flat\n\n**Procedure:** Examiner sits on patient's foot for stabilisation. Grasps proximal tibia with thumbs on tibial plateau, pulls anteriorly.\n\n**Positive finding:** Anterior tibial translation greater than contralateral side\n\n**Sensitivity:** 18\u201392% \\| **Specificity:** 78\u201398%\n\n*Clinical note: Wide sensitivity range \u2014 less reliable than Lachman's in acute injury due to hamstring guarding. More useful in chronic ACL deficiency. Check hamstring relaxation before interpreting.*\n\nSources: Washington State L&I Conservative Care Options for Knee, Swedish Doctoral Thesis (Predictors of outcome after ACL reconstruction)\n\n### McMurray's Test\n\n**Indication:** Meniscal tear\n\n**Patient position:** Supine\n\n**Procedure:** Examiner grasps heel and knee. Fully flexes knee, then externally rotates tibia and extends the knee (for medial meniscus). Repeat with internal rotation (lateral meniscus).\n\n**Positive finding:** Palpable or audible click, clunk, or reproduction of concordant joint line pain during extension\n\n**Sensitivity:** 53\u201358% \\| **Specificity:** 59\u201398%\n\n*Clinical note: Highly variable across studies. A palpable clunk is more specific than pain alone. Combine with joint line palpation and Thessaly test for better accuracy.*\n\nSources: Washington State L&I Conservative Care Options for Knee\n\n### Thessaly Test\n\n**Indication:** Meniscal tear\n\n**Patient position:** Standing on one leg, knee at 20\u00b0 flexion\n\n**Procedure:** Patient rotates body (internal and external rotation) three times while maintaining 20\u00b0 knee flexion, with examiner supporting hands for balance\n\n**Positive finding:** Medial or lateral joint line pain or discomfort, or sensation of locking/catching\n\n**Sensitivity:** 66\u201389% \\| **Specificity:** 91\u201397%\n\n*Clinical note: Performed at both 5\u00b0 and 20\u00b0 flexion \u2014 20\u00b0 is more sensitive. Higher accuracy than McMurray in some studies. Requires patient cooperation and adequate balance.*\n\nSources: JOSPT, Clinical orthopedic references\n\n### Valgus and Varus Stress Tests (Knee)\n\n**Indication:** MCL (valgus) and LCL (varus) integrity\n\n**Patient position:** Supine, knee at 0\u00b0 and 30\u00b0 flexion\n\n**Procedure:** Examiner stabilises thigh, applies valgus or varus force at ankle. Test at 0\u00b0 (tests capsule + collateral) and 30\u00b0 (isolates collateral ligament).\n\n**Positive finding:** Joint line pain and/or excessive gapping compared to contralateral side\n\n**Sensitivity/Specificity:** Not well established for isolated stress testing; primarily clinical utility\n\n*Clinical note: Laxity at 30\u00b0 only = isolated collateral tear. Laxity at 0\u00b0 = combined capsular + collateral involvement. Compare bilaterally.*\n\n### Posterior Sag Sign (Godfrey's Test)\n\n**Indication:** PCL tear\n\n**Patient position:** Supine, hip and knee both at 90\u00b0\n\n**Procedure:** Observe the tibial tuberosity position compared to the contralateral side\n\n**Positive finding:** Posterior sag of the tibia relative to femur (tibial tuberosity disappears posteriorly)\n\n**Sensitivity:** 79% \\| **Specificity:** 100%\n\n*Clinical note: Highly specific \u2014 a positive posterior sag is essentially diagnostic of PCL tear.*\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## ANKLE AND FOOT\n\n### Anterior Drawer Test (Ankle)\n\n**Indication:** Anterior talofibular ligament (ATFL) integrity\n\n**Patient position:** Sitting or supine, foot in slight plantarflexion (10\u201320\u00b0)\n\n**Procedure:** Examiner stabilises distal tibia, grasps calcaneum and applies anterior force to talus\n\n**Positive finding:** Excessive anterior talar displacement (suction sign, or greater than 10 mm / greater than 3 mm difference side-to-side)\n\n**Sensitivity:** 71\u201396% \\| **Specificity:** 33\u201384%\n\n*Clinical note: Best performed in the acute phase after swelling has settled (24\u201348 hours). Most commonly injured ligament in inversion sprains.*\n\n### Talar Tilt Test\n\n**Indication:** Calcaneofibular ligament (CFL) integrity\n\n**Patient position:** Supine or sitting, ankle in neutral\n\n**Procedure:** Examiner stabilises distal tibia, tilts talus into inversion (tests CFL) or eversion (tests deltoid)\n\n**Positive finding:** Excessive talar tilt compared to contralateral side, or reproduction of pain\n\n**Sensitivity:** 50% \\| **Specificity:** 88%\n\n*Clinical note: More specific than sensitive \u2014 a positive tilt indicates CFL damage but absence does not rule it out. CFL injury typically occurs alongside ATFL injury in grade 2\u20133 sprains.*\n\n### Squeeze Test (Syndesmosis / Fibular Integrity)\n\n**Indication:** Syndesmotic sprain, fibular fracture\n\n**Patient position:** Supine\n\n**Procedure:** Examiner compresses fibula to tibia at mid-calf level\n\n**Positive finding:** Reproduction of ankle pain (distal to squeeze point) suggesting syndesmotic disruption; if pain at the compression point, consider fibular stress fracture\n\n**Sensitivity:** 30% \\| **Specificity:** 93%\n\n*Clinical note: Low sensitivity but very specific \u2014 a positive squeeze test should prompt imaging to rule out Maisonneuve or fibular fracture.*\n\n### Ottawa Ankle and Foot Rules\n\n**Indication:** Ruling out ankle and foot fractures post trauma\n\n**Patient position:** Weight-bearing\n\n**Procedure:** Imaging indicated if:\n\n- Ankle: bone tenderness at posterior edge or tip of lateral malleolus (zone A) OR medial malleolus (zone B), or inability to weight-bear (4 steps) immediately after injury and in the emergency department\n\n- Foot: bone tenderness at base of 5th metatarsal or navicular\n\n**Positive finding:** Any above criteria = imaging required\n\n**Sensitivity:** 99.4\u2013100% \\| **Specificity:** 35\u201350% (ankle); 42\u201379% (foot)\n\n*Clinical note: Designed as a rule-out tool \u2014 near-perfect sensitivity means a negative Ottawa result reliably excludes clinically significant fracture. Application can reduce unnecessary imaging by 30\u201340%.*\n\nSources: EB Medicine (Ottawa Ankle Rules), PMC Clinical Usefulness of Ottawa Ankle Rules\n\n### Thompson's Test (Simmonds' Test)\n\n**Indication:** Achilles tendon rupture\n\n**Patient position:** Prone, feet off edge of table\n\n**Procedure:** Examiner squeezes the calf at mid-belly\n\n**Positive finding:** Absence of plantarflexion (foot does not move)\n\n**Sensitivity:** 96% \\| **Specificity:** 93%\n\n*Clinical note: High accuracy. Confirm that the squeeze is on the muscle belly, not the tendon. A positive Thompson's is essentially diagnostic of complete Achilles rupture.*\n\n### Windlass Test\n\n**Indication:** Plantar fasciitis\n\n**Patient position:** Standing or non-weight-bearing\n\n**Procedure:** Examiner extends the big toe to end range (passive dorsiflexion at MTP joint) while the patient is in standing (weight-bearing Windlass) or supine (non-weight-bearing)\n\n**Positive finding:** Reproduction of concordant heel/plantar foot pain\n\n**Sensitivity:** 32% (weight-bearing) \\| **Specificity:** 100%\n\n*Clinical note: Low sensitivity but very high specificity \u2014 a positive weight-bearing Windlass test is essentially confirmatory for plantar fasciitis. Negative result does not rule it out.*\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## NEURAL / SENSORY CLINICAL TESTS\n\n### Pressure Pain Threshold (PPT)\n\n**Indication:** Central sensitisation, nociplastic pain, widespread hyperalgesia\n\n**Patient position:** Seated or supine\n\n**Procedure:** Algometer applied perpendicular to skin at standardised sites (e.g. thenar eminence, tibialis anterior, trapezius). Pressure increased at 40 kPa/s until patient reports pain onset. Measure in kPa.\n\n**Positive finding:** Reduced PPT at local AND remote sites compared to normative values; local-to-remote ratio indicates peripheral vs central sensitisation\n\n**Sensitivity/Specificity:** Research tool; normative data varies by site and population\n\n*Clinical note: Lowered remote-site PPT (outside the painful area) is a key indicator of central sensitisation and nociplastic pain. Useful to track treatment response.*\n\nSources: APTA Orthopedics (Whiplash / Neural Sensitisation literature)\n\n### Central Sensitisation Inventory (CSI)\n\n**Indication:** Nociplastic pain / central sensitisation screening\n\n**Patient position:** Self-report questionnaire\n\n**Procedure:** 25-item patient-reported symptom inventory covering pain, fatigue, sleep, cognitive, and emotional symptoms\n\n**Positive finding:** Score \u226540/100 indicates likely central sensitisation\n\n**Sensitivity:** 81% \\| **Specificity:** 75%\n\n*Clinical note: A validated, easy-to-administer screening tool. Does not diagnose central sensitisation but identifies patients requiring mechanism-informed treatment.*\n\nSources: JOSPT, Dove Medical Press (Central Sensitisation and Nociplastic Pain)\n\n### Neurodynamic Tests (General Principle)\n\n*(See ULNT1 under Cervical Spine; SLR and Slump under Lumbar Spine)*\n\n*Clinical note: All neurodynamic tests follow the principle of sequential tissue loading. The key positive indicator is: (1) symptom reproduction concordant with the patient's complaint, AND (2) symptom change with a sensitising movement (typically at the opposite end of the neural system). Neither criterion alone is sufficient.*\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## KEY INTERPRETATION PRINCIPLES\n\n**High Sensitivity tests (use to RULE OUT):**\n\n- FADIR (hip): 88\u201396% \u2014 negative = likely not FAI/labral\n\n- Lachman's ACL complete tear: 96% \u2014 negative = likely intact ACL\n\n- Ottawa Ankle Rules: ~100% \u2014 negative = fracture highly unlikely\n\n- Thompson's Achilles: 96% \u2014 negative = likely not complete rupture\n\n- ULNT1: 72\u201397% \u2014 negative = neural tension less likely\n\n**High Specificity tests (use to RULE IN):**\n\n- Spurling's: 90\u2013100% \u2014 positive = likely radiculopathy\n\n- Mill's Stretch: 100% \u2014 positive = confirms lateral epicondylalgia\n\n- Windlass: 100% \u2014 positive = confirms plantar fasciitis\n\n- Posterior Sag Sign: 100% \u2014 positive = PCL tear\n\n- Apprehension (apprehension criterion): ~100% \u2014 positive = anterior instability\n\n- Squeeze (ankle): 93% \u2014 positive = syndesmotic/fibular pathology\n\n**Cluster testing principle:**\n\nSingle tests in isolation are rarely sufficient. Combining 2\u20133 tests for the same pathology dramatically improves diagnostic accuracy. Key validated clusters:\n\n- Cervical radiculopathy: Spurling's + ULNT1 + Distraction\n\n- SIJ dysfunction: Laslett's cluster (3 of 5 positive): Sens 94%, Spec 78%\n\n- Subacromial impingement: 3+ of (Painful Arc, Neer, Hawkins-Kennedy, ER resistance, Empty Can)\n\n- Carpal tunnel: Phalen's + Tinel's + hand diagram (nerve distribution)\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## SOURCES\n\n1.  APTA Orthopedics \u2014 Physical Therapy Practice (Multiple editions)\n\n2.  PMC \u2014 Comprehensive Examination of the Athlete's Shoulder (2018)\n\n3.  PMC \u2014 Physical Exam and Evaluation of the Unstable Shoulder\n\n4.  Annals of Palliative Medicine \u2014 Understanding the Physical Examination of the Shoulder\n\n5.  JOSPT \u2014 Clinical Tests to Diagnose Lumbar Segmental Instability\n\n6.  JOSPT \u2014 Diagnostic Accuracy of Clusters of Pain Provocation Tests for SIJ\n\n7.  NASS \u2014 Diagnosis and Treatment of Degenerative Lumbar Spinal Stenosis\n\n8.  AAFP \u2014 Evaluation of the Patient with Hip Pain (2014)\n\n9.  PMC \u2014 Chronic Hip Pain in Adults\n\n10. IJSPT \u2014 Non-Operative Rehabilitation for Acetabular Dysplasia\n\n11. Medicine Today Australia \u2014 ACL injuries in Children and Adolescents (2019)\n\n12. Washington State L&I \u2014 Conservative Care Options for Work-Related Knee Conditions\n\n13. EB Medicine \u2014 Ottawa Ankle and Foot Rules\n\n14. PMC \u2014 Clinical Usefulness of the Ottawa Ankle Rules\n\n15. JOSPT \u2014 Lateral Elbow Pain and Muscle Function Impairments (IFSPT CPG, 2022)\n\n16. StatPearls / NCBI \u2014 Lateral Epicondylitis\n\n17. RAPM \u2014 Consensus Practice Guidelines on SIJ Complex Pain (2025)\n\n18. ScienceDirect \u2014 Diagnostic Validity of Criteria for SIJ Pain\n\n19. Dove Medical Press \u2014 Central Sensitisation and Nociplastic Pain\n\n20. APA (Australian Physiotherapy Association) \u2014 Nociplastic Pain and Acute LBP", "source_file": "Physiotherapy Clinical Special Tests _ Complete Re_2026.md"}, {"id": 6, "name": "Upper Limb Neural Assessment", "category": "assessment", "region_id": null, "content": "## Power (Myotomes)\n\nOne muscle per level \u2014 most isolated and reliable representative:\n\n| **Level** | **Test**                  | **Action to resist**  |\n|-----------|---------------------------|-----------------------|\n| **C5**    | Deltoid                   | Shoulder abduction    |\n| **C6**    | Wrist extensors (ECRL/B)  | Wrist extension       |\n| **C7**    | Triceps                   | Elbow extension       |\n| **C8**    | Finger flexors (FDP)      | Grip / finger flexion |\n| **T1**    | Interossei (first dorsal) | Finger abduction      |\n\n\\> Skip biceps for power \u2014 it's shared C5/C6 and redundant once you test deltoid and wrist extensors separately.\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Reflexes\n\nOnly three are clinically meaningful and non-redundant:\n\n| **Reflex**          | **Level** | **Note**                           |\n|---------------------|-----------|------------------------------------|\n| **Biceps**          | C5\u20136      | Use fingernail-on-tendon technique |\n| **Brachioradialis** | C6        | Best differentiator of C6 vs C5    |\n| **Triceps**         | C7        | Only reliable C7 reflex            |\n\n\\> Hoffman's sign is worth adding if UMN/myelopathy is suspected (finger flick test).\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Sensation (Dermatomes)\n\nMost isolated, discriminating spot per level \u2014 not the overlap zones:\n\n| **Level** | **Location**                            |\n|-----------|-----------------------------------------|\n| **C5**    | Lateral arm (regimental patch area)     |\n| **C6**    | Thumb and index finger / radial forearm |\n| **C7**    | Middle finger                           |\n| **C8**    | Little finger / ulnar hand              |\n| **T1**    | Medial forearm (just above elbow)       |\n\nUse **light touch** as the primary screen; add **pinprick** if you need to differentiate fibre type (e.g. suspected cord pathology vs root).\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n## Summary\n\nComplete C5\u2013T1 sweep: 5 power tests, 3 reflexes, 5 sensation points \u2014 everything useful, nothing duplicated.", "source_file": "Upper Limb Neural Assessment_20260506_114502.md"}], "test_field_map": [{"id": 1, "test_id": 1, "pab_field_id": "st_hawkins_l", "pab_json_file": "objective", "pab_json_path": "shoulder.special.st_hawkins_l", "side": "l"}, {"id": 2, "test_id": 1, "pab_field_id": "st_hawkins_r", "pab_json_file": "objective", "pab_json_path": "shoulder.special.st_hawkins_r", "side": "r"}, {"id": 3, "test_id": 2, "pab_field_id": "st_neer_l", "pab_json_file": "objective", "pab_json_path": "shoulder.special.st_neer_l", "side": "l"}, {"id": 4, "test_id": 2, "pab_field_id": "st_neer_r", "pab_json_file": "objective", "pab_json_path": "shoulder.special.st_neer_r", "side": "r"}, {"id": 5, "test_id": 3, "pab_field_id": "st_painful_arc_l", "pab_json_file": "objective", "pab_json_path": "shoulder.special.st_painful_arc_l", "side": "l"}, {"id": 6, "test_id": 3, "pab_field_id": "st_painful_arc_r", "pab_json_file": "objective", "pab_json_path": "shoulder.special.st_painful_arc_r", "side": "r"}, {"id": 7, "test_id": 4, "pab_field_id": "st_empty_can_l", "pab_json_file": "objective", "pab_json_path": "shoulder.special.st_empty_can_l", "side": "l"}, {"id": 8, "test_id": 4, "pab_field_id": "st_empty_can_r", "pab_json_file": "objective", "pab_json_path": "shoulder.specia // Index lookup maps
const regionById = {};
KB.regions.forEach(r => regionById[r.id] = r);
const regionByPabId = {};
KB.regions.forEach(r => regionByPabId[r.pab_id] = r);
const condById = {};
KB.conditions.forEach(c => condById[c.id] = c);
const testById = {};
KB.tests.forEach(t => testById[t.id] = t);
const clusterById = {};
KB.clusters.forEach(cl => clusterById[cl.id] = cl);

// Grouped lookups
const clustersByRegion = {};
KB.clusters.forEach(cl => {
  (clustersByRegion[cl.pab_region_id] = clustersByRegion[cl.pab_region_id] || []).push(cl);
});
const testsByCluster = {};
KB.cluster_test.forEach(ct => {
  (testsByCluster[ct.cluster_id] = testsByCluster[ct.cluster_id] || []).push(ct);
});
const clustersByCondition = {};
KB.clusters.forEach(cl => {
  (clustersByCondition[cl.condition_id] = clustersByCondition[cl.condition_id] || []).push(cl);
});
const condsByRegion = {};
KB.conditions.forEach(c => {
  const key = c.region_pab_id || 'unknown';
  (condsByRegion[key] = condsByRegion[key] || []).push(c);
});
const featuresByCond = {};
KB.condition_features.forEach(f => {
  (featuresByCond[f.condition_id] = featuresByCond[f.condition_id] || []).push(f);
});
const diffsByRegion = {};
KB.differentiators.forEach(d => {
  (diffsByRegion[d.region_id] = diffsByRegion[d.region_id] || []).push(d);
});
const rfByRegion = {};
KB.red_flags.forEach(rf => {
  (rfByRegion[rf.region_id] = rfByRegion[rf.region_id] || []).push(rf);
});
const checklistByRegion = {};
KB.subjective_checklist.forEach(sc => {
  (checklistByRegion[sc.region_id] = checklistByRegion[sc.region_id] || []).push(sc);
});

let currentTab = 'regions';
let currentView = null;
let searchTimeout = null;
let suppressPush = false;
let initializing = true;

function pushView() {
  if (suppressPush) return;
  if (initializing) { history.replaceState(currentView, ''); initializing = false; }
  else history.pushState(currentView, '');
}

function dispatchView(view) {
  if (view === 'dashboard' || !view) showDashboard();
  else if (view === 'tests') showTestList();
  else if (view === 'concepts') showConcepts();
  else if (view && view.type === 'region') showRegion(view.id);
  else if (view && view.type === 'condition') showCondition(view.id);
  else if (view && view.type === 'test') showTest(view.id);
  else if (view && view.type === 'concept') showConcept(view.id);
}

window.addEventListener('popstate', e => {
  suppressPush = true;
  dispatchView(e.state);
  suppressPush = false;
});

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  renderSidebar();
  if (tab === 'regions') showDashboard();
  else if (tab === 'tests') showTestList();
  else if (tab === 'concepts') showConcepts();
}

function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  if (currentTab === 'regions') {
    let html = '<div class="sidebar-item" onclick="showDashboard()" id="si-dashboard">Dashboard</div>';
    KB.regions.sort((a,b) => a.label.localeCompare(b.label)).forEach(r => {
      const condCount = (condsByRegion[r.pab_id] || []).length;
      html += `<div class="sidebar-item" id="si-r-${r.pab_id}" onclick="showRegion('${r.pab_id}')">${r.label} <span style="color:var(--text3);font-size:11px">(${condCount})</span></div>`;
    });
    list.innerHTML = html;
  } else if (currentTab === 'tests') {
    let html = '';
    const sorted = [...KB.tests].sort((a,b) => a.name.localeCompare(b.name));
    sorted.forEach(t => {
      html += `<div class="sidebar-item" id="si-t-${t.id}" onclick="showTest(${t.id})">${t.name}</div>`;
    });
    list.innerHTML = html;
  } else if (currentTab === 'concepts') {
    let html = '';
    KB.clinical_concepts.forEach(c => {
      html += `<div class="sidebar-item" id="si-c-${c.id}" onclick="showConcept(${c.id})">${c.name}</div>`;
    });
    list.innerHTML = html;
  }
}

function setActive(id) {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function showDashboard() {
  setActive('si-dashboard');
  currentView = 'dashboard';
  pushView();
  const totalClusters = KB.clusters.length;
  const tier1 = KB.clusters.filter(cl => cl.plr != null).length;
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="page-title">PhysioKB</div>
    <div class="page-sub">Clinical Knowledge Base — MSK, Neurological, Rheumatological, Vestibular</div>
    <div class="dash-grid">
      <div class="dash-tile" onclick="setTab('regions')">
        <div class="num">${KB.regions.length}</div>
        <div class="lbl">Body Regions</div>
      </div>
      <div class="dash-tile" onclick="setTab('regions')">
        <div class="num">${KB.conditions.length}</div>
        <div class="lbl">Conditions</div>
      </div>
      <div class="dash-tile" onclick="setTab('tests')">
        <div class="num">${KB.tests.length}</div>
        <div class="lbl">Clinical Tests</div>
        <div class="sub">${KB.tests.filter(t=>t.sn!=null).length} with Sn/Sp data</div>
      </div>
      <div class="dash-tile">
        <div class="num">${totalClusters}</div>
        <div class="lbl">CPR Clusters</div>
        <div class="sub">${tier1} Tier 1 (validated)</div>
      </div>
      <div class="dash-tile">
        <div class="num">${KB.condition_features.length}</div>
        <div class="lbl">Condition Features</div>
      </div>
      <div class="dash-tile">
        <div class="num">${KB.red_flags.length}</div>
        <div class="lbl">Red Flags</div>
      </div>
    </div>
    <div class="section-title">Regions</div>
    <div class="dash-grid">
      ${KB.regions.sort((a,b)=>a.label.localeCompare(b.label)).map(r => {
        const conds = condsByRegion[r.pab_id] || [];
        const cls = clustersByRegion[r.pab_id] || [];
        return `<div class="dash-tile" onclick="showRegion('${r.pab_id}')">
          <div class="sub" style="color:var(--accent);font-size:13px;font-weight:600">${r.label}</div>
          <div class="sub" style="margin-top:6px">${conds.length} conditions · ${cls.length} clusters</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function showRegion(pabId) {
  const region = regionByPabId[pabId];
  if (!region) return;
  setActive(`si-r-${pabId}`);
  currentView = {type:'region', id: pabId};
  pushView();
  const conds = condsByRegion[pabId] || [];
  const clusters = clustersByRegion[pabId] || [];
  const diffs = diffsByRegion[region.id] || [];
  const rfs = rfByRegion[region.id] || [];
  const checklist = checklistByRegion[region.id] || [];

  let html = `<div class="page-title">${region.label}</div>
    <div class="page-sub">${conds.length} conditions · ${clusters.length} CPR clusters · ${diffs.length} differentiators · ${rfs.length} red flags</div>`;

  // CPR Clusters
  if (clusters.length > 0) {
    html += `<div class="section-title">CPR Clusters</div>`;
    clusters.forEach(cl => {
      const tests = (testsByCluster[cl.id] || []);
      html += renderCluster(cl, tests);
    });
  }

  // Conditions
  if (conds.length > 0) {
    html += `<div class="section-title">Conditions</div>`;
    conds.forEach(c => {
      const features = featuresByCond[c.id] || [];
      const condClusters = clustersByCondition[c.id] || [];
      html += `<div class="card">
        <div class="card-title" style="cursor:pointer" onclick="showCondition(${c.id})">${c.name}</div>
        <div class="card-sub">${c.condition_category || ''} ${c.icd_concept ? '· ' + c.icd_concept : ''}</div>
        ${condClusters.length ? `<div style="margin-bottom:6px">${condClusters.map(cl=>`<span class="tag ${cl.cluster_type==='Diagnostic'?'tag-diag':'tag-pres'}">${cl.name}</span>`).join('')}</div>` : ''}
        ${c.context ? `<p>${c.context}</p>` : ''}
        <div style="margin-top:6px"><a onclick="showCondition(${c.id})" style="cursor:pointer;font-size:12px">View features & detail →</a></div>
      </div>`;
    });
  }

  // Red Flags
  if (rfs.length > 0) {
    html += `<div class="section-title">Red Flags</div><div class="card">
      <table class="rf-table"><thead><tr><th>Flag</th><th>Severity</th><th>Condition</th></tr></thead><tbody>`;
    rfs.forEach(rf => {
      const sev = rf.severity || '';
      const sevTag = sev === 'emergency' ? 'tag-emerg' : sev === 'urgent' ? 'tag-urg' : 'tag-red';
      html += `<tr><td>${rf.flag_text}</td><td><span class="tag ${sevTag}">${sev || 'flag'}</span></td><td style="color:var(--text3)">${rf.condition_name || '(general)'}</td></tr>`;
    });
    html += '</tbody></table></div>';
  }

  // Differentiators
  if (diffs.length > 0) {
    html += `<div class="section-title">Key Differentiators</div>`;
    diffs.forEach(d => {
      html += `<div class="diff-block">
        <div class="diff-conds">${d.condition_a} vs ${d.condition_b}</div>
        <div class="diff-text">${d.narrative.replace(/\n/g,'<br>')}</div>
        ${d.key_test ? `<div style="margin-top:6px;font-size:11px;color:var(--text3)">Key test: <span style="color:var(--accent)">${d.key_test}</span></div>` : ''}
      </div>`;
    });
  }

  // Subjective Checklist
  if (checklist.length > 0) {
    html += `<div class="section-title">Subjective Checklist</div><div class="card">`;
    const catOrder = ['red_flag_screen','neural_screen','pain_character','aggravating','easing','24hr_pattern','history','mechanism','directional_preference'];
    const byCat = {};
    checklist.forEach(sc => { (byCat[sc.category||'other'] = byCat[sc.category||'other']||[]).push(sc); });
    catOrder.concat(Object.keys(byCat).filter(k=>!catOrder.includes(k))).forEach(cat => {
      const items = byCat[cat];
      if (!items) return;
      html += `<div style="margin-bottom:10px"><div style="font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:4px">${cat.replace(/_/g,' ')}</div>`;
      items.sort((a,b)=>a.display_order-b.display_order).forEach(sc => {
        html += `<div class="cl-item">
          <div class="cl-question">${sc.question_text}</div>
          ${sc.positive_finding ? `<div class="cl-pos">✓ ${sc.positive_finding}</div>` : ''}
          ${sc.significance ? `<div class="cl-sig">${sc.significance}</div>` : ''}
        </div>`;
      });
      html += `</div>`;
    });
    html += '</div>';
  }

  document.getElementById('content').innerHTML = html;
}

function renderCluster(cl, tests) {
  const sn = cl.sn != null ? (cl.sn*100).toFixed(0)+'%' : '—';
  const sp = cl.sp != null ? (cl.sp*100).toFixed(0)+'%' : '—';
  const plr = cl.plr != null ? '+LR '+cl.plr.toFixed(2) : '—';
  const nlr = cl.nlr != null ? '−LR '+cl.nlr.toFixed(2) : '—';
  const typeTag = cl.cluster_type === 'Diagnostic' ? 'tag-diag' : 'tag-pres';
  const clickable = cl.condition_id != null;
  return `<div class="cluster-block">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
      <span class="cluster-title"${clickable ? ` style="cursor:pointer" onclick="showCondition(${cl.condition_id})" title="View ${cl.condition_name || 'condition'} →"` : ''}>${cl.name}</span>
      <span class="tag ${typeTag}">${cl.cluster_type}</span>
      ${clickable ? `<span style="font-size:11px;color:var(--text3);cursor:pointer" onclick="showCondition(${cl.condition_id})">${cl.condition_name || ''} →</span>` : ''}
    </div>
    ${cl.threshold ? `<div class="cluster-threshold">⊕ ${cl.threshold}</div>` : ''}
    <div class="cluster-stats">
      ${cl.plr!=null?`<div class="cluster-stat"><span class="label">+LR </span><span class="val">${cl.plr.toFixed(2)}</span>${cl.plr_ci?`<span class="ci"> ${cl.plr_ci}</span>`:''}</div>`:''}
      ${cl.nlr!=null?`<div class="cluster-stat"><span class="label">−LR </span><span class="val">${cl.nlr.toFixed(2)}</span>${cl.nlr_ci?`<span class="ci"> ${cl.nlr_ci}</span>`:''}</div>`:''}
      ${cl.sn!=null?`<div class="cluster-stat"><span class="label">Sn </span><span class="val">${sn}</span>${cl.sn_ci?`<span class="ci"> ${cl.sn_ci}</span>`:''}</div>`:''}
      ${cl.sp!=null?`<div class="cluster-stat"><span class="label">Sp </span><span class="val">${sp}</span>${cl.sp_ci?`<span class="ci"> ${cl.sp_ci}</span>`:''}</div>`:''}
    </div>
    ${cl.clinical_interpretation ? `<div style="font-size:11px;color:var(--text3);margin-bottom:8px;font-style:italic">${cl.clinical_interpretation}</div>` : ''}
    ${tests.length ? `<ul class="test-list">${tests.map(ct=>`<li onclick="showTest(${ct.test_id})">${ct.test_name}</li>`).join('')}</ul>` : ''}
    ${cl.reference ? `<div style="font-size:10px;color:var(--text3);margin-top:6px">Ref: ${cl.reference}</div>` : ''}
  </div>`;
}

function showCondition(id) {
  const c = condById[id];
  if (!c) return;
  currentView = {type:'condition', id};
  pushView();
  const features = featuresByCond[id] || [];
  const condClusters = clustersByCondition[id] || [];
  const region = regionByPabId[c.region_pab_id];
  let html = `<div style="font-size:12px;color:var(--text3);margin-bottom:6px;cursor:pointer" onclick="showRegion('${c.region_pab_id}')">← ${region ? region.label : ''}</div>
    <div class="page-title">${c.name}</div>
    <div class="page-sub">${c.condition_category || ''} ${c.icd_concept ? '· ' + c.icd_concept : ''}</div>`;
  if (c.context) html += `<div class="card"><p>${c.context}</p>${c.reference?`<div style="font-size:11px;color:var(--text3);margin-top:6px">Ref: ${c.reference}</div>`:''}</div>`;

  if (condClusters.length) {
    html += `<div class="section-title">CPR Clusters</div>`;
    condClusters.forEach(cl => {
      html += renderCluster(cl, testsByCluster[cl.id] || []);
    });
  }

  if (features.length) {
    html += `<div class="section-title">Clinical Features</div><div class="card">`;
    const domOrder = ['subjective','objective','history'];
    const byDom = {};
    features.forEach(f => { (byDom[f.feature_domain||'other'] = byDom[f.feature_domain||'other']||[]).push(f); });
    domOrder.concat(Object.keys(byDom).filter(k=>!domOrder.includes(k))).forEach(dom => {
      const items = byDom[dom];
      if (!items) return;
      html += `<div style="margin-bottom:10px"><div style="font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:4px">${dom}</div>
        <table class="feat-table"><tbody>`;
      items.forEach(f => {
        html += `<tr><td class="feat-name" style="width:40%">${f.feature_name}</td><td>${f.feature_value||''}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    });
    html += '</div>';
  }
  document.getElementById('content').innerHTML = html;
}

function showTest(id) {
  const t = testById[id];
  if (!t) return;
  setActive(`si-t-${id}`);
  currentView = {type:'test', id};
  pushView();
  const sn = t.sn != null ? (t.sn*100).toFixed(0)+'%' : '—';
  const sp = t.sp != null ? (t.sp*100).toFixed(0)+'%' : '—';
  const plr = t.plr != null ? '+LR '+t.plr.toFixed(2) : '—';
  const nlr = t.nlr != null ? '−LR '+t.nlr.toFixed(2) : '—';

  // Find clusters this test belongs to
  const memberClusters = KB.cluster_test.filter(ct => ct.test_id === id).map(ct => clusterById[ct.cluster_id]).filter(Boolean);
  const parentConditions = [];
  const seenCondIds = new Set();
  memberClusters.forEach(cl => {
    if (cl.condition_id != null && !seenCondIds.has(cl.condition_id)) {
      seenCondIds.add(cl.condition_id);
      parentConditions.push(cl);
    }
  });

  let html = '';
  if (parentConditions.length) {
    html += `<div style="font-size:12px;color:var(--text3);margin-bottom:6px">${parentConditions.map(cl =>
      `<span style="cursor:pointer" onclick="showCondition(${cl.condition_id})">← ${cl.condition_name || 'Condition'}</span>`
    ).join(' &nbsp;·&nbsp; ')}</div>`;
  }
  html += `<div class="page-title">${t.name}</div>`;
  if (t.also_known_as) html += `<div class="page-sub">Also known as: ${t.also_known_as}</div>`;
  html += `<div style="margin-bottom:10px">
    <span class="tag ${t.domain==='objective'?'tag-obj':t.domain==='subjective'?'tag-subj':'tag-cat'}">${t.domain||'objective'}</span>
    ${t.test_type?`<span class="tag tag-cat">${t.test_type}</span>`:''}
  </div>`;

  html += `<div class="stats">
    ${t.sn!=null?`<div class="stat"><span>Sn</span><strong>${sn}</strong>${t.sn_ci?` <span style="color:var(--text3);font-size:11px">${t.sn_ci}</span>`:''}</div>`:''}
    ${t.sp!=null?`<div class="stat"><span>Sp</span><strong>${sp}</strong>${t.sp_ci?` <span style="color:var(--text3);font-size:11px">${t.sp_ci}</span>`:''}</div>`:''}
    ${t.plr!=null?`<div class="stat"><span>+LR</span><strong>${t.plr.toFixed(2)}</strong>${t.plr_ci?` <span style="color:var(--text3);font-size:11px">${t.plr_ci}</span>`:''}</div>`:''}
    ${t.nlr!=null?`<div class="stat"><span>−LR</span><strong>${t.nlr.toFixed(2)}</strong>${t.nlr_ci?` <span style="color:var(--text3);font-size:11px">${t.nlr_ci}</span>`:''}</div>`:''}
    ${t.kappa!=null?`<div class="stat"><span>κ</span><strong>${t.kappa.toFixed(2)}</strong></div>`:''}
  </div>`;

  if (t.patient_position) html += `<div class="card"><h3>Patient Position</h3><p>${t.patient_position}</p></div>`;
  if (t.procedure) html += `<div class="test-proc"><strong>Procedure:</strong> ${t.procedure}</div>`;
  if (t.positive_finding) html += `<div class="card"><h3>Positive Finding</h3><p>${t.positive_finding}</p></div>`;
  if (t.clinical_notes) html += `<div class="card"><h3>Clinical Notes</h3><p>${t.clinical_notes}</p></div>`;
  if (t.pitfalls) {
    const pitfallText = t.pitfalls.split('|').map(p => p.trim()).filter(Boolean).join('<br>• ');
    html += `<div class="pitfall-block"><strong>⚠ Pitfalls</strong><br>• ${pitfallText}</div>`;
  }
  if (t.reference) html += `<div style="font-size:11px;color:var(--text3);margin-top:6px">Ref: ${t.reference}</div>`;

  if (memberClusters.length) {
    html += `<div class="section-title" style="margin-top:16px">Cluster Membership</div>`;
    memberClusters.forEach(cl => {
      html += renderCluster(cl, testsByCluster[cl.id] || []);
    });
  }

  document.getElementById('content').innerHTML = html;
}

function showTestList() {
  currentView = 'tests';
  pushView();
  const sorted = [...KB.tests].sort((a,b) => a.name.localeCompare(b.name));
  let html = `<div class="page-title">Clinical Tests</div>
    <div class="page-sub">${sorted.length} tests · ${sorted.filter(t=>t.sn!=null).length} with Sn/Sp data</div>`;
  sorted.forEach(t => {
    const sn = t.sn != null ? (t.sn*100).toFixed(0)+'%' : '';
    const sp = t.sp != null ? (t.sp*100).toFixed(0)+'%' : '';
    const plr = t.plr != null ? '+LR '+t.plr.toFixed(2) : '';
    html += `<div class="card" style="padding:10px 14px;cursor:pointer" onclick="showTest(${t.id})">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <span style="color:var(--text);font-size:13px">${t.name}</span>
          ${t.also_known_as?`<span style="color:var(--text3);font-size:11px;margin-left:8px">${t.also_known_as}</span>`:''}
        </div>
        <div style="display:flex;gap:12px;font-size:12px;color:var(--text2)">
          ${sn?`<span>Sn <strong style="color:var(--text)">${sn}</strong></span>`:''}
          ${sp?`<span>Sp <strong style="color:var(--text)">${sp}</strong></span>`:''}
          ${plr?`<span style="color:var(--green)">${plr}</span>`:''}
        </div>
      </div>
      <div style="margin-top:4px">
        <span class="tag ${t.domain==='objective'?'tag-obj':t.domain==='subjective'?'tag-subj':'tag-cat'}">${t.domain||'obj'}</span>
        ${t.test_type?`<span class="tag tag-cat" style="font-size:10px">${t.test_type}</span>`:''}
      </div>
    </div>`;
  });
  document.getElementById('content').innerHTML = html;
}

// ── Minimal markdown renderer for clinical_concept.content ──────────────────
// Covers exactly the constructs used in the source files: ## / ### / ####
// headers, --- style horizontal rules (incl. unicode box-drawing), pipe
// tables with a |---|---| separator row, **bold**, *italic*, - / * bullet
// lists, 1. numbered lists, and \<  \>  \| escape sequences.

function mdEscapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function mdInline(s) {
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/\\&lt;/g, '&lt;').replace(/\\&gt;/g, '&gt;').replace(/\\\|/g, '|');
  return s;
}

function mdSplitTableRow(row) {
  return row.slice(1, -1).split(/(?<!\\)\|/).map(cell => cell.trim());
}

function renderMarkdown(md) {
  if (!md) return '';
  const lines = mdEscapeHtml(md).split('\n');
  let html = '';
  let i = 0;
  const isHr = t => /^[─—-]{5,}$/.test(t) || /^\*{3,}$/.test(t);
  const isHeading = t => /^(#{1,6})\s+(.*)$/.test(t);
  const isTableRow = t => /^\|.*\|$/.test(t);
  const isUl = t => /^[-*]\s+/.test(t);
  const isOl = t => /^\d+\.\s+/.test(t);
  const isBlockStart = t => t === '' || isHr(t) || isHeading(t) || isTableRow(t) || isUl(t) || isOl(t);

  while (i < lines.length) {
    const trimmed = lines[i].trim();
    if (trimmed === '') { i++; continue; }

    if (isHr(trimmed)) { html += '<hr class="md-hr">'; i++; continue; }

    const hMatch = trimmed.match(/^(#{1,6})\s+(.*)$/);
    if (hMatch) {
      const level = Math.min(hMatch[1].length, 4);
      html += `<h${level} class="md-h${level}">${mdInline(hMatch[2])}</h${level}>`;
      i++; continue;
    }

    if (isTableRow(trimmed)) {
      const rows = [];
      while (i < lines.length && isTableRow(lines[i].trim())) { rows.push(lines[i].trim()); i++; }
      const dataRows = rows.filter(r => !/^\|[\s:|-]+\|$/.test(r));
      if (dataRows.length) {
        html += '<table class="md-table"><thead><tr>';
        mdSplitTableRow(dataRows[0]).forEach(cell => html += `<th>${mdInline(cell)}</th>`);
        html += '</tr></thead><tbody>';
        dataRows.slice(1).forEach(r => {
          html += '<tr>' + mdSplitTableRow(r).map(cell => `<td>${mdInline(cell)}</td>`).join('') + '</tr>';
        });
        html += '</tbody></table>';
      }
      continue;
    }

    if (isUl(trimmed) || isOl(trimmed)) {
      const ordered = isOl(trimmed);
      const marker = ordered ? /^\d+\.\s+/ : /^[-*]\s+/;
      const items = [];
      while (i < lines.length) {
        const t = lines[i].trim();
        if (marker.test(t)) { items.push(t.replace(marker, '')); i++; }
        else if (t === '') {
          let j = i + 1;
          while (j < lines.length && lines[j].trim() === '') j++;
          if (j < lines.length && marker.test(lines[j].trim())) { i = j; }
          else break;
        } else break;
      }
      const tag = ordered ? 'ol' : 'ul';
      html += `<${tag} class="md-${ordered ? 'ol' : 'ul'}">` + items.map(it => `<li>${mdInline(it)}</li>`).join('') + `</${tag}>`;
      continue;
    }

    // Paragraph: accumulate consecutive plain lines until the next block starts
    const para = [lines[i]];
    i++;
    while (i < lines.length && !isBlockStart(lines[i].trim())) { para.push(lines[i]); i++; }
    html += `<p class="md-p">${mdInline(para.join(' ').trim())}</p>`;
  }
  return html;
}

function mdPreview(md, len) {
  if (!md) return '';
  const s = md
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/\*\*?/g, '')
    .replace(/^[─—-]{3,}$/gm, '')
    .replace(/\|/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return s.substring(0, len) + (s.length > len ? '…' : '');
}

function showConcepts() {
  currentView = 'concepts';
  pushView();
  let html = `<div class="page-title">Clinical Concepts</div>
    <div class="page-sub">Cross-cutting clinical frameworks</div>`;
  KB.clinical_concepts.forEach(c => {
    html += `<div class="card" style="cursor:pointer" onclick="showConcept(${c.id})">
      <div class="card-title">${c.name}</div>
      <div class="card-sub">${c.category||''}</div>
      <div style="font-size:12px;color:var(--text2)">${mdPreview(c.content, 200)}</div>
    </div>`;
  });
  document.getElementById('content').innerHTML = html;
}

function showConcept(id) {
  const c = KB.clinical_concepts.find(x=>x.id===id);
  if (!c) return;
  setActive(`si-c-${id}`);
  currentView = {type:'concept', id};
  pushView();
  let html = `<div class="page-title">${c.name}</div>
    <div class="page-sub">${c.category||''}</div>
    <div class="card md-content">${renderMarkdown(c.content)}</div>`;
  document.getElementById('content').innerHTML = html;
}

function onSearch(query) {
  clearTimeout(searchTimeout);
  if (!query || query.length < 2) {
    // Restore previous view (not a new navigation — don't push a history entry)
    suppressPush = true;
    dispatchView(currentView);
    suppressPush = false;
    return;
  }
  searchTimeout = setTimeout(() => doSearch(query), 150);
}

function highlight(text, q) {
  if (!text) return '';
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).replace(re, '<mark>$1</mark>');
}

function doSearch(q) {
  const ql = q.toLowerCase();
  const results = [];

  KB.conditions.forEach(c => {
    const score = (c.name||'').toLowerCase().includes(ql) ? 3 :
      (c.icd_concept||'').toLowerCase().includes(ql) ? 2 :
      (c.context||'').toLowerCase().includes(ql) ? 1 : 0;
    if (score) results.push({type:'Condition', title:c.name, sub:c.icd_concept||c.condition_category||'', score, action:`showCondition(${c.id})`});
  });

  KB.tests.forEach(t => {
    const score = (t.name||'').toLowerCase().includes(ql) ? 3 :
      (t.also_known_as||'').toLowerCase().includes(ql) ? 3 :
      (t.procedure||'').toLowerCase().includes(ql) ? 2 :
      (t.clinical_notes||'').toLowerCase().includes(ql) ? 1 :
      (t.pitfalls||'').toLowerCase().includes(ql) ? 1 : 0;
    if (score) {
      const sn = t.sn!=null?(t.sn*100).toFixed(0)+'% Sn':'';
      const sp = t.sp!=null?(t.sp*100).toFixed(0)+'% Sp':'';
      results.push({type:'Test', title:t.name, sub:[sn,sp].filter(Boolean).join(' · ')||t.test_type||'', score, action:`showTest(${t.id})`});
    }
  });

  KB.clusters.forEach(cl => {
    const score = (cl.name||'').toLowerCase().includes(ql) ? 3 :
      (cl.clinical_interpretation||'').toLowerCase().includes(ql) ? 1 : 0;
    if (score) results.push({type:'Cluster', title:cl.name, sub:cl.condition_name+(cl.plr?` · +LR ${cl.plr.toFixed(2)}`:''), score, action:`showRegion('${cl.pab_region_id}')`});
  });

  KB.regions.forEach(r => {
    if ((r.label||'').toLowerCase().includes(ql)) {
      results.push({type:'Region', title:r.label, sub:'', score:3, action:`showRegion('${r.pab_id}')`});
    }
  });

  KB.condition_features.forEach(f => {
    const score = (f.feature_name||'').toLowerCase().includes(ql) ? 2 :
      (f.feature_value||'').toLowerCase().includes(ql) ? 1 : 0;
    if (score) results.push({type:'Feature', title:f.feature_name+': '+f.feature_value, sub:f.condition_name||'', score, action:`showCondition(${f.condition_id})`});
  });

  results.sort((a,b) => b.score - a.score);
  const top = results.slice(0, 40);

  let html = `<div class="page-title">Search: "${q}"</div>
    <div class="page-sub">${results.length} results</div>`;
  if (top.length === 0) {
    html += `<div class="card"><p style="color:var(--text3)">No results found.</p></div>`;
  } else {
    top.forEach(r => {
      html += `<div class="search-result" onclick="${r.action}">
        <div class="r-type">${r.type}</div>
        <div class="r-title">${highlight(r.title, q)}</div>
        ${r.sub?`<div class="r-sub">${highlight(r.sub, q)}</div>`:''}
      </div>`;
    });
  }
  document.getElementById('content').innerHTML = html;
}

// Init
renderSidebar();
showDashboard();

// Keyboard shortcut: / to focus search
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== document.getElementById('search-input')) {
    e.preventDefault();
    document.getElementById('search-input').focus();
  }
  if (e.key === 'Escape') {
    document.getElementById('search-input').value = '';
    onSearch('');
    document.getElementById('search-input').blur();
  }
});
</script>
