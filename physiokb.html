ive", "patient_position": "Sitting or standing; both arms raised in 90 deg abduction and external rotation, elbows flexed 90 deg (surrender position)", "procedure": "Patient opens and closes hands (making fist then releasing) for 3 minutes. Record time to symptom onset.", "positive_finding": "Inability to maintain arm position for 3 minutes, or reproduction of upper extremity symptoms (pain, heaviness, paresthesia, weakness) before 3 minutes", "sn": 0.84, "sn_ci": "(range 0.52-0.84)", "sp": 0.3, "sp_ci": "(range 0.30-1.0)", "plr": 5.2, "plr_ci": "(range 1.2-5.2)", "nlr": 0.53, "nlr_ci": "(range 0.4-0.53)", "kappa": null, "reference": "Gillard et al. 2001; Physiopedia Roos Stress Test page", "clinical_notes": "High sensitivity (best at 84%), low specificity. Useful to RULE OUT when negative. Positive result increases suspicion but cannot confirm alone due to many false positives.", "pitfalls": null, "kb_panel_show": 1}, {"id": 49, "name": "Adson's Test", "also_known_as": "Adson Maneuver", "test_type": "Vascular Provocation", "domain": "objective", "patient_position": "Sitting or standing; arm abducted 30 deg, maximally extended, elbow extended", "procedure": "Radial pulse palpated; patient extends neck, turns head TOWARD symptomatic shoulder, takes deep breath and holds. Assess radial pulse quality.", "positive_finding": "Marked decrease or disappearance of radial pulse (+/- symptom reproduction)", "sn": 0.79, "sn_ci": null, "sp": 0.74, "sp_ci": "(range 0.74-1.0)", "plr": 3.29, "plr_ci": null, "nlr": 0.28, "nlr_ci": null, "kappa": null, "reference": "Gillard et al. 2001; Physiopedia Adsons Test; meta-analysis 2025", "clinical_notes": "Sn 79%, Sp 74-100%. +LR 3.29. Primarily tests vascular (subclavian artery) compression. High false positive rate in healthy subjects and CTS overlap.", "pitfalls": null, "kb_panel_show": 1}, {"id": 50, "name": "Wright's Test", "also_known_as": "Hyperabduction Test", "test_type": "Vascular/Neurological Provocation", "domain": "objective", "patient_position": "Sitting or standing", "procedure": "Arm passively moved to full hyperabduction (above head). Radial pulse assessed +/- symptoms monitored.", "positive_finding": "Pulse diminishment, disappearance, or reproduction of upper extremity symptoms", "sn": 0.9, "sn_ci": "(range 0.70-0.90)", "sp": 0.29, "sp_ci": "(range 0.29-0.53)", "plr": 1.27, "plr_ci": "(range 1.27-1.49)", "nlr": 0.34, "nlr_ci": "(range 0.34-0.57)", "kappa": null, "reference": "Gillard et al. 2001; Physiopedia TOS page", "clinical_notes": "High sensitivity (70-90%) but very low specificity (29-53%). Frequently positive in asymptomatic subjects.", "pitfalls": null, "kb_panel_show": 1}, {"id": 51, "name": "Cervical Rotation Lateral Flexion (CRLF) Test", "also_known_as": null, "test_type": "Provocation", "domain": "objective", "patient_position": "Sitting; fully rotate head away from test side", "procedure": "While maintaining full contralateral rotation, examiner passively and gently laterally flexes cervical spine toward chest", "positive_finding": "Restriction of lateral flexion (positive); compared to contralateral side", "sn": 1.0, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": 0.97, "reference": "Physiopedia Roos Stress Test table; Gillard 2001", "clinical_notes": "Sensitivity reported as 100% in Gillard 2001. Tests first rib mobility restriction. High sensitivity makes negative test useful to rule out cervical rib/first rib component of TOS.", "pitfalls": null, "kb_panel_show": 1}, {"id": 52, "name": "Dix-Hallpike Test", "also_known_as": null, "test_type": "Vestibular Provocation", "domain": "objective", "patient_position": "Sitting upright on examination table", "procedure": "Turn patients head 45 deg toward test side. Rapidly move patient from sitting to supine with head hanging 20-30 deg below horizontal off table edge. Hold position 30-60 seconds while observing eyes.", "positive_finding": "(A) Upbeat torsional nystagmus toward the tested/affected ear; (B) latency of 2-5 sec to onset; (C) duration < 60 sec; (D) fatigues with repeated testing; (E) nystagmus reverses on return to sitting", "sn": 0.79, "sn_ci": "(range 0.79-0.93)", "sp": 0.75, "sp_ci": "(range 0.75-0.87)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia BPPV; Wikipedia Dix-Hallpike; Cohen 2004; Vestibular First", "clinical_notes": "Sn 79-93% range (recent studies report higher 82-93%). Gold standard for posterior canal BPPV. Test may need repeating (not always positive first attempt). MUST observe nystagmus pattern for interpretation.", "pitfalls": null, "kb_panel_show": 1}, {"id": 53, "name": "Supine Roll Test (BBQ Roll Test)", "also_known_as": "Supine Log Roll Test", "test_type": "Vestibular Provocation", "domain": "objective", "patient_position": "Supine; head in neutral", "procedure": "From supine, rapidly turn head 90 deg to each side while remaining supine. Observe for nystagmus in each position.", "positive_finding": "Horizontal (geotropic or ageotropic) nystagmus provoked with head turning to one side", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia BPPV; Lempert 1995", "clinical_notes": "Used for horizontal canal BPPV. Geotropic nystagmus (toward ground) in canalithiasis; ageotropic (away from ground) in cupulolithiasis. Determines affected canal and variant.", "pitfalls": null, "kb_panel_show": 1}, {"id": 54, "name": "Head Impulse Test (HIT)", "also_known_as": "Video Head Impulse Test (vHIT)", "test_type": "Vestibular Oculomotor", "domain": "objective", "patient_position": "Sitting; patient fixates on examiner nose", "procedure": "Examiner holds patients head and delivers small, rapid, unpredictable horizontal head thrusts of 10-20 deg. Observe eyes for corrective saccades.", "positive_finding": "ABNORMAL (catch-up) saccade visible after head thrust toward affected side = peripheral vestibular pathology (reassuring). NORMAL HIT = concern for central cause.", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Halmagyi & Curthoys 1988; Kattah 2009 HINTS study", "clinical_notes": "Part of HINTS exam. NORMAL HIT in patient with acute spontaneous vertigo is RED FLAG for central (stroke) cause. Abnormal HIT = peripheral disease. Counterintuitive: abnormal = reassuring.", "pitfalls": null, "kb_panel_show": 1}, {"id": 55, "name": "Nystagmus Direction Assessment (HINTS component)", "also_known_as": "Direction of Nystagmus", "test_type": "Vestibular Oculomotor", "domain": "objective", "patient_position": "Sitting; patient fixates in primary gaze then in lateral gaze", "procedure": "Observe for spontaneous nystagmus in primary gaze and with lateral gaze (right and left). Note direction and whether it changes.", "positive_finding": "Direction-CHANGING nystagmus (horizontal nystagmus changes direction with gaze) = central cause. Unidirectional nystagmus = peripheral (reassuring)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Kattah 2009 HINTS; Physiopedia vestibular assessment", "clinical_notes": "Part of HINTS exam. Direction-changing nystagmus strongly suggests central pathology. Unidirectional horizontal nystagmus = peripheral (benign sign).", "pitfalls": null, "kb_panel_show": 1}, {"id": 56, "name": "Test of Skew (HINTS component)", "also_known_as": "Vertical Ocular Deviation", "test_type": "Vestibular Oculomotor", "domain": "objective", "patient_position": "Sitting; patient fixates on examiner face", "procedure": "Alternate cover test: cover one eye then other and observe for vertical corrective movement (skew deviation)", "positive_finding": "Vertical refixation movement (skew deviation) when cover alternated = central cause. No skew = peripheral (reassuring)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Kattah 2009 HINTS; Physiopedia", "clinical_notes": "Part of HINTS exam. Skew deviation suggests brainstem/central pathology. Combined HINTS: Sn 100%, Sp 90-96% for posterior fossa stroke.", "pitfalls": null, "kb_panel_show": 1}, {"id": 57, "name": "Squeeze Test (MCP Joints)", "also_known_as": "Gaenslen Squeeze Test / MCP Compression", "test_type": "Palpation/Provocation", "domain": "objective", "patient_position": "Sitting; hand relaxed on surface", "procedure": "Examiner gently compresses all MCP joints simultaneously with thumb and fingers (lateral compression across the row of MCPs)", "positive_finding": "Pain on compression of MCP joints", "sn": 0.53, "sn_ci": "(van den Bosch 2015 ARD)", "sp": 0.82, "sp_ci": "(van den Bosch 2015 ARD)", "plr": 3.0, "plr_ci": null, "nlr": 0.6, "nlr_ci": null, "kappa": null, "reference": "van den Bosch et al. 2015 Ann Rheum Dis; Physiopedia Squeeze Test", "clinical_notes": "Sn 53%, Sp 82%, +LR 3.0. When positive, associated with joint inflammation. Sensitivity too low to use alone. High false negative rate - many inflamed MCPs miss squeeze test.", "pitfalls": null, "kb_panel_show": 1}, {"id": 58, "name": "Squeeze Test (MTP Joints)", "also_known_as": "Forefoot Squeeze Test", "test_type": "Palpation/Provocation", "domain": "objective", "patient_position": "Sitting; foot relaxed", "procedure": "Examiner compresses all MTP joints simultaneously (lateral compression across the forefoot)", "positive_finding": "Pain on compression of MTP joints", "sn": 0.54, "sn_ci": "(van den Bosch 2015 ARD)", "sp": 0.74, "sp_ci": "(van den Bosch 2015 ARD)", "plr": 2.1, "plr_ci": null, "nlr": 0.6, "nlr_ci": null, "kappa": null, "reference": "van den Bosch et al. 2015 ARD", "clinical_notes": "Sn 54%, Sp 74%, +LR 2.1. Early RA frequently affects MTP joints before MCPs. Foot squeeze test useful to add in early arthritis workup.", "pitfalls": null, "kb_panel_show": 1}, {"id": 59, "name": "Morning Stiffness Duration", "also_known_as": null, "test_type": "History", "domain": "subjective", "patient_position": "N/A - patient reported", "procedure": "Ask: How long does joint stiffness last in the morning before it improves?", "positive_finding": "Morning stiffness lasting > 30-60 minutes (classically > 1 hour) in and around multiple joints", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "1987 ACR Criteria; 2010 ACR/EULAR Criteria; Physiopedia RA", "clinical_notes": "Morning stiffness > 60 min is 1987 ACR criterion. Duration reflects degree of synovitis. OA morning stiffness typically < 30 min. Crucial discriminating history item.", "pitfalls": null, "kb_panel_show": 1}, {"id": 60, "name": "Symmetrical Small Joint Swelling", "also_known_as": null, "test_type": "Observation/Palpation", "domain": "objective", "patient_position": "Sitting; both hands examined", "procedure": "Observe and palpate PIP, MCP joints and wrists bilaterally. Note synovial thickening vs bony swelling.", "positive_finding": "Soft tissue (synovial) swelling affecting 3+ joint areas symmetrically (bilateral MCPs, PIPs, wrists, MTPs)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia RA; 2010 ACR/EULAR Criteria", "clinical_notes": "Synovial swelling (soft, warm, boggy) vs OA (bony, hard, cool). Symmetrical distribution strongly favors RA. Bony swelling in OA; soft swelling = synovitis in RA.", "pitfalls": null, "kb_panel_show": 1}, {"id": 61, "name": "Anterior Drawer Test (Ankle)", "also_known_as": "Anterior Drawer of Ankle", "test_type": "Stability/Translation", "domain": "objective", "patient_position": "Supine; ankle in 20 deg plantarflexion", "procedure": "Examiner stabilises distal tibia/fibula; draws calcaneus anteriorly. Observe anterior translation and change in end feel vs contralateral.", "positive_finding": "Anterior translation > 1 cm vs contralateral side OR weakening of end feel (hard ligamentous to soft elastic)", "sn": 0.86, "sn_ci": "(arthrogram comparison 160 pts)", "sp": 0.74, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Anterior Drawer Ankle; Croy et al.", "clinical_notes": "Sn 86%, Sp 74% vs arthrogram. Tests ATFL integrity. More accurate > 5 days post-injury. Range 32-80% sensitivity across studies.", "pitfalls": null, "kb_panel_show": 1}, {"id": 62, "name": "Talar Tilt Test", "also_known_as": null, "test_type": "Stability/Translation", "domain": "objective", "patient_position": "Sidelying; knee flexed; ankle neutral", "procedure": "Inversion stress: calcaneus tilted into inversion (tests CFL and ATFL). Eversion stress: calcaneus into eversion (tests deltoid ligament). Compare to contralateral.", "positive_finding": "Excessive tilting/gapping vs contralateral side OR reproduction of pain", "sn": 0.67, "sn_ci": null, "sp": 0.75, "sp_ci": null, "plr": 2.7, "plr_ci": null, "nlr": 0.44, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Talar Tilt; Cook & Hegedus 2007", "clinical_notes": "Sn 67%, Sp 75%, +LR 2.7, -LR 0.44. Tests CFL (inversion) or deltoid (eversion). Not sufficient alone but complements anterior drawer. More accurate > 5 days.", "pitfalls": null, "kb_panel_show": 1}, {"id": 63, "name": "Ottawa Ankle Rules", "also_known_as": null, "test_type": "Decision Rule", "domain": "subjective", "patient_position": "Standing / Weight-bearing assessment", "procedure": "Assess: (1) bone tenderness at posterior tip/inferior 6cm of medial or lateral malleolus; (2) bone tenderness at base of 5th metatarsal; (3) bone tenderness at navicular; (4) inability to weight-bear 4 steps immediately and at assessment", "positive_finding": "Any of above positive = X-ray indicated", "sn": 1.0, "sn_ci": "(~100% sensitivity for significant fractures)", "sp": 0.4, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Stiell et al. 1994 Lancet; BMC 2022 systematic review", "clinical_notes": "Near 100% sensitivity. Specificity ~40% (reduces but does not eliminate X-rays). ALL negative = safe to rule out fracture. High sensitivity is essential for a rule-out test.", "pitfalls": "- Sensitivity is excellent (94\u201395%) but specificity is poor (37\u201357%) \u2014 high false positive rate | **Pitfall:** Ottawa rules tell you when to image, not when a fracture is present; positive = image, not \"fracture confirmed\" \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 ## Neural/Sensory Tests", "kb_panel_show": 1}, {"id": 64, "name": "Self-reported squatting as aggravating factor", "also_known_as": null, "test_type": "History / Patient-reported", "domain": "subjective", "patient_position": "N/A - patient reported", "procedure": "Ask patient: Does squatting aggravate your hip symptoms?", "positive_finding": "Patient reports squatting provokes or worsens their hip pain", "sn": 0.76, "sn_ci": "(0.52-0.91)", "sp": 0.57, "sp_ci": "(0.42-0.70)", "plr": 1.8, "plr_ci": "(1.2-2.6)", "nlr": 0.42, "nlr_ci": "(0.19-0.93)", "kappa": null, "reference": "Sutlive et al. 2008 JOSPT", "clinical_notes": "Highest sensitivity (0.76) of the 5 items. Useful for screening. Squatting compresses the hip joint and reproduces OA-related pain.", "pitfalls": null, "kb_panel_show": 1}, {"id": 65, "name": "Scour Test (Hip Quadrant Test)", "also_known_as": "Hip Quadrant / Scouring Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Supine; hip and knee flexed to 90 deg", "procedure": "Examiner applies axial compression through femur (body weight) then moves hip through flexion, adduction, IR, then abduction and ER in an arc (scouring motion). Apply compression throughout.", "positive_finding": "Reproduction of familiar groin or hip pain during the scouring arc", "sn": 0.52, "sn_ci": "(0.08-0.96)", "sp": 0.86, "sp_ci": "(0.72-0.94)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Sutlive et al. 2008 JOSPT", "clinical_notes": "Good specificity (0.86). Tests for intra-articular hip pathology including OA, labral tears, and osteochondral defects.", "pitfalls": null, "kb_panel_show": 1}, {"id": 66, "name": "Active Hip Flexion Causing Lateral Hip Pain", "also_known_as": null, "test_type": "Provocation / Range of Motion", "domain": "objective", "patient_position": "Standing", "procedure": "Patient actively flexes hip (marching in place or lifting knee). Examiner observes and asks about pain location.", "positive_finding": "Active hip flexion reproduces LATERAL hip pain", "sn": 0.52, "sn_ci": "(0.09-0.96)", "sp": 0.86, "sp_ci": "(0.72-0.94)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Sutlive et al. 2008 JOSPT", "clinical_notes": "Lateral hip pain with active flexion suggests periarticular or OA involvement. Good specificity.", "pitfalls": null, "kb_panel_show": 1}, {"id": 67, "name": "FABER Test (Patrick Test)", "also_known_as": null, "test_type": "Provocation", "domain": "objective", "patient_position": "Supine; test leg in figure-4 position (hip flexed, abducted, ER; ankle proximal to contralateral knee)", "procedure": "Examiner stabilises contralateral ASIS and applies gentle downward overpressure to ipsilateral knee", "positive_finding": "Reproduction of familiar hip or groin pain on tested side OR restricted range vs contralateral", "sn": 0.47, "sn_ci": "(0.12-0.81)", "sp": 0.76, "sp_ci": "(0.62-0.87)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": 0.63, "reference": "Sutlive et al. 2008; Martin 2008 JOSPT", "clinical_notes": "Included in Sutlive cluster with moderate sensitivity. Also tests SIJ. Lower sensitivity in OA-specific context vs FAI.", "pitfalls": "- Sensitive for intra-articular pathology but also positive in SIJ dysfunction, hip flexor tightness, and adductor pathology | **Pitfall:** Always consider which structure is being stressed \u2014 anterior groin pain = hip joint; posterior pain = SIJ; medial = adductor \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 ## Knee", "kb_panel_show": 1}, {"id": 68, "name": "Passive Hip IR < 25 Degrees (or 15 deg asymmetry)", "also_known_as": "Restricted passive internal rotation", "test_type": "Range of Motion", "domain": "objective", "patient_position": "Supine; hip and knee at 90 deg, or prone with knee flexed 90 deg", "procedure": "Examiner passively internally rotates hip from 90 deg flexion position. Measure with goniometer.", "positive_finding": "Passive hip internal rotation < 25 deg, OR > 15 deg restriction compared to contralateral side", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Sutlive et al. 2008; NICE guidance hip OA", "clinical_notes": "Restricted hip IR is one of the most reliable clinical signs of hip OA. Included in Sutlive cluster and NICE OA diagnostic criteria.", "pitfalls": null, "kb_panel_show": 1}, {"id": 69, "name": "Symptom Duration < 16 Days", "also_known_as": null, "test_type": "History / Demographics", "domain": "subjective", "patient_position": "N/A - patient reported", "procedure": "Ask: When did your back pain begin? Calculate days since onset.", "positive_finding": "Symptoms present for less than 16 days (acute presentation)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Flynn et al. 2002; ScienceDirect CPR review", "clinical_notes": "Most powerful single predictor in the CPR. Acute LBP is more likely to respond to manipulation. Chronic LBP has much lower response rate.", "pitfalls": null, "kb_panel_show": 1}, {"id": 70, "name": "No Symptoms Distal to the Knee", "also_known_as": null, "test_type": "History / Symptom Distribution", "domain": "subjective", "patient_position": "N/A - patient reported", "procedure": "Ask: Does your pain travel below the knee? Record symptom distribution on body chart.", "positive_finding": "All symptoms remain proximal to the knee (no distal radiation)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Flynn et al. 2002", "clinical_notes": "Absence of distal radiation suggests non-radicular mechanical LBP more likely to respond to manipulation.", "pitfalls": null, "kb_panel_show": 1}, {"id": 71, "name": "FABQ Work Subscale Score < 19", "also_known_as": null, "test_type": "Outcome Measure / Psychology", "domain": "subjective", "patient_position": "N/A - patient self-report", "procedure": "Administer Fear-Avoidance Beliefs Questionnaire (FABQ). Calculate work subscale score (items 6-10).", "positive_finding": "FABQ Work subscale score less than 19 (low fear-avoidance)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Flynn et al. 2002; FABQ Waddell 1993", "clinical_notes": "Low fear-avoidance beliefs predict positive response to manipulation. Higher fear-avoidance associated with poorer outcomes.", "pitfalls": null, "kb_panel_show": 1}, {"id": 72, "name": "At Least One Hip with > 35 Degrees Passive IR", "also_known_as": "Hip internal rotation hypermobility", "test_type": "Range of Motion", "domain": "objective", "patient_position": "Supine; hip and knee at 90 deg flexion or prone with knee flexed 90 deg", "procedure": "Measure passive hip internal rotation with goniometer on both hips. Record both sides.", "positive_finding": "At least one hip demonstrating passive IR greater than 35 degrees", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Flynn et al. 2002", "clinical_notes": "Hip IR > 35 deg suggests sufficient hip mobility to allow lumbopelvic manipulation. Restricted hip IR is associated with compensatory lumbar hypermobility.", "pitfalls": null, "kb_panel_show": 1}, {"id": 73, "name": "Lumbar Hypomobility on PA Spring Testing", "also_known_as": null, "test_type": "Mobility Assessment", "domain": "objective", "patient_position": "Prone", "procedure": "Examiner applies posteroanterior (PA) springing pressure to each lumbar spinous process and assesses mobility and pain.", "positive_finding": "Hypomobility (stiffness) AND pain at one or more lumbar levels with PA spring testing", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Flynn et al. 2002", "clinical_notes": "Lumbar segmental hypomobility with associated pain suggests a joint restriction that may respond to manipulation.", "pitfalls": null, "kb_panel_show": 1}, {"id": 74, "name": "Slump Test", "also_known_as": "Slump Neurodynamic Test", "test_type": "Neurodynamic", "domain": "objective", "patient_position": "Seated; upright at edge of table", "procedure": "(1) Patient slumps trunk (thoracolumbar flexion). (2) Examiner maintains trunk flexion. (3) Patient extends knee. (4) Patient dorsiflexes ankle. (5) Patient flexes neck. Each step recorded for symptom change. Sensitised by releasing neck flexion.", "positive_finding": "Reproduction of familiar leg symptoms (radicular pain/paresthesia) that is REDUCED by releasing cervical flexion", "sn": 0.84, "sn_ci": "(Majlesi 2008)", "sp": 0.83, "sp_ci": "(Majlesi 2008)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Majlesi et al. 2008 J Clin Rheumatol; Archives PMR 2017", "clinical_notes": "Most sensitive test for lumbar disc herniation (Sn 0.84). Positive test = reproduction of leg symptoms that eases with neck extension. Negative Slump has good negative predictive value.", "pitfalls": "- Very sensitive for neural mechanosensitivity but not specific to a structural cause \u2014 positive in athletes with hamstring tightness, in nociplastic presentations, and in people with adverse neural tension unrelated to disc pathology | **Pitfall:** A positive slump does not equal disc herniation \u2014 it confirms neural sensitivity only \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 ## SIJ Tests", "kb_panel_show": 1}, {"id": 75, "name": "Straight Leg Raise (SLR)", "also_known_as": "Las\u00e8gue Sign / Passive SLR", "test_type": "Neurodynamic", "domain": "objective", "patient_position": "Supine; knee extended", "procedure": "Examiner slowly raises leg passively with knee fully extended. Record angle at first symptom onset and at symptom limitation.", "positive_finding": "Reproduction of familiar leg pain/paresthesia below the knee at < 70 degrees of hip flexion", "sn": 0.92, "sn_ci": "(pooled; range 0.72-0.97)", "sp": 0.28, "sp_ci": "(pooled; range 0.10-0.61)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Devill\u00e9 et al. 2000 meta-analysis; systematic reviews", "clinical_notes": "Very high sensitivity (0.92) but low specificity (0.28). Negative SLR effectively rules out disc herniation with nerve root compression. Positive SLR alone has many false positives.", "pitfalls": "- Back pain on SLR is not a positive test \u2014 only dermatomal leg pain below the knee is a true positive | Hamstring tightness must be differentiated from posterior thigh tension \u2014 tight hamstrings cause posterior thigh pull at low angles, mimicking neural tension | SLR is unreliable at higher lumbar levels (L1\u2013L3) \u2014 poor sensitivity for stenosis | **Pitfall:** Pain only in the posterior thigh without distal radiation = often hamstring, not radiculopathy", "kb_panel_show": 1}, {"id": 76, "name": "Crossed SLR (Crossed Las\u00e8gue)", "also_known_as": "Contralateral SLR", "test_type": "Neurodynamic", "domain": "objective", "patient_position": "Supine; knee extended", "procedure": "Examiner raises CONTRALATERAL (asymptomatic) leg passively. Record if symptoms are reproduced in symptomatic leg.", "positive_finding": "Reproduction of familiar leg symptoms in the symptomatic leg when the CONTRALATERAL leg is raised", "sn": 0.28, "sn_ci": "(range 0.23-0.43)", "sp": 0.9, "sp_ci": "(range 0.85-0.97)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Devill\u00e9 et al. 2000 meta-analysis", "clinical_notes": "Very high specificity (0.90) but low sensitivity (0.28). When positive = strongly suggests large disc herniation. Most specific neurodynamic test for herniation.", "pitfalls": null, "kb_panel_show": 1}, {"id": 77, "name": "Neurological Deficit Screening (Myotomes/Reflexes/Dermtaomes)", "also_known_as": "Neurological examination", "test_type": "Neurological", "domain": "objective", "patient_position": "Seated or supine", "procedure": "Test L4 (knee extension, patellar reflex, medial leg sensation), L5 (great toe extension, lateral leg sensation), S1 (plantarflexion, Achilles reflex, lateral foot sensation).", "positive_finding": "Reflex diminution/absence, motor weakness, or sensory deficit in a dermatomal/myotomal distribution corresponding to a specific nerve root level", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Standard neurology; Archives PMR 2017", "clinical_notes": "Radiculopathy II (2+ neurological signs corresponding to one nerve root) has best combined Sn/Sp in systematic review. Neurological findings confirm radiculopathy diagnosis.", "pitfalls": null, "kb_panel_show": 1}, {"id": 78, "name": "Patellar Tilt Test", "also_known_as": null, "test_type": "Mobility Assessment", "domain": "objective", "patient_position": "Supine; knee extended", "procedure": "Examiner attempts to lift lateral patella edge superiorly while depressing medial edge. Normal = lateral edge can be lifted to at least horizontal (0 deg or above). Positive = lateral edge cannot be raised to horizontal.", "positive_finding": "Lateral patellar tilt: inability to elevate lateral patellar edge to horizontal position (suggests tight lateral retinaculum)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": 5.3, "plr_ci": "(Cook et al. 2012)", "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Cook et al. 2012; StatPearls PFPS; morphopedics", "clinical_notes": "Best +LR (5.3) of individual PFPS tests. Indicates tight lateral retinaculum contributing to abnormal patellar tracking. Positive tilt = reasonable rule-in for PFPS.", "pitfalls": null, "kb_panel_show": 1}, {"id": 79, "name": "Clarke's Test (Patellar Grind Test)", "also_known_as": "Patellar Grind / Zohlen Sign", "test_type": "Provocation", "domain": "objective", "patient_position": "Supine; knee fully extended", "procedure": "Examiner places web space of hand just superior to patella and applies firm pressure, then asks patient to gently contract quadriceps (tense thigh). Repeat with knee at 30 deg flexion.", "positive_finding": "Pain in patellofemoral joint with quadriceps contraction against compression", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Patellar Grind Test; Clarke 1981", "clinical_notes": "Poor specificity - many asymptomatic patients test positive. Should NOT be used as sole diagnostic criterion. Use in conjunction with other tests and history.", "pitfalls": null, "kb_panel_show": 1}, {"id": 80, "name": "Patellar Apprehension Test", "also_known_as": "Lateral Patellar Apprehension", "test_type": "Provocation", "domain": "objective", "patient_position": "Supine; knee flexed 20-30 deg", "procedure": "Examiner applies gentle lateral force to patella while gradually flexing knee. Watch for apprehension.", "positive_finding": "Patient shows apprehension (guards) or resists lateral patellar displacement, or reports sensation of impending dislocation", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": 2.26, "plr_ci": "(morphopedics review)", "nlr": 0.79, "nlr_ci": null, "kappa": null, "reference": "Morphopedics PFPS review; Cook et al. 2012", "clinical_notes": "Positive LR 2.26 - modest rule-in. Best for testing lateral patellar instability component of PFPS. Apprehension (not pain) is the true positive response.", "pitfalls": null, "kb_panel_show": 1}, {"id": 81, "name": "Symptom History: Anterior Knee Pain with Activity", "also_known_as": null, "test_type": "History / Provocation", "domain": "objective", "patient_position": "N/A - patient reported", "procedure": "Ask: Is your knee pain located at the front of the knee? Is it worse with squatting, stairs, running, prolonged sitting, or kneeling?", "positive_finding": "Anterior or peripatellar knee pain that is worse with loading the flexed knee (squatting, stairs, running, sitting > 20 min)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "PFPS diagnostic criteria; StatPearls", "clinical_notes": "Most reliable diagnostic feature. History of anterior knee pain aggravated by flexion-loading activities is the cornerstone of PFPS diagnosis.", "pitfalls": null, "kb_panel_show": 1}, {"id": 82, "name": "J-Sign (Patellar Maltracking)", "also_known_as": null, "test_type": "Observation", "domain": "objective", "patient_position": "Standing or seated", "procedure": "Observe patella movement during active knee extension from flexion. Patella should move in smooth straight line.", "positive_finding": "Lateral deviation or jump of patella toward end range extension (J-shaped path) indicating lateral patellar maltracking", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Patellofemoral Joint; PFPS review", "clinical_notes": "Positive J-sign = dynamic patellar maltracking. Difficult to assess reliably. Clinical significance varies. Suggests VMO weakness or tight lateral retinaculum.", "pitfalls": null, "kb_panel_show": 1}, {"id": 83, "name": "Anterior Apprehension Test (Crank Test for Instability)", "also_known_as": "Shoulder Apprehension / Fulcrum Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Supine; shoulder abducted 90 deg, elbow 90 deg", "procedure": "Examiner supports elbow and gradually externally rotates shoulder. Can apply gentle anterior force to humeral head.", "positive_finding": "Patient shows APPREHENSION (not just pain) or reports sensation of impending dislocation at end-range ER", "sn": 0.72, "sn_ci": "(Tzannes & Murrell)", "sp": 0.96, "sp_ci": "(Tzannes & Murrell)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Shoulder Instability; Tzannes & Murrell 2004", "clinical_notes": "Key distinction: APPREHENSION (fear of dislocation) is positive, not pain alone. Pain without apprehension may indicate impingement.", "pitfalls": null, "kb_panel_show": 1}, {"id": 84, "name": "O'Brien's Test (Active Compression Test)", "also_known_as": "Active Compression Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Seated or standing; shoulder at 90 deg flexion, 15 deg horizontal adduction, full IR (thumb down)", "procedure": "Apply downward force. Note pain. Repeat with full ER (thumb up). Compare pain between positions.", "positive_finding": "Pain or click positive in IR (thumb down) that is REDUCED or eliminated in ER (thumb up)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia O'Briens Test; O'Brien et al. 1998", "clinical_notes": "Part of SLAP cluster. Pain at top of shoulder in IR suggests AC joint. Pain/click deep in shoulder in IR relieved in ER suggests SLAP. Sensitivity and specificity vary widely across studies.", "pitfalls": null, "kb_panel_show": 1}, {"id": 85, "name": "Passive Compression Test", "also_known_as": "PCT / SLAP Compression", "test_type": "Provocation", "domain": "objective", "patient_position": "Lateral decubitus; unaffected side down; hip and shoulder at 30 deg abduction", "procedure": "Examiner passively externally rotates arm while applying proximal compression to humeral head toward glenoid. Simultaneously extends shoulder slightly.", "positive_finding": "Pain or painful click in glenohumeral joint", "sn": 0.82, "sn_ci": null, "sp": 0.86, "sp_ci": null, "plr": 5.73, "plr_ci": null, "nlr": 0.21, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Passive Compression Test; Kim et al.", "clinical_notes": "Best individual test for SLAP: Sn 0.82, Sp 0.86, +LR 5.73, -LR 0.21. Superior diagnostic accuracy to O Brien test for SLAP tears.", "pitfalls": null, "kb_panel_show": 1}, {"id": 86, "name": "Jobe's Relocation Test", "also_known_as": "Posterior Relocation Test / Fowler Sign", "test_type": "Provocation", "domain": "objective", "patient_position": "Supine; following positive Apprehension Test", "procedure": "Examiner applies posteriorly directed force to humeral head while maintaining shoulder in abduction/ER position.", "positive_finding": "REDUCTION of apprehension or pain with posterior humeral head pressure", "sn": 0.3, "sn_ci": null, "sp": 0.9, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Jobes Relocation Test", "clinical_notes": "Sn 0.30, Sp 0.90. Relief of apprehension with posterior pressure confirms anterior instability. If pain (not apprehension) is relieved, may indicate secondary impingement component.", "pitfalls": null, "kb_panel_show": 1}, {"id": 87, "name": "Finkelstein's Test", "also_known_as": null, "test_type": "Provocation", "domain": "objective", "patient_position": "Seated; hand in neutral", "procedure": "Patient makes a fist with thumb inside fingers (or just tucks thumb into palm). Examiner passively ulnar-deviates the wrist with firm but controlled force.", "positive_finding": "Severe pain at the radial styloid/first dorsal compartment that radiates up the forearm", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Finkelstein Test; StatPearls; Wu 2018", "clinical_notes": "Classic test for De Quervain. Finkelstein (thumb in fist then ulnar deviation) superior to Eichhoff (thumb not in fist). Limited formal Sn/Sp data but widely used and accepted clinically.", "pitfalls": null, "kb_panel_show": 1}, {"id": 88, "name": "WHAT Test (Wrist Hyperflexion and Abduction of Thumb)", "also_known_as": "WHAT Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Seated", "procedure": "Patient actively hyperflexes wrist and abducts thumb. Examiner resists the movement with index finger.", "positive_finding": "Pain reproduced at radial styloid with active WHAT maneuver against resistance", "sn": 0.99, "sn_ci": null, "sp": 0.29, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Goubau et al. 2014 J Hand Surg; Physiopedia WHAT Test", "clinical_notes": "Sn 0.99, Sp 0.29 in original study (n=100). Very high sensitivity but very low specificity. Active test better isolates APL/EPB tendons. Small study: interpret with caution.", "pitfalls": null, "kb_panel_show": 1}, {"id": 89, "name": "Radial Styloid Tenderness to Palpation", "also_known_as": null, "test_type": "Palpation", "domain": "objective", "patient_position": "Seated; thumb in anatomical position", "procedure": "Examiner palpates over the radial styloid and the first dorsal compartment/anatomical snuff box with firm but gentle pressure.", "positive_finding": "Pain or tenderness on palpation directly over radial styloid or first dorsal compartment", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "StatPearls De Quervain; Physiopedia", "clinical_notes": "Essential clinical finding. Local tenderness at radial styloid + positive Finkelstein = clinical diagnosis. Always compare to contralateral side.", "pitfalls": null, "kb_panel_show": 1}, {"id": 90, "name": "Arc Sign (Moving Palpation Test)", "also_known_as": "Arc Test", "test_type": "Palpation / Movement", "domain": "objective", "patient_position": "Prone; ankle relaxed with foot hanging freely", "procedure": "Locate area of thickening/swelling 2-7 cm above calcaneal insertion. Palpate with pinch grip. Ask patient to actively dorsiflex/plantarflex ankle while maintaining palpation.", "positive_finding": "Palpable thickening or swelling MOVES with active ankle motion (= intratendinous lesion). Stationary thickening = paratenon involvement.", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Achilles Tendinopathy Toolkit; Maffulli 2003", "clinical_notes": "Part of 3-test cluster. Distinguishes intratendinous pathology from paratenon pathology. Intratendinous lesions move with tendon; paratenon lesions stay fixed.", "pitfalls": null, "kb_panel_show": 1}, {"id": 91, "name": "Royal London Hospital Test (RLHT)", "also_known_as": "RLHT / Tendon Palpation in Dorsiflexion", "test_type": "Palpation / Range of Motion", "domain": "objective", "patient_position": "Prone; foot hanging freely", "procedure": "(1) Palpate most tender point in mid-portion Achilles. (2) Dorsiflex ankle to end range. (3) Re-palpate same point in dorsiflexion.", "positive_finding": "Pain is REDUCED or ABSENT on palpation in dorsiflexion compared to neutral/plantarflexion", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "APTA Royal London Hospital Test; Physiopedia Achilles toolkit", "clinical_notes": "Part of 3-test cluster. Rationale: In true tendinopathy, dorsiflexion tightens the tendon around the lesion, reducing tenderness. Paratenon pathology remains tender in all positions.", "pitfalls": null, "kb_panel_show": 1}, {"id": 92, "name": "Mid-portion Tendon Palpation", "also_known_as": "Pinch Palpation", "test_type": "Palpation", "domain": "objective", "patient_position": "Prone; foot hanging", "procedure": "Examiner pinch-palpates Achilles tendon 2-7 cm proximal to calcaneal insertion. Note location, thickening, nodularity, and pain.", "positive_finding": "Point tenderness and/or palpable thickening or nodule at mid-portion of Achilles tendon (2-7 cm above insertion)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Achilles Tendinopathy Toolkit; Maffulli 2003", "clinical_notes": "Most sensitive individual finding for Achilles tendinopathy. Part of 3-test cluster. Insertional tendinopathy located at/within 2 cm of calcaneal insertion.", "pitfalls": null, "kb_panel_show": 1}, {"id": 93, "name": "Modified Schober Test", "also_known_as": "Modified Lumbar Flexion Test / Schober", "test_type": "Range of Motion", "domain": "objective", "patient_position": "Standing; back exposed", "procedure": "Mark midpoint between PSIS (S1 level). Mark 10 cm above and 5 cm below this point (15 cm total). Patient bends forward maximally. Measure distance between marks in flexion.", "positive_finding": "Distance between marks INCREASES by less than 5 cm with forward flexion (Normal > 5 cm increase)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Schober Test; BASMI", "clinical_notes": "Positive (< 5 cm increase) = restricted lumbar flexion. Included in BASMI. Mild limitation > 4 cm increase; Moderate 2-4 cm; Severe < 2 cm. Note: Modified Schober better than original Schober test.", "pitfalls": null, "kb_panel_show": 1}, {"id": 94, "name": "Chest Expansion Measurement", "also_known_as": "Chest Expansion Test", "test_type": "Range of Motion", "domain": "objective", "patient_position": "Standing; arms at sides", "procedure": "Measure chest circumference at the 4th intercostal space during maximal exhalation then maximal inhalation. Calculate difference.", "positive_finding": "Chest expansion < 2.5 cm (strongly suggestive of AS; normal > 5 cm)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia AS; ASAS criteria; BASMI", "clinical_notes": "Reduced chest expansion reflects costovertebral joint involvement in AS. < 2.5 cm = ASAS classification criterion. Normal expansion approximately 5-7 cm.", "pitfalls": null, "kb_panel_show": 1}, {"id": 95, "name": "Occiput-to-Wall Distance (Tragus-to-Wall)", "also_known_as": "Occiput Wall Distance / Flesche Test", "test_type": "Posture / Range of Motion", "domain": "objective", "patient_position": "Standing with back and heels against wall; chin tucked", "procedure": "Patient stands with heels, buttocks, and back against wall. Patient attempts to touch wall with back of head while maintaining eye level.", "positive_finding": "Unable to touch wall with occiput. Record distance: Normal = 0 cm; > 0 cm = cervical/thoracic restriction or kyphosis", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia AS; BASMI", "clinical_notes": "Occiput-to-wall distance > 0 cm indicates progressive thoracic kyphosis and cervical involvement in AS. Included in BASMI. Tragus-to-wall is alternative (normal < 15 cm).", "pitfalls": null, "kb_panel_show": 1}, {"id": 96, "name": "SIJ Tenderness and Provocation Tests", "also_known_as": "SIJ Palpation + Provocation", "test_type": "Palpation / Provocation", "domain": "objective", "patient_position": "Prone or supine", "procedure": "Palpate SIJs for tenderness. Apply provocation tests (Distraction, Compression, Thigh Thrust) as per Laslett cluster.", "positive_finding": "Tenderness directly over SIJ AND positive SIJ provocation tests", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia AS; standard AS assessment", "clinical_notes": "SIJ involvement is pathognomonic of axial SpA. Early AS may present with SIJ pain before spinal involvement. Refer to Laslett SIJ cluster for specific test details.", "pitfalls": null, "kb_panel_show": 1}, {"id": 97, "name": "Lateral Lumbar Flexion (Fingertip-to-Floor Side Bending)", "also_known_as": "Lateral Spinal Flexion / BASMI Lateral Flexion", "test_type": "Range of Motion", "domain": "objective", "patient_position": "Standing; legs together; back against wall", "procedure": "Patient bends laterally with back against wall (keeping contact). Mark highest point of middle finger on thigh in standing, then in maximal side bending. Measure difference.", "positive_finding": "Difference < 10 cm suggests restricted lateral spinal flexion (Mild > 10 cm; Moderate 5-10 cm; Severe < 5 cm)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "BASMI; Physiopedia AS", "clinical_notes": "Included in BASMI. Assesses coronal plane spinal mobility. Bilateral restriction characteristic of AS. Normal > 10 cm side-to-side difference.", "pitfalls": null, "kb_panel_show": 1}, {"id": 98, "name": "Alar Ligament Side-Bending Stress Test", "also_known_as": "Alar Ligament Lateral Flexion Test", "test_type": "Stability", "domain": "objective", "patient_position": "Sitting; head in neutral", "procedure": "Examiner stabilises C2 (spinous process + lamina to prevent lateral flexion and rotation). Patient attempts lateral flexion or examiner passively laterally flexes occiput on atlas. Assess for excessive motion.", "positive_finding": "Excessive lateral flexion (> 3-5 deg) at occiput-atlas without coupled C2 rotation = positive for alar ligament laxity", "sn": 0.8, "sn_ci": "(range 0.80-0.86)", "sp": 0.69, "sp_ci": "(range 0.69-0.91)", "plr": 2.6, "plr_ci": "(range 2.6-9.41)", "nlr": 0.15, "nlr_ci": "(range 0.15-0.26)", "kappa": null, "reference": "Physiopedia Alar Ligament Test; Kaale et al.", "clinical_notes": "Part of alar ligament cluster. Sn 80-86%, Sp 69-91%, +LR 2.6-9.41, -LR 0.15-0.26. Tests alar ligament integrity by preventing normal coupling motion.", "pitfalls": null, "kb_panel_show": 1}, {"id": 99, "name": "Alar Ligament Rotation Stress Test", "also_known_as": "Alar Ligament Rotation Test", "test_type": "Stability", "domain": "objective", "patient_position": "Sitting; head in neutral", "procedure": "Examiner stabilises C2 (prevents C2 rotation). Examiner passively rotates occiput-atlas to end range.", "positive_finding": "Excessive rotation of occiput on atlas (> 40-44 deg each side) without corresponding C2 movement = alar ligament laxity", "sn": 0.84, "sn_ci": null, "sp": 0.77, "sp_ci": null, "plr": 3.65, "plr_ci": null, "nlr": 0.21, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Alar Ligament Test; Kaale et al.", "clinical_notes": "Part of alar ligament cluster. Normal rotation is ~40-44 deg each side at C0-C1. Excessive motion when C2 stabilised suggests alar ligament injury.", "pitfalls": null, "kb_panel_show": 1}, {"id": 100, "name": "Lateral Shear Test (Transverse Ligament Stress Test)", "also_known_as": "Transverse Ligament Test", "test_type": "Stability", "domain": "objective", "patient_position": "Supine; head supported", "procedure": "Examiner places thumbs on transverse processes of C1 and applies lateral shear force. Performed ONLY after Sharp-Purser is negative. Tests transverse ligament integrity.", "positive_finding": "Reproduction of neurological symptoms, excessive translation, or patient apprehension. NOTE: Do NOT perform if Sharp-Purser is positive", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Cervical Instability", "clinical_notes": "ONLY perform after negative Sharp-Purser test. Positive = transverse ligament injury. Can cause neurological compromise if performed on significantly unstable joint.", "pitfalls": null, "kb_panel_show": 1}, {"id": 101, "name": "Sharp-Purser Test", "also_known_as": "Atlantoaxial Instability Test", "test_type": "Safety / Stability", "domain": "objective", "patient_position": "Seated upright", "procedure": "Patient performs slight cervical nod (craniocervical flexion). Examiner places one palm on forehead and one hand stabilising C2 spinous process. Applies gentle posteriorly directed force to forehead while C2 is stabilised.", "positive_finding": "Sliding motion of head posteriorly relative to C2, OR reduction of symptoms (neurological or general) with posteriorly directed force", "sn": 0.69, "sn_ci": null, "sp": 0.96, "sp_ci": null, "plr": 17.3, "plr_ci": null, "nlr": 0.32, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Sharp-Purser Test; Uitvlugt & Indenbaum 1988; Student PT", "clinical_notes": "EXTREME CAUTION. Sn 69%, Sp 96%, +LR 17.3. Positive = atlantoaxial instability likely. MUST be done before other UCS tests. Particularly relevant in RA (29-70% of RA patients develop AA instability).", "pitfalls": null, "kb_panel_show": 1}, {"id": 102, "name": "Cervical Flexion-Rotation Test (CFRT)", "also_known_as": "FRT", "test_type": "Range of Motion", "domain": "objective", "patient_position": "Supine; full passive cervical flexion maintained throughout", "procedure": "Examiner fully flexes cervical spine (chin to chest position) passively. While maintaining full cervical flexion, examiner rotates head to maximum range in each direction. Measure or assess range.", "positive_finding": "Restricted rotation to one side (< 32-30 deg) OR reproduction of familiar headache symptoms in fully flexed position", "sn": 0.91, "sn_ci": null, "sp": 0.9, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Cervical FRT; Hall & Robinson 2004; Ogince 2007", "clinical_notes": "BEST test for CGH. Sn 91%, Sp 90%. In full flexion, C2-7 rotation is locked, so movement tests C1-C2 specifically. CGH group mean rotation 25 deg vs 42 deg in migraine. Cut-off: < 32-30 deg positive.", "pitfalls": null, "kb_panel_show": 1}, {"id": 103, "name": "Upper Cervical Joint Palpation (C1-C2-C3)", "also_known_as": "Segmental Palpation", "test_type": "Palpation / Mobility", "domain": "objective", "patient_position": "Supine; head in neutral on examiner hand", "procedure": "Examiner palpates and tests mobility of C0-1, C1-2, C2-3 joints using postero-anterior unilateral pressure. Assess for pain, stiffness, and reproduction of headache.", "positive_finding": "Pain reproduction AND/OR restriction of mobility at C1-C2 or adjacent segments that reproduces the patients familiar headache", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Hall 2007; Jull 2002; Physiopedia CGH", "clinical_notes": "Experienced examiner can identify C1-C2 dysfunction with good reliability. Part of CGH diagnostic cluster. Segmental hypomobility and pain at C1-C2 is consistent finding in CGH.", "pitfalls": null, "kb_panel_show": 1}, {"id": 104, "name": "Cranio-Cervical Flexion Test (CCFT)", "also_known_as": "Deep Cervical Flexor Assessment", "test_type": "Motor Control / Strength", "domain": "objective", "patient_position": "Supine; small inflatable pressure sensor behind neck (Stabiliser biofeedback unit)", "procedure": "Inflate pressure cuff to 20 mmHg baseline. Patient performs progressive craniocervical nodding movements to achieve target pressure increments (22, 24, 26, 28, 30 mmHg) without superficial flexor activation.", "positive_finding": "Inability to achieve or maintain target pressure levels without superficial cervical flexor (SCM/Scalene) activation", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Cervical Instability; Jull 2007", "clinical_notes": "Tests deep cervical flexor (DCF) motor control and neuromuscular function. Impaired DCF is consistent finding in CGH, cervicogenic headache, and neck pain. Part of the CGH diagnostic cluster.", "pitfalls": null, "kb_panel_show": 1}, {"id": 105, "name": "Hoffmann's Sign", "also_known_as": "Hoffmann Reflex", "test_type": "Neurological Reflex", "domain": "objective", "patient_position": "Seated or supine; hand relaxed, wrist dorsiflexed, fingers partially flexed", "procedure": "Examiner holds middle finger between index and middle fingers. Applies sharp, forcible downward flick to middle fingernail (forcing DIP into sudden flexion then releasing).", "positive_finding": "Involuntary flexion and adduction of thumb AND/OR flexion of index finger", "sn": null, "sn_ci": "(range 0.08-0.59)", "sp": null, "sp_ci": "(range 0.49-0.85)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Hoffmanns Sign; StatPearls; Houten & Noce 2008", "clinical_notes": "Low sensitivity (8-59%), variable specificity (49-85%). Bilateral Hoffmann = 91% MRI cord compression correlation. Present in 68% of surgical myelopathy cases. Part of Cook cluster.", "pitfalls": null, "kb_panel_show": 1}, {"id": 106, "name": "Tr\u00f6mner Sign", "also_known_as": "Tromner Reflex / Finger Flexion Reflex", "test_type": "Neurological Reflex", "domain": "objective", "patient_position": "Seated; hand relaxed; fingers partially flexed", "procedure": "Examiner taps the UNDERSIDE of the distal phalanx of the middle finger (volar surface). Observe thumb and index finger response.", "positive_finding": "Involuntary flexion of thumb and index finger", "sn": 0.94, "sn_ci": "(Jiang systematic review)", "sp": 0.93, "sp_ci": "(Jiang systematic review)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Tromner Sign; Jiang et al. 2024 meta-analysis", "clinical_notes": "Best individual test accuracy. Sn 94%, Sp 93%. Stimulates different receptors than Hoffmann (no nail involvement), potentially more sensitive. Tests corticospinal tract. Part of myelopathy assessment.", "pitfalls": null, "kb_panel_show": 1}, {"id": 107, "name": "Babinski Sign", "also_known_as": "Plantar Reflex", "test_type": "Neurological Reflex", "domain": "objective", "patient_position": "Supine; ankle in neutral", "procedure": "Examiner applies firm stroke along lateral sole from heel toward little toe then across metatarsal heads using a blunt instrument (key or reflex hammer handle).", "positive_finding": "Extension (dorsiflexion) of great toe with or without fanning of other toes (Babinski positive)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Standard neurology; Physiopedia; Houten 2008", "clinical_notes": "Present in 33% of surgical myelopathy cases; 83% in severe myelopathy (mJOA <=10). Positive Babinski = upper motor neuron lesion. Part of Cook myelopathy cluster.", "pitfalls": null, "kb_panel_show": 1}, {"id": 108, "name": "Lhermitte's Sign", "also_known_as": "Lhermitte Phenomenon", "test_type": "Neurological Provocation", "domain": "objective", "patient_position": "Seated; neck in neutral", "procedure": "Examiner passively flexes cervical spine to full flexion (or patient actively nods chin to chest). Sustained position or rapid flexion.", "positive_finding": "Electric shock-like sensation radiating down spine or into extremities with cervical flexion", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia; Cook 2010 cluster", "clinical_notes": "Pathognomonic of posterior column or spinal cord irritation. Common in cervical myelopathy and multiple sclerosis. Part of Cook myelopathy cluster.", "pitfalls": null, "kb_panel_show": 1}, {"id": 109, "name": "Inverted Supinator Sign (Inverted Radial Reflex)", "also_known_as": "Inverted Brachioradialis Reflex", "test_type": "Neurological Reflex", "domain": "objective", "patient_position": "Seated; forearm in neutral pronation/supination; elbow flexed 90 deg", "procedure": "Examiner taps the brachioradialis tendon (radial aspect of wrist) with reflex hammer. Observe expected wrist extension vs abnormal finger flexion.", "positive_finding": "ABSENCE of normal wrist extension response AND PRESENCE of abnormal finger flexion = inverted response (C5-C6 level myelopathy)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Cook 2010; standard neurology", "clinical_notes": "Inverted reflex = segmental level of cord compression at C5-C6. Normal = wrist extension. Inverted = finger flexion instead. Combined with Hoffmann = high specificity for C5-C6 myelopathy.", "pitfalls": null, "kb_panel_show": 1}, {"id": 110, "name": "Posterior Drawer Test (PCL)", "also_known_as": "Posterior Drawer - Knee", "test_type": "Stability/Translation", "domain": "objective", "patient_position": "Supine; hip flexed 45 deg, knee flexed 90 deg; examiner stabilises foot", "procedure": "Examiner grasps proximal tibia with both thumbs on tibial plateau. Applies posteriorly directed force to tibia.", "positive_finding": "Excessive posterior tibial translation vs contralateral OR absent/soft end feel", "sn": 0.9, "sn_ci": null, "sp": 0.99, "sp_ci": null, "plr": 90.0, "plr_ci": null, "nlr": 0.1, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Posterior Drawer Knee; Rubinstein 1994", "clinical_notes": "Sn 0.90, Sp 0.99, +LR 90, -LR 0.10. Very high diagnostic accuracy. Most specific test for PCL. Enhanced for grade 2-3 posterior laxity. Assess at 70 deg and 90 deg of flexion.", "pitfalls": null, "kb_panel_show": 1}, {"id": 111, "name": "Posterior Sag Sign", "also_known_as": "Godfrey Test / Gravity Drawer", "test_type": "Observation/Provocation", "domain": "objective", "patient_position": "Supine; hip and knee both flexed to 90 deg; foot supported on table or examiner holds tibia", "procedure": "Examiner observes lateral profile of knee. Gravity causes posterior tibial sag if PCL ruptured.", "positive_finding": "Visible posterior sag of tibial tubercle below level of patella or lateral femoral condyle (loss of normal tibial step-off)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Posterior Drawer Knee", "clinical_notes": "Pathognomonic when clearly positive. Must be distinguished from normal tibial step-off. Compare both sides. Subtle sag may be missed without comparison.", "pitfalls": null, "kb_panel_show": 1}, {"id": 112, "name": "Valgus Stress Test (MCL)", "also_known_as": "Medial Stress Test", "test_type": "Stability", "domain": "objective", "patient_position": "Supine; leg extended or knee flexed to 30 deg", "procedure": "Examiner holds distal leg with one hand; other hand on lateral aspect of knee. Apply medially directed (valgus) force to knee. Perform at 0 deg and 30 deg.", "positive_finding": "Medial joint gapping (mm) vs contralateral OR reproduction of medial knee pain at 0 or 30 deg of flexion", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Valgus Stress Test", "clinical_notes": "Limited formal Sn/Sp data. Positive @ 30 deg = MCL injury. Positive @ 0 deg = MCL + posterior capsule + cruciate involvement. Graded: Grade 1 (0-5mm), Grade 2 (5-10mm), Grade 3 (>10mm) gapping.", "pitfalls": null, "kb_panel_show": 1}, {"id": 113, "name": "Varus Stress Test (LCL)", "also_known_as": "Lateral Stress Test", "test_type": "Stability", "domain": "objective", "patient_position": "Supine; leg extended or knee flexed to 30 deg", "procedure": "Examiner holds distal leg with one hand; other hand on medial aspect of knee. Apply laterally directed (varus) force. Perform at 0 deg and 30 deg.", "positive_finding": "Lateral joint gapping vs contralateral OR reproduction of lateral knee pain at 0 or 30 deg", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Varus Stress Test", "clinical_notes": "Positive @ 30 deg = LCL injury. LCL injuries less common than MCL. Positive @ 0 deg = LCL + posterolateral corner + cruciate involvement.", "pitfalls": null, "kb_panel_show": 1}, {"id": 114, "name": "Scarf Test (Cross-Body Adduction Test)", "also_known_as": "Cross-Body Adduction / Horizontal Adduction", "test_type": "Provocation", "domain": "objective", "patient_position": "Standing or sitting; shoulder at 90 deg flexion, elbow at 90 deg", "procedure": "Examiner passively horizontally adducts arm across chest, bringing elbow toward contralateral shoulder (full cross-body adduction). Apply overpressure at end range.", "positive_finding": "Pain localised to AC joint region with cross-body adduction", "sn": 0.77, "sn_ci": "(Park 2005)", "sp": 0.79, "sp_ci": "(Park 2005)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Scarf Test; Park et al. 2005 JBJS", "clinical_notes": "Sn 0.77, Sp 0.79 for AC pathology. Compression of medial acromial facet against distal clavicle. May also be positive in posterior capsule tightness and SIS.", "pitfalls": null, "kb_panel_show": 1}, {"id": 115, "name": "O'Brien's Test (AC Joint interpretation)", "also_known_as": "Active Compression Test - AC variant", "test_type": "Provocation", "domain": "objective", "patient_position": "Standing; shoulder at 90 deg flexion, 15 deg horizontal adduction", "procedure": "Downward force applied with shoulder in full IR (thumb down). Repeat in ER (thumb up). KEY: note pain LOCATION not just presence.", "positive_finding": "Pain at TOP of shoulder (AC joint) in IR position that is REDUCED in ER = AC joint pathology. Deep shoulder pain = labral pathology.", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia O'Briens Test; Park 2005", "clinical_notes": "O'Brien's tests BOTH AC joint and labrum depending on pain location. Top of shoulder (superficial) = AC. Deep in joint = labral/SLAP.", "pitfalls": null, "kb_panel_show": 1}, {"id": 116, "name": "Resisted AC Joint Extension Test", "also_known_as": "AC Extension Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Sitting; shoulder at 90 deg flexion and IR; elbow at 90 deg flexion", "procedure": "Examiner places hand on elbow. Patient asked to horizontally abduct arm against isometric resistance (move elbow posteriorly against resistance).", "positive_finding": "Pain reproduced at AC joint region with resisted horizontal abduction", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Resisted AC Joint Extension Test", "clinical_notes": "Used in combination with CBA and O Briens to confirm AC pathology. Tests AC joint via isometric loading of deltoid and trapezius through AC joint.", "pitfalls": null, "kb_panel_show": 1}, {"id": 117, "name": "AC Joint Direct Palpation", "also_known_as": "Local Tenderness Palpation", "test_type": "Palpation", "domain": "objective", "patient_position": "Sitting; shoulder relaxed", "procedure": "Examiner directly palpates AC joint line (junction of clavicle and acromion) with firm pressure.", "positive_finding": "Pain reproduced directly at AC joint on palpation", "sn": 0.96, "sn_ci": "(McFarland)", "sp": 0.1, "sp_ci": "(McFarland)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Brookbush Institute citing McFarland study; Park et al. 2005", "clinical_notes": "Highest sensitivity (96%) for AC pathology but very low specificity (10%). Excellent SCREENING test - negative palpation effectively rules out AC pathology.", "pitfalls": null, "kb_panel_show": 1}, {"id": 118, "name": "Speed's Test", "also_known_as": "Straight Arm Test / Biceps Speed Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Standing or sitting; elbow extended, forearm supinated, shoulder at 90 deg flexion", "procedure": "Examiner applies downward (extension) force to the distal forearm/wrist. Patient resists shoulder flexion while examiner palpates bicipital groove.", "positive_finding": "Pain in the bicipital groove area with resisted shoulder flexion", "sn": 0.5, "sn_ci": "(range 0.18-0.90)", "sp": 0.67, "sp_ci": "(range 0.14-0.87)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Speeds Test; Gill 2007 AJSM", "clinical_notes": "Wide variation in stats across studies (Sn 18-90%, Sp 14-87%). Best used in combination. Palpate bicipital groove during test to localise pain.", "pitfalls": null, "kb_panel_show": 1}, {"id": 119, "name": "Yergason's Test", "also_known_as": null, "test_type": "Provocation", "domain": "objective", "patient_position": "Seated or standing; humerus at side, elbow at 90 deg, forearm pronated", "procedure": "Examiner stabilises distal forearm/wrist. Patient asked to simultaneously supinate forearm and externally rotate shoulder against resistance.", "positive_finding": "Pain reproduced in bicipital groove OR click/subluxation sensation in the groove", "sn": null, "sn_ci": null, "sp": 0.95, "sp_ci": "(Hegedus meta-analysis)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Yergasons Test; Hegedus meta-analysis", "clinical_notes": "Highest specificity (95%) of biceps tests but low sensitivity. Positive = strong indicator of biceps pathology or transverse ligament insufficiency. Click = biceps subluxation from groove.", "pitfalls": null, "kb_panel_show": 1}, {"id": 120, "name": "Bicipital Groove Tenderness", "also_known_as": "Palpation of LHB groove", "test_type": "Palpation", "domain": "objective", "patient_position": "Sitting; arm at side, shoulder in 10 deg ER to bring groove anteriorly", "procedure": "Examiner palpates bicipital groove (between greater and lesser tubercles) with firm pressure while passively rotating arm to identify most tender point.", "positive_finding": "Tenderness to palpation in the bicipital groove (intertubercular sulcus)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia; standard shoulder assessment", "clinical_notes": "Local tenderness at bicipital groove is hallmark of LHB tendinopathy. Distinguishes from AC joint pain (more superior) and SIS (more lateral).", "pitfalls": null, "kb_panel_show": 1}, {"id": 121, "name": "Pressure Provocative Test (Cubital Tunnel)", "also_known_as": "Cubital Tunnel Compression Test", "test_type": "Provocation/Palpation", "domain": "objective", "patient_position": "Seated; elbow flexed 20 deg, forearm supinated", "procedure": "Examiner applies direct pressure proximal to the cubital tunnel for 60 seconds while elbow is held at 20 deg flexion.", "positive_finding": "Reproduction of tingling or paresthesia in ulnar nerve distribution (ring and little finger + ulnar forearm)", "sn": 0.75, "sn_ci": null, "sp": 0.99, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Cubital Tunnel Syndrome; Novak et al.", "clinical_notes": "Sn 0.75, Sp 0.99, PPV 0.97. Best individual test for cubital tunnel. High specificity makes it an excellent rule-in test.", "pitfalls": null, "kb_panel_show": 1}, {"id": 122, "name": "Tinel's Sign at Elbow", "also_known_as": "Tinel at Cubital Tunnel", "test_type": "Provocation/Palpation", "domain": "objective", "patient_position": "Seated; elbow slightly flexed", "procedure": "Examiner taps or percusses lightly over ulnar nerve in cubital tunnel groove (between olecranon and medial epicondyle).", "positive_finding": "Tingling or electric sensation radiating into ring and little finger (ulnar nerve distribution)", "sn": 0.7, "sn_ci": null, "sp": 0.98, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Tinels Test; ScienceDirect Cubital Tunnel", "clinical_notes": "Sn 0.70, Sp 0.98. High specificity. Positive Tinel at elbow strongly suggests ulnar nerve irritation at cubital tunnel level.", "pitfalls": null, "kb_panel_show": 1}, {"id": 123, "name": "Elbow Flexion Test", "also_known_as": "Elbow Flexion Test - Ulnar Nerve", "test_type": "Provocation", "domain": "objective", "patient_position": "Standing or sitting", "procedure": "Patient actively fully flexes elbow while extending wrist and depressing/abducting shoulder girdle to 90 deg. Hold for 3-5 minutes.", "positive_finding": "Numbness or tingling in ulnar nerve distribution (ring and little finger) within 3 minutes of full elbow flexion", "sn": 0.32, "sn_ci": "(alone)", "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Elbow Flexion Test; Buehler & Thayer 1988", "clinical_notes": "Sn 0.32 alone but improves combined with cubital tunnel pressure. Elbow flexion reduces cubital tunnel volume by 55% compressing ulnar nerve. 3-minute hold standard.", "pitfalls": null, "kb_panel_show": 1}, {"id": 124, "name": "Medial Epicondyle Palpation", "also_known_as": "Local Tenderness", "test_type": "Palpation", "domain": "objective", "patient_position": "Seated; elbow slightly flexed", "procedure": "Examiner palpates directly at and distal to medial epicondyle (flexor-pronator origin). Note exact location of tenderness.", "positive_finding": "Tenderness to palpation at or just distal to medial epicondyle at flexor-pronator origin", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Standard assessment; Physiopedia", "clinical_notes": "Essential component. Tenderness specifically at flexor-pronator origin (not just medial epicondyle) is most diagnostic.", "pitfalls": null, "kb_panel_show": 1}, {"id": 125, "name": "Resisted Wrist Flexion Test", "also_known_as": "Wrist Flexion Stress Test", "test_type": "Provocation/Strength", "domain": "objective", "patient_position": "Seated; elbow extended, forearm supinated", "procedure": "Examiner stabilises forearm. Patient performs resisted wrist flexion against examiner resistance.", "positive_finding": "Pain at medial epicondyle/flexor-pronator origin with resisted wrist flexion", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Standard assessment; analogue to Cozens for lateral", "clinical_notes": "Pain at medial epicondyle with resisted wrist flexion = positive for medial epicondylalgia. Similar mechanism to Cozen test for lateral.", "pitfalls": null, "kb_panel_show": 1}, {"id": 126, "name": "Resisted Forearm Pronation", "also_known_as": "Pronation Stress Test", "test_type": "Provocation/Strength", "domain": "objective", "patient_position": "Seated; elbow at 90 deg, forearm in neutral", "procedure": "Examiner stabilises elbow. Patient performs resisted forearm pronation against examiner resistance.", "positive_finding": "Pain at medial epicondyle with resisted pronation", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Standard assessment", "clinical_notes": "Tests pronator teres which originates at or near medial epicondyle. Positive = medial epicondylalgia or pronator teres syndrome.", "pitfalls": null, "kb_panel_show": 1}, {"id": 127, "name": "Windlass Test (Weight-bearing)", "also_known_as": "Weight-bearing Windlass", "test_type": "Provocation", "domain": "objective", "patient_position": "Standing; feet on floor; toes hanging off edge of step or examiner dorsiflexes great toe while patient weight-bears", "procedure": "Patient stands with foot on stool. Examiner passively dorsiflexes great toe maximally while patient bears weight through foot.", "positive_finding": "Heel pain reproduced with passive dorsiflexion of great toe in weight-bearing position", "sn": 0.32, "sn_ci": "(De Garceau 2003)", "sp": 1.0, "sp_ci": "(100% specificity De Garceau)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Windlass Test; De Garceau 2003 Foot Ankle Int; JOSPT CPG", "clinical_notes": "Very high specificity (100%) but low sensitivity (32%). Positive test = near certain plantar fasciitis. Negative test does NOT rule out. Weight-bearing version more sensitive than non-weight-bearing.", "pitfalls": null, "kb_panel_show": 1}, {"id": 128, "name": "Calcaneal Insertion Palpation", "also_known_as": "Heel Palpation / Plantar Fascia Palpation", "test_type": "Palpation", "domain": "objective", "patient_position": "Seated or supine; ankle in neutral", "procedure": "Examiner firmly palpates medial calcaneal tuberosity (insertion of plantar fascia) and proximal plantar fascia. Apply pressure with thumb.", "positive_finding": "Point tenderness at medial calcaneal tubercle and/or proximal plantar fascia", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "JOSPT CPG; standard assessment", "clinical_notes": "Most consistent examination finding. Tenderness specifically at medial calcaneal tubercle (not diffuse heel) is most diagnostic. Compare to contralateral.", "pitfalls": null, "kb_panel_show": 1}, {"id": 129, "name": "First-Step Pain History (Post-Static Dyskinesia)", "also_known_as": null, "test_type": "History", "domain": "subjective", "patient_position": "N/A - patient reported", "procedure": "Ask patient: Is your heel pain worst with your first steps in the morning or after prolonged sitting? Does it improve after walking a few steps?", "positive_finding": "Severe heel pain with first few steps after rest that IMPROVES with continued walking (post-static dyskinesia)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "JOSPT CPG; Saban & Masharawi", "clinical_notes": "Sn 82% for plantar fasciitis. Most sensitive history feature. The warm-up phenomenon (pain reduces with activity) distinguishes from stress fracture (worsens with activity).", "pitfalls": null, "kb_panel_show": 1}, {"id": 130, "name": "Ankle Dorsiflexion ROM (Gastroc-Soleus Tightness)", "also_known_as": "Weight-bearing Lunge Test", "test_type": "Range of Motion", "domain": "objective", "patient_position": "Standing; feet in neutral position", "procedure": "Measure weight-bearing ankle dorsiflexion (knee-to-wall lunge test). Patient lunges toward wall with knee touching wall and heel flat. Measure foot-to-wall distance.", "positive_finding": "< 10 cm foot-to-wall distance OR < 10 deg non-weight-bearing ankle DF = gastrocnemius-soleus tightness", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "JOSPT CPG 2014/2023; Radford 2006", "clinical_notes": "Reduced ankle DF (gastrocnemius tightness) is consistent risk factor for plantar fasciitis. < 10 cm weight-bearing lunge or < 10 deg passive DF = positive for tightness.", "pitfalls": null, "kb_panel_show": 1}, {"id": 131, "name": "Metatarsal Lateral Squeeze Test", "also_known_as": "Metatarsal Compression Test / Morton Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Seated or supine; foot relaxed", "procedure": "Examiner grasps medial and lateral aspects of forefoot with one hand and compresses (squeezes) metatarsal heads together. Simultaneously palpates affected interspace with other hand.", "positive_finding": "Aggravation of pain in interdigital space with compression. Mulder click = palpable/audible click as neuroma is displaced.", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Metatarsal Squeeze Test; Mulder 1951", "clinical_notes": "Lateral squeeze provokes symptomatic interspace. Mulder's click = neuroma displaced by compression. Click has high specificity but low sensitivity. Most commonly between 3rd-4th metatarsals.", "pitfalls": null, "kb_panel_show": 1}, {"id": 132, "name": "Modified Webspace Tenderness Test", "also_known_as": "Thumb-Index Finger Webspace Squeeze", "test_type": "Palpation/Provocation", "domain": "objective", "patient_position": "Seated; foot relaxed", "procedure": "Examiner uses thumb and index finger to apply direct pinch pressure within the symptomatic intermetatarsal webspace from plantar and dorsal surfaces.", "positive_finding": "Pain or paresthesia in the specific interdigital webspace with direct webspace compression", "sn": 0.96, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": 0.04, "nlr_ci": null, "kappa": null, "reference": "PMC 2024 systematic review on Morton neuroma diagnosis", "clinical_notes": "Sn 0.96, -LR 0.04. BEST test for Morton neuroma - negative test effectively rules it out (-LR 0.04). Direct webspace palpation more sensitive than lateral squeeze.", "pitfalls": null, "kb_panel_show": 1}, {"id": 133, "name": "Patient-Reported Clicking", "also_known_as": "Clicking symptom history", "test_type": "History", "domain": "subjective", "patient_position": "N/A - patient reported", "procedure": "Ask patient: Do you experience clicking in the ball of your foot?", "positive_finding": "Patient spontaneously reports or confirms clicking sensation in the forefoot during walking", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "PMC 2024 systematic review", "clinical_notes": "Strong evidence that patient-reported clicking rules in Morton neuroma. Clicking = neuroma subluxating across metatarsal ligament during gait loading.", "pitfalls": null, "kb_panel_show": 1}, {"id": 134, "name": "Timed Up and Go Test (TUG)", "also_known_as": "TUG", "test_type": "Functional Mobility / Balance", "domain": "objective", "patient_position": "Seated in standard arm chair (seat height ~46 cm)", "procedure": "Patient wears regular footwear and uses usual walking aid. On command \"go\", rises from chair, walks 3 metres, turns aroun
