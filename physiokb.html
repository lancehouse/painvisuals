d, walks back and sits. Record time in seconds.", "positive_finding": "Elderly community: > 12 sec = fall risk. > 13.5 sec = discriminates fallers from non-fallers. Parkinson disease: > 11.5 sec = impaired mobility.", "sn": 0.8, "sn_ci": "(> 11.1 sec cut-off)", "sp": 0.56, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia TUG; Podsiadlo & Richardson 1991; RehabMeasures", "clinical_notes": "TUG > 11.1 sec: Sn 80%, Sp 56% for falls prediction. Excellent reliability (ICC 0.87-0.99). Used across many populations. Simple, no equipment needed. Normal healthy older adult < 12 sec.", "pitfalls": null, "kb_panel_show": 1}, {"id": 135, "name": "Berg Balance Scale (BBS)", "also_known_as": "Berg Scale", "test_type": "Functional Balance Assessment", "domain": "objective", "patient_position": "Multiple positions (sitting, standing, tandem, single leg, stepping)", "procedure": "14-item balance test. Patient performs tasks scored 0-4. Maximum score 56. Tasks include: sitting unsupported, stand to sit, transfers, standing unsupported, with eyes closed, feet together, reaching, turning, turning to look behind, tandem, single leg stance, alternate step.", "positive_finding": "Score < 45/56 = increased fall risk. Score < 41 = high fall risk. Score 56 = full functional balance.", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Berg Balance Scale; Lima et al. 2018 Physiotherapy systematic review", "clinical_notes": "Score 56 = safe. < 45 = fall risk. < 41 = high fall risk. Excellent reliability. Widely used in elderly, stroke, Parkinson disease, THA/TKA. Takes 15-20 min. Free to use.", "pitfalls": null, "kb_panel_show": 1}, {"id": 136, "name": "TUG Cognitive (Dual-Task TUG)", "also_known_as": "TUG Cog", "test_type": "Functional Mobility / Dual-task", "domain": "objective", "patient_position": "Seated in standard chair", "procedure": "Standard TUG procedure performed while simultaneously counting backwards in threes from a random number (cognitive dual-task). Record time and count errors.", "positive_finding": "Time significantly longer than standard TUG AND/OR counting errors during dual-task walking", "sn": 0.765, "sn_ci": "(0.765 sensitivity)", "sp": 0.737, "sp_ci": "(0.737 specificity)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia TUG; dual-task assessment literature", "clinical_notes": "TUG Cognitive: Sn 76.5%, Sp 73.7% for fall risk. More discriminative than standard TUG alone. Dual-task deficit reflects reduced cognitive-motor reserve. Recommended over TUG alone.", "pitfalls": null, "kb_panel_show": 1}, {"id": 137, "name": "Single Leg Stance Test", "also_known_as": "One Leg Standing Test", "test_type": "Balance", "domain": "objective", "patient_position": "Standing; eyes open then eyes closed", "procedure": "Patient stands on one leg (without shoes preferred). Examiner times how long balance is maintained. Test each leg. Perform with eyes open and closed (Romberg sensitisation).", "positive_finding": "< 5 sec single leg stance with eyes open in community-dwelling older adults = fall risk. < 30 sec in healthy adults < 60 years = impaired.", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Single Leg Stance Test; Bohannon 2006", "clinical_notes": "< 5 sec = significant balance impairment and fall risk in older adults. Eyes closed < 10 sec = vestibular/proprioceptive deficit. Simple, no equipment, high clinical utility.", "pitfalls": null, "kb_panel_show": 1}, {"id": 138, "name": "Anatomical Snuffbox Tenderness", "also_known_as": "Snuffbox Palpation Test", "test_type": "Palpation", "domain": "objective", "patient_position": "Seated; wrist in ulnar deviation and slight extension to open snuffbox", "procedure": "Examiner palpates firmly into the anatomical snuffbox (depression on radial aspect of wrist bordered by EPL, EPB, APL tendons) with thumb.", "positive_finding": "Localised pain and tenderness on palpation within the anatomical snuffbox", "sn": 0.9, "sn_ci": "(range 0.87-1.0)", "sp": 0.4, "sp_ci": "(range 0.09-0.57)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Anatomical Snuff Box; AAFP 2004; Physiopedia Scaphoid Fracture", "clinical_notes": "Sn 90-100%, Sp 40%. Very high sensitivity makes it an excellent SCREENING test - negative result effectively rules out scaphoid fracture. Low specificity means many false positives.", "pitfalls": null, "kb_panel_show": 1}, {"id": 139, "name": "Scaphoid Tubercle Tenderness", "also_known_as": "Volar Scaphoid Palpation", "test_type": "Palpation", "domain": "objective", "patient_position": "Seated; wrist in extension", "procedure": "Examiner extends patient wrist with one hand. With other hand, applies firm pressure to scaphoid tuberosity (at proximal wrist crease, radial to FCR tendon, under distal FCR).", "positive_finding": "Tenderness on direct palpation of scaphoid tuberosity on volar aspect of wrist", "sn": 0.87, "sn_ci": null, "sp": 0.57, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Scaphoid Fracture; AAFP 2004", "clinical_notes": "Sn 87%, Sp 57%. Better specificity than anatomical snuffbox tenderness. Combination with snuffbox tenderness improves overall accuracy.", "pitfalls": null, "kb_panel_show": 1}, {"id": 140, "name": "Scaphoid Compression Test", "also_known_as": "Axial Thumb Compression / Longitudinal Compression Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Seated; hand relaxed", "procedure": "Examiner applies axial compression along the line of the first metacarpal (pressing thumb toward wrist along its long axis), transmitting force through the scaphoid.", "positive_finding": "Wrist pain reproduced with axial loading through the thumb metacarpal", "sn": 1.0, "sn_ci": "(one study; others show poor PPV)", "sp": 0.8, "sp_ci": "(one study)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "ScienceDirect 1989; Physiopedia Scaphoid Fracture; Orthobullets", "clinical_notes": "One study: Sn 100%, Sp 80% (best accuracy of the 3 tests). Another study showed poor predictive value. Variable results - interpret in context of cluster. Useful when positive.", "pitfalls": null, "kb_panel_show": 1}, {"id": 141, "name": "Fovea Sign (Ulnar Fovea Palpation)", "also_known_as": "Ulnar Fovea Sign Test", "test_type": "Palpation", "domain": "objective", "patient_position": "Seated; wrist in neutral; forearm slightly pronated", "procedure": "Examiner palpates firmly into soft tissue depression between: ulnar styloid, FCU tendon, volar surface of ulnar head, and pisiform (the ulnar fovea).", "positive_finding": "Tenderness to palpation in the ulnar fovea region", "sn": 0.89, "sn_ci": null, "sp": 0.48, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Fovea Sign; Tay et al. 2007 J Hand Surg", "clinical_notes": "Sn 89%, Sp 48% for TFCC injury. Sn 85%, Sp 37% for ulnocarpal abutment syndrome. High sensitivity makes it a good screening test. Low specificity limits rule-in value alone.", "pitfalls": null, "kb_panel_show": 1}, {"id": 142, "name": "Piano Key Sign (DRUJ Instability Test)", "also_known_as": "Piano Key Test / Distal Radioulnar Joint Stress Test", "test_type": "Stability", "domain": "objective", "patient_position": "Seated; forearm pronated on table", "procedure": "Examiner firmly stabilises distal radius with one hand. Other hand grasps ulnar head between thumb and index finger. Applies volarly directed force to ulnar head, then releases to observe rebound.", "positive_finding": "Excessive volar translation of ulnar head OR pain with volar loading, AND spring-back on release (like pressing a piano key)", "sn": 0.59, "sn_ci": null, "sp": 0.96, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Piano Key Sign; LaStayo & Howell 1995", "clinical_notes": "Sn 59%, Sp 96%. High specificity makes it an excellent RULE-IN test for DRUJ instability. When positive = strong indicator of TFCC / DRUJ pathology.", "pitfalls": null, "kb_panel_show": 1}, {"id": 143, "name": "TFCC Compression Test", "also_known_as": "TFCC Stress Test / Ulnar Grinding Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Seated; wrist in neutral or ulnar deviation", "procedure": "Examiner applies axial compression through ulnar side of wrist while patient actively pronates and supinates forearm. Or: apply axial load with wrist in ulnar deviation.", "positive_finding": "Ulnar-sided wrist pain reproduced with compression and rotation in ulnar deviation", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia TFCC Injuries; standard assessment", "clinical_notes": "Most commonly used TFCC provocation test. Low individual specificity but useful in combination. Compresses TFCC between ulnar head and triquetrum/lunate.", "pitfalls": null, "kb_panel_show": 1}, {"id": 144, "name": "Press Test (Chair Lift Test)", "also_known_as": "TFCC Press Test", "test_type": "Provocation/Function", "domain": "objective", "patient_position": "Seated in chair with armrests", "procedure": "Patient places palms on armrests and attempts to lift body weight out of chair using wrists in extension (wrist extension weight-bearing).", "positive_finding": "Ulnar-sided wrist pain reproduced with weight-bearing wrist extension loading", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia TFCC Injuries; Lester et al.", "clinical_notes": "Lester et al reported 100% sensitivity for TFCC tear. Specificity likely low (many wrist conditions cause pain with loaded extension). Simple functional test.", "pitfalls": null, "kb_panel_show": 1}, {"id": 145, "name": "External Rotation Lag Sign (ERLS)", "also_known_as": "Infraspinatus Spring Back Test / Lateral Rotation Lag Sign", "test_type": "Neuromotor/Lag", "domain": "objective", "patient_position": "Seated; elbow flexed 90 deg, shoulder abducted 20 deg in scapular plane", "procedure": "Examiner passively brings shoulder to near-maximum ER (hold 5 deg short of max to avoid elastic recoil). Patient asked to maintain position. Examiner releases wrist support (maintains elbow support).", "positive_finding": "Inability to maintain ER position; arm springs back into IR (lag). Magnitude recorded in degrees.", "sn": 0.46, "sn_ci": "(isolated SSP tear)", "sp": 0.94, "sp_ci": "(isolated SSP tear)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia ERLS; Hertel et al. 1996; orthofixar review", "clinical_notes": "Sn 46%, Sp 94% for isolated supraspinatus tear. Highly specific. For combined SS+IS tears: sensitivity improves. Large lag (>40 deg) suggests teres minor involvement.", "pitfalls": null, "kb_panel_show": 1}, {"id": 146, "name": "Internal Rotation Lag Sign (IRLS)", "also_known_as": "Subscapularis Lag Sign", "test_type": "Neuromotor/Lag", "domain": "objective", "patient_position": "Seated; elbow flexed 90 deg; hand placed behind back near waist in IR", "procedure": "Examiner passively lifts hand away from back into IR. Patient asked to maintain position. Examiner releases wrist.", "positive_finding": "Inability to maintain IR position; hand drops back to buttock/back (lag > 5 deg)", "sn": 0.97, "sn_ci": "(Hertel 1996)", "sp": 0.96, "sp_ci": "(Hertel 1996)", "plr": 24.3, "plr_ci": null, "nlr": 0.03, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Internal Rotation Lag Sign; Hertel et al. 1996", "clinical_notes": "Sn 0.97, Sp 0.96, +LR 24.3, -LR 0.03. Excellent diagnostic accuracy for subscapularis tear. NPV 100% (Miller 2008): negative IRLS effectively rules out full-thickness subscapularis tear.", "pitfalls": null, "kb_panel_show": 1}, {"id": 147, "name": "Drop Sign (Infraspinatus Test)", "also_known_as": "Dropping Sign", "test_type": "Neuromotor/Lag", "domain": "objective", "patient_position": "Seated; elbow flexed 90 deg; shoulder at 90 deg abduction and near-maximum ER", "procedure": "Examiner passively positions shoulder in near-max ER at 90 deg abduction. Patient asked to maintain position. Support released.", "positive_finding": "Inability to maintain ER at 90 deg abduction; arm drops into IR", "sn": 0.87, "sn_ci": "(95% CI 62-96%)", "sp": 0.88, "sp_ci": "(95% CI 80-93%)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Drop Arm Test; CORR 2015 Walch study", "clinical_notes": "Drop Sign: Sn 87%, Sp 88% for teres minor/infraspinatus involvement. Different from Drop ARM test (supraspinatus). Tests infraspinatus specifically.", "pitfalls": null, "kb_panel_show": 1}, {"id": 148, "name": "Hornblower's Sign (Teres Minor Test)", "also_known_as": "Hornblower Sign / Patte Sign Variant", "test_type": "Neuromotor/Function", "domain": "objective", "patient_position": "Standing or seated; arms at sides", "procedure": "Patient asked to bring hands to mouth. If large posterior RCT present, patient cannot achieve hand-to-mouth without first abducting arm (creating hornblower/trumpeter posture). OR: shoulder at 90 deg abduction, elbow flexed 90 deg, examiner resists ER.", "positive_finding": "Inability to externally rotate shoulder at 90 deg abduction, OR need to abduct arm to bring hand to mouth", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Hornblowers Sign; Walch 1998 JBJS", "clinical_notes": "Specific for teres minor tear. Part of massive RCT assessment. Positive Hornblower = teres minor involvement = poor prognosis for reverse shoulder arthroplasty.", "pitfalls": null, "kb_panel_show": 1}, {"id": 149, "name": "Lift-Off Test (Subscapularis)", "also_known_as": "Gerber Lift-Off Test", "test_type": "Neuromotor/Strength", "domain": "objective", "patient_position": "Standing; hand placed behind back at waist level in IR", "procedure": "Patient places dorsum of hand on lumbar spine. Patient lifts hand away from back against examiner resistance OR simply lifts hand away from back without resistance.", "positive_finding": "Inability to lift hand away from back (lift off) OR significant weakness vs contralateral side", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Hertel et al. 1996; Gerber & Krushell 1991; standard shoulder assessment", "clinical_notes": "Classic subscapularis test. Gerber 1991 original description. Complements IRLS (IRLS more sensitive for partial tears). Both test subscapularis.", "pitfalls": null, "kb_panel_show": 1}, {"id": 150, "name": "ULTT-2b (Radial Nerve Bias)", "also_known_as": "ULTT-2B / Radial Nerve Tension Test", "test_type": "Neurodynamic", "domain": "objective", "patient_position": "Supine; arm at side", "procedure": "Sequence: (1) Shoulder girdle depression. (2) Shoulder abduction ~10 deg. (3) Elbow extension. (4) Shoulder IR. (5) Forearm pronation. (6) Wrist/finger flexion. (7) Thumb flexion. (8) Sensitise: cervical lateral flexion.", "positive_finding": "Symptom reproduction (forearm/wrist/thumb symptoms) AND structural differentiation positive with cervical lateral flexion", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia ULTTs; ScienceDirect 2023 systematic review", "clinical_notes": "Limited clinical validity evidence for radial nerve selectivity. Biomechanical evidence shows radial nerve ULTT also stresses median nerve significantly. Use cautiously to confirm suspected radial nerve mechanosensitivity (e.g. posterior interosseous nerve syndrome, radial tunnel syndrome).", "pitfalls": null, "kb_panel_show": 1}, {"id": 151, "name": "ULTT-3 (Ulnar Nerve Bias)", "also_known_as": "ULTT-3 / Ulnar Nerve Tension Test / Upper Limb Neural Test C", "test_type": "Neurodynamic", "domain": "objective", "patient_position": "Supine; arm at side", "procedure": "Sequence: (1) Wrist/finger extension. (2) Forearm supination. (3) Elbow flexion. (4) Shoulder abduction. (5) Shoulder ER. (6) Shoulder girdle depression. (7) Sensitise: contralateral cervical lateral flexion.", "positive_finding": "Reproduction of medial forearm/ring-little finger symptoms AND structural differentiation positive with cervical lateral flexion", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia ULTTs; ScienceDirect 2023 systematic review", "clinical_notes": "Limited selectivity evidence for ulnar nerve. Useful for suspected cubital tunnel syndrome, ulnar nerve entrapment. Structural differentiation is critical to confirm neural involvement vs non-neural soft tissue.", "pitfalls": null, "kb_panel_show": 1}, {"id": 152, "name": "Podagra (First MTP Joint Involvement)", "also_known_as": "First metatarsophalangeal joint arthritis", "test_type": "History / Observation", "domain": "subjective", "patient_position": "N/A - patient history and joint examination", "procedure": "Ask: Is the pain at the base of the big toe? Observe for swelling, redness, warmth at first MTP joint.", "positive_finding": "Acute inflammatory arthritis of the first metatarsophalangeal (MTP) joint: severe pain, swelling, erythema, warmth", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Gout; MSD Manual; Geeky Medics", "clinical_notes": "Podagra: initial joint in ~50% of men with gout; eventually involved in ~90% of cases. Bilateral podagra in a single attack is highly specific for gout. First MTP involvement = strongest clinical predictor.", "pitfalls": null, "kb_panel_show": 1}, {"id": 153, "name": "Rapid Onset (< 24 hours to peak intensity)", "also_known_as": "Time course of onset", "test_type": "History", "domain": "subjective", "patient_position": "N/A - patient history", "procedure": "Ask: How quickly did the pain and swelling develop? Did it reach its worst within 24 hours of starting?", "positive_finding": "Pain reaches maximum intensity within 24 hours of onset", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "ACR/EULAR 2015 Classification Criteria; MSD Manual", "clinical_notes": "Rapid time to peak (< 24h) is highly characteristic of crystal arthropathy. Septic arthritis can also be rapid but usually more systemic features.", "pitfalls": null, "kb_panel_show": 1}, {"id": 154, "name": "Spontaneous Resolution within 14 Days", "also_known_as": null, "test_type": "History", "domain": "subjective", "patient_position": "N/A - patient history", "procedure": "Ask: Does/did the pain resolve completely on its own without treatment within 2 weeks?", "positive_finding": "Complete spontaneous resolution of symptoms within 14 days without treatment", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "ACR/EULAR 2015 Classification Criteria", "clinical_notes": "Spontaneous complete resolution is hallmark of gout (and calcium pyrophosphate disease). Persistent arthritis without resolution = less likely gout; consider septic arthritis.", "pitfalls": null, "kb_panel_show": 1}, {"id": 155, "name": "Tophi Identification", "also_known_as": "Subcutaneous Tophi Palpation", "test_type": "Observation / Palpation", "domain": "objective", "patient_position": "Various locations: helix of ear, olecranon bursa, over joints, Achilles tendon", "procedure": "Inspect and palpate classic tophus locations: helix of ear, olecranon, over knuckles, Achilles tendon, first MTP joint.", "positive_finding": "Firm whitish subcutaneous nodule consistent with tophus (urate crystal deposit)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "ACR/EULAR 2015 criteria; Geeky Medics", "clinical_notes": "Tophi = definitive evidence of chronic tophaceous gout. Draining or palpable tophi = maximum diagnostic score in ACR/EULAR 2015. Tophi alone = 100% specificity for MSU crystal disease.", "pitfalls": null, "kb_panel_show": 1}, {"id": 156, "name": "Serum Uric Acid Level", "also_known_as": "Serum Urate Measurement", "test_type": "Laboratory / Biochemical", "domain": "demographic", "patient_position": "Blood draw (outside acute attack preferred)", "procedure": "Measure serum uric acid (urate). Best measured between attacks (not during acute flare as levels may be normal or low).", "positive_finding": "Serum urate > 360 micromol/L (6 mg/dL) consistently on 2 occasions", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "ACR/EULAR 2015 criteria; MSD Manual; ACP 2017 CPG", "clinical_notes": "Important CAVEAT: 30-40% of patients have normal serum urate during acute gout attack. Serum urate alone is neither sensitive nor specific for acute gout. Elevated urate supports diagnosis but absence does not exclude it.", "pitfalls": null, "kb_panel_show": 1}, {"id": 157, "name": "Adam's Forward Bend Test", "also_known_as": "Adams Test / School Forward Bend Test", "test_type": "Observation / Screening", "domain": "objective", "patient_position": "Standing; back exposed; patient bends forward with knees extended", "procedure": "Patient removes shirt. Examiner stands behind patient. Patient bends forward at waist until trunk is horizontal with arms hanging freely, palms pressed together. Examiner observes from behind and from side.", "positive_finding": "Visible rib hump (thoracic) or paraspinal prominence (lumbar) on one side indicating vertebral rotation", "sn": 0.83, "sn_ci": "(Cobb > 40 deg)", "sp": 0.99, "sp_ci": "(Cobb > 40 deg)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": 0.61, "reference": "Physiopedia Adams Forward Bend Test; WikiSM; Spine 1999 Karachalios", "clinical_notes": "Cobb > 40: Sn 0.83, Sp 0.99. Cobb > 10: Sn 84.3%, Sp 93.4% (WikiSM). Thoracic curves Sn 92%, Sp 60%. Lumbar curves Sn 73%, Sp 68%. Better for thoracic than lumbar curves. Functional scoliosis (postural) improves on forward bending; structural scoliosis does not.", "pitfalls": null, "kb_panel_show": 1}, {"id": 158, "name": "Scoliometer Measurement (Angle of Trunk Rotation)", "also_known_as": "ATR / Inclinometer Test", "test_type": "Measurement", "domain": "objective", "patient_position": "Standing; patient in Adam forward bend position", "procedure": "Scoliometer (inclinometer) placed on spine at most prominent area. Record angle of trunk rotation (ATR) in degrees.", "positive_finding": "ATR >= 5-7 degrees = positive (typically triggers referral for X-ray)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "School scoliosis screening guidelines; SOSORT", "clinical_notes": "ATR >= 7 degrees = referral threshold in many screening programs (corresponds approximately to Cobb angle 20 deg). More objective than Adam test alone. Does NOT measure Cobb angle directly.", "pitfalls": null, "kb_panel_show": 1}, {"id": 159, "name": "Mulder's Click Test", "also_known_as": "Mulder's Sign", "test_type": "Provocation", "domain": "objective", "patient_position": "Supine", "procedure": "Examiner places thumb on plantar and index finger on dorsal aspect of the painful intermetatarsal space with local pressure. Opposite hand simultaneously squeezes the metatarsal heads together. Positive if a palpable click is elicited with pain reproduction.", "positive_finding": "Palpable click with reproduction of intermetatarsal pain", "sn": 0.62, "sn_ci": null, "sp": 1.0, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Mahadevan et al. 2015 (vs ultrasonography); Mulder 1951", "clinical_notes": "Sn 62%, Sp 100% vs ultrasonography. Specificity of 100% makes a positive click a strong rule-in for Morton's neuroma.", "pitfalls": "- Requires audible or palpable click \u2014 absent in early or small neuromas | False negative if the neuroma is too small to produce a click | Distinguish from simple lateral metatarsal squeeze (different test, different stats)", "kb_panel_show": 1}, {"id": 160, "name": "Resisted External Derotation Test", "also_known_as": "REDT", "test_type": "Strength / Provocation", "domain": "objective", "patient_position": "Supine with hip in 90\u00b0 flexion at full internal rotation", "procedure": "Examiner resists patient's attempt to externally rotate the hip from the position of 90\u00b0 flexion and full internal rotation", "positive_finding": "Pain reproduced at the lateral hip or greater trochanteric region", "sn": 0.88, "sn_ci": null, "sp": 0.973, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Reiman et al. 2013 Br J Sports Med; Reiman et al. 2015b", "clinical_notes": "Sn 88%, Sp 97.3% for gluteal tendinopathy diagnosis (Reiman 2013, 2015b).", "pitfalls": "- High specificity (97.3%) makes a positive result a strong rule-in | Ensure full internal rotation is achieved before applying resistance | Pain inhibition from severe tendinopathy may limit the resistance effort", "kb_panel_show": 1}, {"id": 161, "name": "Sustained Single-Leg Stance (30s) for GTPS", "also_known_as": "Grimaldi SLS Test", "test_type": "Functional / Provocation", "domain": "objective", "patient_position": "Standing on the affected leg", "procedure": "Patient stands on the affected leg for 30 seconds. Note pain reproduction and hip position \u2014 an adducted stance hip increases compressive load on the gluteal tendon against the greater trochanter.", "positive_finding": "Lateral hip or greater trochanteric pain within 30 seconds; often with hip adducted position", "sn": 1.0, "sn_ci": null, "sp": 0.973, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Grimaldi & Fearon 2015 J Orthop Sports Phys Ther", "clinical_notes": "Sn 100%, Sp 97.3% for gluteal tendinopathy (Grimaldi & Fearon 2015).", "pitfalls": "- Hip must be in adduction (not compensated with pelvic drop) to maximally load the tendon | A medially deviated knee or hip held in neutral abduction may reduce provocation | Deconditioning may make single-leg stance difficult independent of GTPS", "kb_panel_show": 1}], "cluster_test": [{"cluster_id": 1, "test_id": 1, "display_order": 0, "test_name": "Hawkins-Kennedy Test"}, {"cluster_id": 1, "test_id": 2, "display_order": 1, "test_name": "Neer Sign"}, {"cluster_id": 1, "test_id": 3, "display_order": 2, "test_name": "Painful Arc Sign"}, {"cluster_id": 1, "test_id": 4, "display_order": 3, "test_name": "Empty Can Test"}, {"cluster_id": 1, "test_id": 5, "display_order": 4, "test_name": "External Rotation Resistance Test"}, {"cluster_id": 2, "test_id": 3, "display_order": 0, "test_name": "Painful Arc Sign"}, {"cluster_id": 2, "test_id": 5, "display_order": 1, "test_name": "External Rotation Resistance Test"}, {"cluster_id": 2, "test_id": 6, "display_order": 2, "test_name": "Drop-Arm Sign"}, {"cluster_id": 3, "test_id": 1, "display_order": 0, "test_name": "Hawkins-Kennedy Test"}, {"cluster_id": 3, "test_id": 3, "display_order": 1, "test_name": "Painful Arc Sign"}, {"c ctive", "condition_name": "Medial Tibial Stress Syndrome (MTSS)"}, {"id": 1135, "condition_id": 128, "feature_name": "Posteromedial tibia", "feature_value": "Diffuse pain to posteromedial border of tibia at muscle insertions", "feature_domain": "objective", "condition_name": "Medial Tibial Stress Syndrome (MTSS)"}, {"id": 1136, "condition_id": 128, "feature_name": "Timing", "feature_value": "Worse in the morning and after exercise", "feature_domain": "subjective", "condition_name": "Medial Tibial Stress Syndrome (MTSS)"}, {"id": 1137, "condition_id": 128, "feature_name": "Imaging", "feature_value": "MRI may show diffuse oedema and periosteal thickening; X-ray and bone scan often negative", "feature_domain": "objective", "condition_name": "Medial Tibial Stress Syndrome (MTSS)"}, {"id": 1138, "condition_id": 128, "feature_name": "Distinguishing from fracture", "feature_value": "Distinguish from lower leg stress fracture (which is more localised and sharper)", "feature_domain": "objective", "condition_name": "Medial Tibial Stress Syndrome (MTSS)"}, {"id": 1139, "condition_id": 129, "feature_name": "Mechanism", "feature_value": "Direct blow to head, face, neck, or body with impulsive force transmitted to the head", "feature_domain": "history", "condition_name": "Concussion / mTBI"}, {"id": 1140, "condition_id": 129, "feature_name": "LOC", "feature_value": "Loss of consciousness occurs in <10% of sport concussions \u2014 absence does NOT exclude diagnosis", "feature_domain": "history", "condition_name": "Concussion / mTBI"}, {"id": 1141, "condition_id": 129, "feature_name": "Symptom evolution", "feature_value": "Symptoms may evolve over hours \u2014 serial assessment is essential", "feature_domain": "subjective", "condition_name": "Concussion / mTBI"}, {"id": 1142, "condition_id": 129, "feature_name": "Physical symptoms", "feature_value": "Headache, pressure in head, neck pain, nausea/vomiting, dizziness, blurred vision, balance problems, sensitivity to light/noise, fati
