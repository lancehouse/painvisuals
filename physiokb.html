b Joint", "short_name": null, "condition_category": null, "icd_concept": null, "context": null, "reference": null, "display_priority": 99, "region_pab_id": "thoracic", "region_label": "Thoracic Spine"}, {"id": 95, "primary_region_id": 16, "name": "Thoracic Facet", "short_name": null, "condition_category": null, "icd_concept": null, "context": null, "reference": null, "display_priority": 99, "region_pab_id": "thoracic", "region_label": "Thoracic Spine"}, {"id": 96, "primary_region_id": 16, "name": "Thoracic Disc", "short_name": null, "condition_category": null, "icd_concept": null, "context": null, "reference": null, "display_priority": 99, "region_pab_id": "thoracic", "region_label": "Thoracic Spine"}, {"id": 97, "primary_region_id": 16, "name": "Scheuermann's / Structural", "short_name": null, "condition_category": null, "icd_concept": null, "context": null, "reference": null, "display_priority": 99, "region_pab_id": "thoracic", "region_label": "Thoracic Spine"}, {"id": 98, "primary_region_id": 16, "name": "Visceral Referral", "short_name": null, "condition_category": null, "icd_concept": null, "context": null, "reference": null, "display_priority": 99, "region_pab_id": "thoracic", "region_label": "Thoracic Spine"}, {"id": 99, "primary_region_id": 18, "name": "DRUJ Instability", "short_name": null, "condition_category": null, "icd_concept": null, "context": null, "reference": null, "display_priority": 99, "region_pab_id": "wrist", "region_label": "Wrist"}, {"id": 100, "primary_region_id": 18, "name": "Scapholunate Dissociation", "short_name": null, "condition_category": null, "icd_concept": null, "context": null, "reference": null, "display_priority": 99, "region_pab_id": "wrist", "region_label": "Wrist"}, {"id": 101, "primary_region_id": 15, "name": "Glenohumeral Internal Rotation Deficit (GIRD)", "short_name": "GIRD", "condition_category": "Musculoskeletal", "icd_concept": "Glenohumeral internal rotation deficit", "context": "Reduction in glenohumeral internal rotation ROM compared to contralateral, typically due to posterior capsule contracture from high-volume throwing. Associated with posterior shoulder stiffness and altered kinematics. Common in overhead throwing athletes.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "shoulder", "region_label": "Shoulder"}, {"id": 102, "primary_region_id": 5, "name": "Triceps Tendinopathy", "short_name": "Triceps Tendinopathy", "condition_category": "Musculoskeletal", "icd_concept": "Triceps tendinopathy / insertional tendinopathy", "context": "Overuse or repetitive strain injury to triceps tendon, typically at olecranon insertion. History of high load or change in loads. Gradual onset. Distinguish from olecranon bursitis (different tissue, different location).", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "elbow", "region_label": "Elbow"}, {"id": 103, "primary_region_id": 5, "name": "Posterior Elbow Impingement", "short_name": "Posterior Impingement", "condition_category": "Musculoskeletal", "icd_concept": "Posterior elbow impingement / olecranon impingement", "context": "Impingement of posterior medial olecranon tip on the olecranon fossa due to repetitive hyperextension and valgus stress. Leads to osteophyte formation over time. Common in throwing athletes (younger) and OA (older).", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "elbow", "region_label": "Elbow"}, {"id": 104, "primary_region_id": 3, "name": "Whiplash Associated Disorder (WAD)", "short_name": "WAD", "condition_category": "Musculoskeletal", "icd_concept": "Whiplash associated disorder", "context": "Clinical presentations can be varied. Onset is the major distinguishable factor \u2014 typically MVA with rapid acceleration/deceleration. Consider psychosocial factors (often associated with PTSD) as predictors of poor prognosis.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "cervical", "region_label": "Cervical Spine"}, {"id": 105, "primary_region_id": 16, "name": "T4 Syndrome", "short_name": "T4 Syndrome", "condition_category": "Musculoskeletal", "icd_concept": "T4 syndrome / upper thoracic sympathetic dysfunction", "context": "Believed that sympathetic NS activation contributes to symptoms. Diffuse arm pain with bilateral paraesthesia or numbness in the hands. Headache. Hypomobility of upper to mid thoracic segments. Forward head posture and shoulder protraction.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "thoracic", "region_label": "Thoracic Spine"}, {"id": 106, "primary_region_id": 16, "name": "Rib Fracture / Contusion", "short_name": "Rib Fracture", "condition_category": "Musculoskeletal", "icd_concept": "Rib fracture / costal injury", "context": "Requires direct trauma. Can result in bruising, undisplaced or displaced fracture, or costal cartilage displacement. Pain on deep inspiration. Shallow breathing common early due to inspiratory pain. X-ray detects fracture.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "thoracic", "region_label": "Thoracic Spine"}, {"id": 107, "primary_region_id": 12, "name": "Reducible Discogenic Pain (RDP)", "short_name": "RDP", "condition_category": "Musculoskeletal", "icd_concept": "Discogenic low back pain \u2014 centralising pattern", "context": "Discogenic pain with \u22654 of the STOPs aggravating factors (sitting, forward bend, lifting, sit-to-stand, cough/sneeze, worse in morning, history of manual handling) where pain REDUCES with mechanical loading strategies (most commonly extension in lying \u00b1 ipsilateral side glide). Above-knee pain only. No neurological deficit.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "lumbar", "region_label": "Lumbar Spine"}, {"id": 108, "primary_region_id": 12, "name": "Non-Reducible Discogenic Pain (NRD)", "short_name": "NRD", "condition_category": "Musculoskeletal", "icd_concept": "Discogenic low back pain \u2014 non-centralising", "context": "Same aggravating factor profile as RDP (\u22654 STOPs factors) but pain does NOT reduce with mechanical loading strategies. May represent a more sensitised or chemically irritated disc. No neurological deficit.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "lumbar", "region_label": "Lumbar Spine"}, {"id": 109, "primary_region_id": 12, "name": "Multi-factorial Persistent Low Back Pain", "short_name": "Persistent LBP", "condition_category": "Musculoskeletal", "icd_concept": "Chronic non-specific low back pain / central sensitisation", "context": "Poorly localised diffuse pain; pain disproportionate to injury and aggravating factors; lacks predictable mechanical pattern (mixture or inconsistent across DHR/RDP/NRD/Z-joint subgroups); often associated with hyperalgesia or allodynia; \u00d6rebro score >105/210 raises suspicion (not diagnostic). Biopsychosocial contributors are common.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "lumbar", "region_label": "Lumbar Spine"}, {"id": 110, "primary_region_id": 12, "name": "Vertebral Endplate Oedema (Modic Changes)", "short_name": "Modic Changes", "condition_category": "Musculoskeletal", "icd_concept": "Vertebral endplate oedema / Modic changes", "context": "Graded based on degree of changes. Generally presents with persistent severe and disabling localised pain. Pain usually constant (both at rest and at night). Exacerbated with loading and movement. Often occurs in combination with disc-based pathology. MRI shows oedema of vertebral endplate proximal to degenerate disc.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "lumbar", "region_label": "Lumbar Spine"}, {"id": 111, "primary_region_id": 12, "name": "Spondylolisthesis", "short_name": "Spondylolisthesis", "condition_category": "Musculoskeletal", "icd_concept": "Lumbar spondylolisthesis", "context": "Anterior slip of one vertebra on another. Graded I (<25%) to IV (>75%). Back pain with or without leg pain depending on grade and foraminal narrowing. Can co-exist with disc herniation. Large portion are asymptomatic \u2014 presence on imaging is not highly predictive of LBP.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "lumbar", "region_label": "Lumbar Spine"}, {"id": 112, "primary_region_id": 12, "name": "Spondylolysis / Pars Fracture", "short_name": "Spondylolysis", "condition_category": "Musculoskeletal", "icd_concept": "Spondylolysis / pars interarticularis stress fracture", "context": "Fractures to posterior vertebral arch (pars interarticularis, pedicle, lamina). Active stress fractures develop progressively with repeated loading in active teenagers. History of trunk rotation + extension + lateral flexion activities. Can persist as asymptomatic chronic non-united defects.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "lumbar", "region_label": "Lumbar Spine"}, {"id": 113, "primary_region_id": 10, "name": "Proximal Hamstring Tendinopathy", "short_name": "Proximal HS Tendinopathy", "condition_category": "Musculoskeletal", "icd_concept": "Proximal hamstring tendinopathy / ischial tendinopathy", "context": "High levels of activity or change in load leading to overload. Localised pain at ischial tuberosity and proximal hamstring tendon. Sitting on firm chairs increases pain (compressive load). Aggravated by squats, deadlifts, lunges, hill walking/running, stair climbing.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 114, "primary_region_id": 10, "name": "Piriformis Syndrome / Deep Gluteal Syndrome", "short_name": "Piriformis Syndrome", "condition_category": "Musculoskeletal", "icd_concept": "Piriformis syndrome / sciatic nerve entrapment in deep gluteal space", "context": "Mechanical compression of the sciatic nerve via the piriformis muscle. Aggravated by repeated hip flexion, IR, and adduction. Pain localised to mid-buttock, characterised as deep and diffuse \u2014 can refer into posterior thigh. Worse with sitting. Controversial/debated diagnosis.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 115, "primary_region_id": 10, "name": "Adductor-Related Groin Pain", "short_name": "Adductor Groin Pain", "condition_category": "Musculoskeletal", "icd_concept": "Adductor-related groin pain / adductor tendinopathy", "context": "Most common reason for longstanding groin pain. Predominantly affects adductor longus (also contributes to hip flexion). Pain medially at insertion on pubic bone. Sprinting, kicking, and cutting sports most susceptible. Longstanding pattern: presents late during/after exercise.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 116, "primary_region_id": 10, "name": "Pubic-Related Groin Pain / Osteitis Pubis", "short_name": "Pubic Groin Pain", "condition_category": "Musculoskeletal", "icd_concept": "Pubic-related groin pain / osteitis pubis", "context": ">6 weeks groin pain in adductor or pubic bone region. Present during and after sport/loading. Tenderness over pubic symphysis and adjacent bone. Pain with squeeze test (suggestive but not DD). Bone marrow oedema on MRI distinguishes from adductor tendinopathy.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 117, "primary_region_id": 11, "name": "Iliotibial Band Syndrome", "short_name": "ITBS", "condition_category": "Musculoskeletal", "icd_concept": "Iliotibial band syndrome / compression syndrome", "context": "Compressive symptom production from ITB over lateral femoral epicondyle (LFE) \u2014 likely source of nociceptive pain. Common in runners, cyclists, and endurance athletes. Unlikely in sedentary populations. Often develops at same distance/time during endurance activity.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 118, "primary_region_id": 11, "name": "Knee Osteoarthritis", "short_name": "Knee OA", "condition_category": "Musculoskeletal", "icd_concept": "Knee osteoarthritis", "context": "Symptomatic presentations generally in >60 YO. Pain with activity; swelling and grinding. Morning stiffness and night pain in later stages. Pain after periods of rest. May present as lateral or medial compartment OA. Often difficult to DD from degenerative meniscus \u2014 can co-exist.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 119, "primary_region_id": 11, "name": "Baker's Cyst", "short_name": "Baker's Cyst", "condition_category": "Musculoskeletal", "icd_concept": "Baker's cyst / popliteal cyst", "context": "Chronic knee joint effusion herniated between two heads of gastrocnemius. Usually secondary to intra-articular pathology (meniscal tear, OA). Palpable swollen and tender mass over posterior medial joint line. Always assess for underlying intra-articular cause.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 120, "primary_region_id": 11, "name": "Pre-Patellar Bursitis", "short_name": "Pre-Patellar Bursitis", "condition_category": "Musculoskeletal", "icd_concept": "Pre-patellar bursitis / housemaid's knee", "context": "Common in those who kneel a lot. Superficial swelling of anterior knee over pre-patellar bursa. Differentiate from joint effusion. Often responds to NSAIDs.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 121, "primary_region_id": 11, "name": "Fat Pad Impingement (Knee)", "short_name": "Fat Pad Impingement", "condition_category": "Musculoskeletal", "icd_concept": "Infrapatellar fat pad impingement / Hoffa's syndrome", "context": "Fat pad compressed under the patella. Often aggravated by hyperextension mechanism or trauma to anterior knee. Aggravated by sustained knee extension activities (SLR, prolonged standing). Puffiness to anterior knee. Pain inferior to patella but deep to tendon.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 122, "primary_region_id": 11, "name": "Patellar Dislocation / Subluxation", "short_name": "Patellar Dislocation", "condition_category": "Musculoskeletal", "icd_concept": "Patellar dislocation / subluxation", "context": "Patella displaced laterally. Can be full dislocation or recurrent subluxation. Pain with twisting or jumping; knee giving way; sensation of something \"popping out\". Immediate swelling. Pain and apprehension with lateral patellar glides. Large effusion and tenderness over medial border of patella.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 123, "primary_region_id": 2, "name": "Achilles Tendon Rupture", "short_name": "Achilles Rupture", "condition_category": "Musculoskeletal", "icd_concept": "Achilles tendon rupture", "context": "Mostly between 30-50 YO. Acute or sudden incident. Audible noise or feeling like kicked in the tendon. Positive squeeze test (no ankle plantarflexion on calf squeeze). Inability to calf raise SL. Weakness or inability to plantarflex ankle against resistance. Emergency assessment if suspected.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 124, "primary_region_id": 2, "name": "Tibialis Posterior Tendinopathy", "short_name": "TP Tendinopathy", "condition_category": "Musculoskeletal", "icd_concept": "Tibialis posterior tendinopathy / PTTD", "context": "Largest and most anterior structure passing behind medial malleolus. Normally related to overuse. Comes on slowly. Medial malleolus pain extending to medial midfoot. Excessive subtalar pronation. Pain and weakness with resisted inversion. Pain with heel raise and lack of hindfoot inversion.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 125, "primary_region_id": 2, "name": "Sinus Tarsi Syndrome", "short_name": "Sinus Tarsi Syndrome", "condition_category": "Musculoskeletal", "icd_concept": "Sinus tarsi syndrome", "context": "Influx of inflammatory cells into the sinus tarsi (anterior and inferior to lateral malleolus) after single or repeated ankle inversion injury. Poorly localised vague lateral malleolus pain. Full pain-free ROM at ankle (distinguishes from ligament injury). Morning pain worse that eases with movement.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 126, "primary_region_id": 2, "name": "Flexor Hallucis Longus Tendinopathy", "short_name": "FHL Tendinopathy", "condition_category": "Musculoskeletal", "icd_concept": "Flexor hallucis longus tendinopathy", "context": "Most posterior tendon running behind medial malleolus. Overuse or secondary to inflammation. Common in ballet dancers (repeated raising up and down on toes). Acute tears rare. Pain with toe-off in gait, landing from jumps. Aggravated by resisted flexion of ankle and big toe.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 127, "primary_region_id": 2, "name": "Ankle Anterior Impingement", "short_name": "Anterior Impingement", "condition_category": "Musculoskeletal", "icd_concept": "Anterior ankle impingement / osteophytic impingement", "context": "Soft or bony tissue (osteophytes) trapped between tibia and talus during dorsiflexion. Previous history of ankle trauma increases risk. Starts as vague discomfort, progressively becomes sharper and more localised anteriorly. Progressive restriction of DF ROM.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 128, "primary_region_id": 2, "name": "Medial Tibial Stress Syndrome (MTSS)", "short_name": "MTSS / Shin Splints", "condition_category": "Musculoskeletal", "icd_concept": "Medial tibial stress syndrome / shin splints", "context": "Variable intensity pain. Eases as warm up or stretch. Diffuse pain to posteromedial border of tibia at muscle insertions. Worse in the morning and after exercise. MRI may show diffuse oedema and periosteal thickening.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 129, "primary_region_id": 4, "name": "Concussion / mTBI", "short_name": "Concussion", "condition_category": "Neurological", "icd_concept": "Concussion / mild traumatic brain injury (mTBI)", "context": "Traumatic brain injury induced by biomechanical forces \u2014 direct blow to head, face, neck, or body with impulsive force transmitted to the head. Results in neurometabolic cascade causing functional disturbance rather than structural injury. Standard neuroimaging typically normal. Diagnosis is clinical.", "reference": "Patricios et al. 6th International Consensus on Concussion in Sport, BJSM 2023", "display_priority": 1, "region_pab_id": "concussion", "region_label": "Concussion"}, {"id": 130, "primary_region_id": 4, "name": "Persistent Post-Concussive Symptoms (PPCS)", "short_name": "PPCS", "condition_category": "Neurological", "icd_concept": "Persistent post-concussive symptoms", "context": "Symptoms persisting beyond expected recovery timeframe \u2014 >28 days in adults, >4 weeks in children. Occurs in 16\u201333% of individuals. Requires formal SCOAT6 evaluation and MDT referral.", "reference": "Patricios et al. 2023; Ontario Neurotrauma Foundation Living Concussion Guidelines 2023", "display_priority": 2, "region_pab_id": "concussion", "region_label": "Concussion"}, {"id": 131, "primary_region_id": 4, "name": "Concussion \u2014 Cervicogenic Subtype", "short_name": "SRC Cervicogenic", "condition_category": "Neurological", "icd_concept": "Concussion with cervicogenic component", "context": "Neck pain and cervicogenic headache reproduced by cervical provocation testing. Restricted AROM. First-line physiotherapy \u2014 cervical manual therapy and exercise have strong evidence. Positive FRT and cervical segmental palpation.", "reference": "Patricios et al. 2023; UPMC/TEAM Framework", "display_priority": 3, "region_pab_id": "concussion", "region_label": "Concussion"}, {"id": 132, "primary_region_id": 4, "name": "Concussion \u2014 Vestibular Subtype", "short_name": "SRC Vestibular", "condition_category": "Neurological", "icd_concept": "Concussion with vestibular dysfunction", "context": "Dizziness, imbalance, nystagmus; positive Dix-Hallpike if BPPV component. First-line physiotherapy \u2014 vestibular rehab including BPPV repositioning, VOR training, and gaze stabilisation.", "reference": "Patricios et al. 2023; UPMC/TEAM Framework", "display_priority": 4, "region_pab_id": "concussion", "region_label": "Concussion"}, {"id": 133, "primary_region_id": 4, "name": "Concussion \u2014 Ocular/Visual Subtype", "short_name": "SRC Ocular", "condition_category": "Neurological", "icd_concept": "Concussion with ocular motor dysfunction", "context": "Convergence insufficiency (NPC >5 cm), saccade errors, smooth pursuit deficits. Co-manage with optometrist/vision therapist. VOMS screening recommended.", "reference": "Patricios et al. 2023; VOMS protocol", "display_priority": 5, "region_pab_id": "concussion", "region_label": "Concussion"}, {"id": 134, "primary_region_id": 4, "name": "Concussion \u2014 Cognitive/Fatigue Subtype", "short_name": "SRC Cognitive", "condition_category": "Neurological", "icd_concept": "Concussion with cognitive impairment and fatigue", "context": "Brain fog, memory problems, fatigue, slowed processing. Management: graded cognitive load, academic/workplace accommodation, energy management and pacing.", "reference": "Patricios et al. 2023; UPMC/TEAM Framework", "display_priority": 6, "region_pab_id": "concussion", "region_label": "Concussion"}, {"id": 135, "primary_region_id": 4, "name": "Post-Traumatic Migraine (Concussion)", "short_name": "SRC Post-Traumatic Migraine", "condition_category": "Neurological", "icd_concept": "Post-traumatic migraine / concussion headache", "context": "Throbbing headache with photo/phonophobia and nausea following concussion. Most common headache subtype post-concussion. Avoid migraine triggers; co-manage with physician. Distinct from cervicogenic subtype by throbbing quality and nausea.", "reference": "Patricios et al. 2023; UPMC/TEAM Framework", "display_priority": 7, "region_pab_id": "concussion", "region_label": "Concussion"}, {"id": 136, "primary_region_id": 4, "name": "Concussion \u2014 Autonomic / Exercise Intolerance Subtype", "short_name": "SRC Autonomic", "condition_category": "Neurological", "icd_concept": "Concussion with autonomic dysfunction / exercise intolerance", "context": "Symptom exacerbation with exertion; orthostatic intolerance. Buffalo Concussion Treadmill Test (BCTT) establishes symptom threshold heart rate. Sub-threshold aerobic exercise prescription is first-line treatment.", "reference": "Patricios et al. 2023; BCTT protocol", "display_priority": 8, "region_pab_id": "concussion", "region_label": "Concussion"}, {"id": 137, "primary_region_id": 4, "name": "Concussion \u2014 Anxiety / Mood Subtype", "short_name": "SRC Anxiety/Mood", "condition_category": "Neurological", "icd_concept": "Concussion with mood / anxiety disorder", "context": "Anxiety, fear-avoidance, mood disturbance, depression. PHQ-9 \u226510 = moderate depression; GAD-7 \u226510 = moderate anxiety; TSK >37 = high kinesiophobia. Psychoeducation, graded activity, co-manage with psychology.", "reference": "Patricios et al. 2023; UPMC/TEAM Framework", "display_priority": 9, "region_pab_id": "concussion", "region_label": "Concussion"}, {"id": 138, "primary_region_id": 4, "name": "Concussion \u2014 Sleep Subtype", "short_name": "SRC Sleep", "condition_category": "Neurological", "icd_concept": "Concussion with sleep disturbance", "context": "Insomnia, hypersomnia, circadian disruption. Sleep hygiene education, activity pacing. Refer if persistent. Sleep disruption contributes to slowed recovery across all other subtypes.", "reference": "Patricios et al. 2023; UPMC/TEAM Framework", "display_priority": 10, "region_pab_id": "concussion", "region_label": "Concussion"}, {"id": 139, "primary_region_id": 10, "name": "Hip Chondropathy", "short_name": "Hip Chondropathy", "condition_category": "Musculoskeletal", "icd_concept": "Chondral lesion / early hip OA", "context": "Progressive degeneration of hip joint cartilage \u2014 most often co-occurs with intra-articular hip pathology (labral tears, FAI, synovitis). Chondral loss worsened by co-existing labral tears and inflammation. Full extent of chondroplasty typically only identified at arthroscopy.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 140, "primary_region_id": 10, "name": "Hip Synovitis", "short_name": "Hip Synovitis", "condition_category": "Musculoskeletal", "icd_concept": "Hip joint synovitis / reactive synovitis", "context": "Rarely seen as a primary entity \u2014 most often co-occurs with other intra-articular hip pathology (FAI, labral tears, ligament teres tears, chondropathy). No specific objective measures provide a differential diagnosis for synovitis alone. MRI required.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 141, "primary_region_id": 10, "name": "Ligament Teres Tear", "short_name": "Lig Teres Tear", "condition_category": "Musculoskeletal", "icd_concept": "Hip ligamentum teres tear", "context": "70% of ligament teres tears are associated with co-existing labral tears, FAI, dysplasia, or synovitis. More common in gymnasts and dancers requiring high ROM. Mechanism involves forced flexion and adduction \u00b1 IR/ER. No clear differential diagnostic tests. MRI required.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 142, "primary_region_id": 10, "name": "Hip Joint Instability", "short_name": "Hip Instability", "condition_category": "Musculoskeletal", "icd_concept": "Glenohumeral-type hip instability / hip hypermobility", "context": "Can be seen with hip dysplasia or as localised directional instability with cam-type FAI, ligament teres tears, or anterior capsular insufficiency. No consistent clinical tests for accurate diagnosis. Common in dancers and gymnasts requiring extreme ROM.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 143, "primary_region_id": 10, "name": "Stress Fracture (Neck of Femur)", "short_name": "NOF Stress Fracture", "condition_category": "Musculoskeletal", "icd_concept": "Femoral neck stress fracture", "context": "High-risk stress fracture \u2014 gradual onset with high level of activity. Minimal objective findings that specifically diagnose. Pain at extremes of hip movement especially IR. Bone scan and MRI most sensitive tests. Requires urgent referral if suspected due to risk of complete fracture.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 144, "primary_region_id": 10, "name": "Slipped Capital Femoral Epiphysis (SCFE)", "short_name": "SCFE", "condition_category": "Musculoskeletal", "icd_concept": "Slipped capital femoral epiphysis", "context": "Paediatric condition \u2014 most common age 12\u201315 years. High BMI is a risk factor. The capital femoral epiphysis slips posteriorly and inferiorly on the femoral neck. Do not attempt manipulation. Emergency X-ray/CT/MRI required.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 145, "primary_region_id": 10, "name": "Perthes Disease", "short_name": "Perthes Disease", "condition_category": "Musculoskeletal", "icd_concept": "Perthes disease / Legg-Calv\u00e9-Perthes", "context": "Osteochondritis affecting femoral head and epiphysis in children aged 4\u201310 years. Results in avascular necrosis of the femoral head with subsequent flattening. Unilateral hip or referred knee pain with reduced ROM.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 146, "primary_region_id": 10, "name": "Hamstring Strain / Tear", "short_name": "Hamstring Strain", "condition_category": "Musculoskeletal", "icd_concept": "Hamstring muscle strain or tear", "context": "Type 1: high-speed running \u2014 during deceleration. Type 2: activities causing extensive lengthening in hip flexion (kicking, splits). Biceps femoris most common (83%). Acute recollection of injury with immediate pain. Prior hamstring tears are a significant risk factor for re-injury.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 147, "primary_region_id": 10, "name": "Myofascial Buttock Pain", "short_name": "Myofascial Buttock", "condition_category": "Musculoskeletal", "icd_concept": "Myofascial buttock pain / gluteal myofascial pain syndrome", "context": "Secondary to overload of the gluteal region from hip extension-based activities. Presents with localised gluteal pain and biomechanical deficits. Differential from SIJ and piriformis syndrome by lack of neural symptoms and response to gluteal loading tests.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 148, "primary_region_id": 10, "name": "Inguinal Hernia", "short_name": "Inguinal Hernia", "condition_category": "Musculoskeletal", "icd_concept": "Inguinal hernia \u2014 symptomatic or asymptomatic", "context": "Can present as asymptomatic or symptomatic. Pain with exertion (lifting) and characteristic dragging sensation. Aggravated by cough. A palpable hernia may or may not be present. Requires surgical review.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 149, "primary_region_id": 10, "name": "Obturator Neuropathy / Nerve Entrapment", "short_name": "Obturator Neuropathy", "condition_category": "Neurological", "icd_concept": "Obturator nerve entrapment / neuropathy", "context": "Exercise-related groin pain starting proximally and radiating to distal/medial thigh with continued activity. Minimal findings at rest \u2014 requires provocative exercise testing. Needle EMG identifies chronic denervation patterns of adductors.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 150, "primary_region_id": 10, "name": "Inferior Pubic Ramus Stress Fracture", "short_name": "Pubic Ramus Fracture", "condition_category": "Musculoskeletal", "icd_concept": "Inferior pubic ramus stress fracture", "context": "Overuse stress fracture of the inferior pubic ramus. Differs from adductor tendinopathy \u2014 not aggravated by adductor stretch or resisted adduction. Risk factors include osteoporosis, low aerobic fitness, nutritional deficiency.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "hip", "region_label": "Hip"}, {"id": 151, "primary_region_id": 11, "name": "Articular Cartilage Injury (Knee)", "short_name": "Articular Cartilage", "condition_category": "Musculoskeletal", "icd_concept": "Knee articular cartilage injury / chondral lesion", "context": "Classified by depth \u2014 superficial (indentations/fissures), <50% depth, >50% depth, full thickness. Usually involves acute trauma and co-occurs with ligament or meniscal injuries. Recurrent pain and swelling after activity. CT or MRI for grading.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 152, "primary_region_id": 11, "name": "Tibial Plateau Fracture", "short_name": "Tibial Plateau Fracture", "condition_category": "Musculoskeletal", "icd_concept": "Tibial plateau fracture", "context": "High-energy injury \u2014 high-speed mechanisms or falls. Severe pain with weight-bearing or inability to weight bear. Inability to weight bear is the strongest objective sign. Must be considered and excluded in most acute knee injuries from significant mechanism.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 153, "primary_region_id": 11, "name": "Superior Tibiofibular Joint Injury", "short_name": "Superior TFJ Injury", "condition_category": "Musculoskeletal", "icd_concept": "Superior tibiofibular joint injury", "context": "Occurs due to direct blow to the joint. Pain localised to the tibiofibular joint with local tenderness. Some minor anteroposterior instability although difficult to detect clinically. MRI not routinely required.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 154, "primary_region_id": 11, "name": "Patellar Tendon Rupture", "short_name": "Patellar Tendon Rupture", "condition_category": "Musculoskeletal", "icd_concept": "Patellar tendon rupture", "context": "Occurs during sudden severe eccentric contraction of quadriceps \u2014 take-off injury. Previous corticosteroid injection into tendon and prior patellar tendinopathy are significant risk factors. SLR with fully extended knee unable to be initiated.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 155, "primary_region_id": 11, "name": "Pre-Patellar Bursal Haematoma", "short_name": "Bursal Haematoma (Knee)", "condition_category": "Musculoskeletal", "icd_concept": "Pre-patellar bursal haematoma", "context": "Bleeding and inflammation into the pre-patellar bursa following a direct fall onto the knee. Significant inflammatory response evident. May have skin abrasion. Requires screening for infection (septic bursitis).", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 156, "primary_region_id": 11, "name": "Ruptured Hamstring Tendon (Knee)", "short_name": "Hamstring Tendon Rupture", "condition_category": "Musculoskeletal", "icd_concept": "Distal hamstring tendon rupture at the knee", "context": "Usually occurs during sprinting. Localised pain to biceps femoris or semitendinosus tendon at the knee. Pain and weakness with resisted hamstring contraction. US or MRI.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 157, "primary_region_id": 11, "name": "Quadriceps Strain / Tear", "short_name": "Quad Strain", "condition_category": "Musculoskeletal", "icd_concept": "Quadriceps muscle strain or tear", "context": "Non-contact mechanism during sprinting, jumping, or kicking \u2014 generally during deceleration phase. Most common in mid to distal muscle belly of rectus femoris. Loss of strength with resisted knee extension.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 158, "primary_region_id": 11, "name": "Quadriceps Contusion", "short_name": "Quad Contusion", "condition_category": "Musculoskeletal", "icd_concept": "Quadriceps contusion / corked thigh", "context": "Blunt direct trauma causing bleeding between disrupted muscle fibres. Immediate pain. No loss of strength \u2014 only pain inhibition. More severe contusions limit passive knee flexion. Risk of myositis ossificans with aggressive deep tissue massage in first 2\u20133 weeks.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 159, "primary_region_id": 11, "name": "Myositis Ossificans", "short_name": "Myositis Ossificans", "condition_category": "Musculoskeletal", "icd_concept": "Myositis ossificans / heterotopic ossification post-contusion", "context": "Calcification of haematoma after severe contusion. Requires clearly recalled contusion. Bone growth continues until 6\u20137 weeks. Deep tissue massage in first 2\u20133 weeks may worsen outcomes. Plain radiograph confirms ossification after 6\u20137 weeks.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 160, "primary_region_id": 11, "name": "Compartment Syndrome (Thigh)", "short_name": "Compartment Syndrome Thigh", "condition_category": "Musculoskeletal", "icd_concept": "Compartment syndrome of the thigh \u2014 acute", "context": "Intramuscular haematoma after severe contusion increasing intracompartmental pressure. History of direct trauma. Reduced knee flexion, pain inhibition with thigh contraction, and potential sensory loss if severe. Urgent referral if suspected.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "knee", "region_label": "Knee"}, {"id": 161, "primary_region_id": 2, "name": "Deltoid Ligament Injury", "short_name": "Deltoid Lig Injury", "condition_category": "Musculoskeletal", "icd_concept": "Medial ankle deltoid ligament injury", "context": "Less common than lateral ligament injury. Forced eversion mechanism via direct trauma to lateral aspect of foot/ankle. Swelling and bruising medially. Signs of subtalar subluxation in complete lesions. MRI to assess grade and exclude associated fractures.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 162, "primary_region_id": 2, "name": "AITFL Injury (High Ankle Sprain)", "short_name": "AITFL Injury", "condition_category": "Musculoskeletal", "icd_concept": "Anterior inferior tibiofibular ligament injury / syndesmosis injury", "context": "Same mechanism as lateral ligament injury but the tear is biased to the anterior aspect of the tibiofibular ligament. Pain is above the ankle joint line at syndesmotic level. Squeeze test and external rotation stress test positive. Takes significantly longer to heal than lateral sprain.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 163, "primary_region_id": 2, "name": "Tibialis Anterior Tendinopathy", "short_name": "TA Tendinopathy", "condition_category": "Musculoskeletal", "icd_concept": "Tibialis anterior tendinopathy", "context": "Overuse of ankle dorsiflexors often due to restricted or stiff ankle joint. Activities involving running, walking uphill, or stairs. Pain with tight shoes over the dorsal tendon. Pain on resisted dorsiflexion and eccentric inversion. Localised TOP over anterior joint line.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 164, "primary_region_id": 2, "name": "Medial Malleolus Fracture", "short_name": "Medial Malleolus #", "condition_category": "Musculoskeletal", "icd_concept": "Medial malleolus fracture", "context": "Traumatic injury \u2014 sports, falls, or MVA. Mechanisms can replicate medial ligament tear \u2014 must differentiate. Ottawa Ankle Rules: bone tenderness in the malleolar zone and inability to weight bear 4 steps.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 165, "primary_region_id": 2, "name": "Lateral Malleolus Fracture", "short_name": "Lateral Malleolus #", "condition_category": "Musculoskeletal", "icd_concept": "Lateral malleolus fracture", "context": "Traumatic injury. Mechanisms can replicate lateral ligament tear \u2014 must exclude fracture via Ottawa Ankle Rules. Local tenderness over lateral malleolus or base of 5th metatarsal.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 166, "primary_region_id": 2, "name": "Gastrocnemius Strain / Tear", "short_name": "Gastrocnemius Strain", "condition_category": "Musculoskeletal", "icd_concept": "Gastrocnemius muscle strain or tear", "context": "Injured during sudden acceleration from stationary (bent knee + dorsiflexed ankle) or sudden overstretching (going up stairs with sudden ankle drop into dorsiflexion). Local tenderness at muscle belly with bruising and swelling.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 167, "primary_region_id": 2, "name": "Soleus Strain", "short_name": "Soleus Strain", "condition_category": "Musculoskeletal", "icd_concept": "Soleus muscle strain", "context": "Sudden onset. Walking and jogging often more painful than sprinting (lower speed loading pattern). Deep posterior lower leg pain. Pain with soleus stretch (dorsiflexion with bent knee) and resisted plantarflexion with bent knee.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 168, "primary_region_id": 2, "name": "Severs Disease / Calcaneal Apophysitis", "short_name": "Severs Disease", "condition_category": "Musculoskeletal", "icd_concept": "Severs disease / calcaneal apophysitis", "context": "Insertional enthesopathy of Achilles tendon in adolescents during growth periods. Pain at calcaneal insertion \u2014 distinguishes from mid-portion Achilles tendinopathy. Self-limiting condition. Heel raise relieves symptoms.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 169, "primary_region_id": 2, "name": "Chronic Exertional Compartment Syndrome", "short_name": "CECS", "condition_category": "Musculoskeletal", "icd_concept": "Chronic exertional compartment syndrome \u2014 lower leg", "context": "Anterior and lateral compartments most common. No pain at rest \u2014 only with exercise. Pain builds gradually (typically 10\u201315 min into activity) then resolves with rest. Gold standard diagnosis is intracompartmental pressure measurement during/after exercise.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 170, "primary_region_id": 2, "name": "Lower Leg Stress Fracture", "short_name": "Lower Leg Stress #", "condition_category": "Musculoskeletal", "icd_concept": "Lower leg stress fracture \u2014 tibia or fibula", "context": "Most common in the tibia among endurance athletes on hard surfaces. Acute or sharp pain worsening with repetitive impact. Localised bone tenderness. Radiographs may be negative early \u2014 MRI or isotopic bone scan more sensitive.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "ankle", "region_label": "Ankle"}, {"id": 171, "primary_region_id": 15, "name": "Clavicle Fracture", "short_name": "Clavicle Fracture", "condition_category": "Musculoskeletal", "icd_concept": "Clavicle fracture", "context": "Requires direct trauma \u2014 fall onto point of shoulder or direct contact to clavicle. Middle third is the most common fracture site. Localised tenderness along clavicle; bony deformity may be visible or palpable. X-ray confirms.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "shoulder", "region_label": "Shoulder"}, {"id": 172, "primary_region_id": 5, "name": "Medial Collateral Ligament (Elbow) Injury", "short_name": "MCL Elbow Injury", "condition_category": "Musculoskeletal", "icd_concept": "Elbow medial collateral ligament sprain/rupture", "context": "Throwing-based sports injury \u2014 high valgus stress. Can be gradual (repetitive) or acute (sudden pop). Pain on medial joint line. Valgus stress test positive. Fixed flexion deformity can develop with repetitive trauma.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "elbow", "region_label": "Elbow"}, {"id": 173, "primary_region_id": 5, "name": "Radio-Humeral Bursitis", "short_name": "Radio-Humeral Bursitis", "condition_category": "Musculoskeletal", "icd_concept": "Radio-humeral bursitis", "context": "Much less common than lateral epicondylalgia. Lateral elbow pain localised to radio-humeral joint and distal to lateral epicondyle over the radial head. Distinguished from lateral epicondylalgia by site of palpable pain and imaging. More common in chronic presentations.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "elbow", "region_label": "Elbow"}, {"id": 174, "primary_region_id": 16, "name": "Thoracic Postural Syndrome", "short_name": "Thoracic Postural Syndrome", "condition_category": "Musculoskeletal", "icd_concept": "Thoracic postural syndrome / postural imbalance", "context": "Postural imbalances resulting in altered loading of thoracic spine and rib articulations. Can be primary or secondary \u2014 co-existing with or as symptom of many thoracic spine and rib presentations. Key muscle imbalances as below.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "thoracic", "region_label": "Thoracic Spine"}, {"id": 175, "primary_region_id": 15, "name": "Rotator Cuff Strain", "short_name": "RC Strain", "condition_category": "Musculoskeletal", "icd_concept": "Rotator cuff muscle strain \u2014 without macroscopic tear", "context": "Overloading or stretching of rotator cuff muscle or tendon without associated macroscopic tear. Sudden onset pain or twinge in the shoulder with variable functional limitation. Key differentiating feature: responds relatively quickly to rest from aggravating factors, stretching, and soft tissue therapy \u2014 much faster than a tear or tendinopathy. Testing is similar to a tear but weakness is usually absent or minor. Imaging not required.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "shoulder", "region_label": "Shoulder"}, {"id": 176, "primary_region_id": 3, "name": "Acute Wry Neck", "short_name": "Acute Wry Neck", "condition_category": "Musculoskeletal", "icd_concept": "Acute wry neck / acute torticollis", "context": "Acute-onset unilateral or central neck pain with protective muscle spasm. Associated with sustained postures (often upon waking) or a sudden unguarded movement. Two subtypes: disc-related (pain worse with flexion, central TOP over spinous processes, may have guarding) and facet-related (pain worse with ipsilateral LF + extension, unilateral TOP over facets, protective contralateral lateral flexion posture). Neither requires imaging in the absence of red flags.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "cervical", "region_label": "Cervical Spine"}, {"id": 177, "primary_region_id": 5, "name": "Referred Pain to Elbow (Cervical / Thoracic Spine)", "short_name": "Elbow Referred Pain", "condition_category": "Musculoskeletal", "icd_concept": "Somatic referred pain to the elbow from cervical or upper thoracic spine", "context": "Common cause of lateral elbow pain \u2014 somatic referral from the cervical spine (C5-6 facets most common) or upper thoracic spine. Pain is often more diffuse and vague than local lateral epicondylalgia, especially in chronic presentations. Associated neck or upper thoracic pain or stiffness. Distinguishing feature: improvement in elbow pain following treatment of cervical or thoracic facet stiffness. No local lateral epicondyle tenderness or grip weakness characteristic of lateral epicondylalgia.", "reference": "Differential diagnosis for common musculoskeletal presentations.pdf", "display_priority": 99, "region_pab_id": "elbow", "region_label": "Elbow"}], "condition_region": [{"condition_id": 1, "region_id": 15, "is_primary": 1}, {"condition_id": 2, "region_id": 11, "is_primary": 1}, {"condition_id": 3, "region_id": 11, "is_primary": 1}, {"condition_id": 4, "region_id": 12, "is_primary": 1}, {"condition_id": 5, "region_id": 3, "is_primary": 1}, {"condition_id": 6, "region_id": 12, "is_primary": 1}, {"condition_id": 7, "region_id": 12, "is_primary": 1}, {"condition_id": 8, "region_id": 10, "is_primary": 1}, {"condition_id": 9, "region_id": 18, "is_primary": 1}, {"condition_id": 10, "region_id": 5, "is_primary": 1}, {"condition_id": 11, "region_id": 3, "is_primary": 1}, {"condition_id": 12, "region_id": 17, "is_primary": 1}, {"condition_id": 13, "region_id": 8, "is_primary": 1}, {"condition_id": 14, "region_id": 2, "is_primary": 1}, {"condition_id": 15, "region_id": 10, "is_primary": 1}, {"condition_id": 16, "region_id": 12, "is_primary": 1}, {"condition_id": 17, "region_id": 12, "is_primary": 1}, {"condition_id": 18, "region_id": 11, "is_prima ": "(0.76-0.87)", "sp": 0.88, "sp_ci": "(0.82-0.93)", "plr": null, "plr_ci": null, "nlr": 0.21, "nlr_ci": null, "kappa": null, "reference": "Decary et al. 2022 meta-analysis; IJSPT 2022", "clinical_notes": "Newer test with good pooled stats. Lowest -LR (0.21) in meta-analysis, useful to rule out. Simple and quick to perform.", "pitfalls": null, "kb_panel_show": 1}, {"id": 11, "name": "Joint Line Tenderness", "also_known_as": "JLT", "test_type": "Palpation", "domain": "objective", "patient_position": "Supine or sitting; knee flexed 90 deg", "procedure": "Examiner palpates medial and lateral joint lines firmly with thumb", "positive_finding": "Pain or tenderness at joint line on palpation (medial or lateral)", "sn": 0.77, "sn_ci": "(0.68-0.84)", "sp": 0.26, "sp_ci": "(0.18-0.36)", "plr": 1.6, "plr_ci": null, "nlr": 0.6, "nlr_ci": null, "kappa": null, "reference": "Physiopedia JLT; Blyth et al. NICE HTA 2015", "clinical_notes": "Most sensitive individual test (Sn 0.77) but very low specificity. High false positive rate. Best for screening; specificity improves in specialist settings.", "pitfalls": null, "kb_panel_show": 1}, {"id": 12, "name": "McMurray Test", "also_known_as": "McMurray Maneuver", "test_type": "Provocation", "domain": "objective", "patient_position": "Supine; knee and hip fully flexed", "procedure": "Medial meniscus: external tibial rotation + valgus + knee extension. Lateral: internal rotation + varus + extension. Hand on joint line to detect click.", "positive_finding": "Audible/palpable click at joint line OR reproduction of pain during rotation and extension", "sn": 0.7, "sn_ci": null, "sp": 0.71, "sp_ci": null, "plr": 2.3, "plr_ci": null, "nlr": 0.6, "nlr_ci": null, "kappa": null, "reference": "Scholten et al. meta-analysis pooled", "clinical_notes": "Pooled Sn 70%, Sp 71%. Wide between-study variability. Click more specific than pain. Modified versions improve accuracy.", "pitfalls": "- Positive click \u2260 meniscal pathology \u2014 clicks are common in asymptomatic knees | **Pitfall:** Only a painful click with reproduction of familiar symptoms is a true positive; an audible but painless click should not be over-interpreted \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 ## Ankle", "kb_panel_show": 1}, {"id": 13, "name": "Thessaly Test", "also_known_as": null, "test_type": "Functional/Provocation", "domain": "objective", "patient_position": "Single leg standing on symptomatic leg; knee at 20 deg flexion", "procedure": "Patient rotates body internally and externally 3x while maintaining 20 deg knee flexion. Examiner holds outstretched hands for balance.", "positive_finding": "Medial or lateral joint line discomfort, locking sensation, or catching", "sn": 0.91, "sn_ci": "(Karachalios original only)", "sp": 0.97, "sp_ci": "(Karachalios original only)", "plr": 31.1, "plr_ci": null, "nlr": 0.1, "nlr_ci": null, "kappa": null, "reference": "Karachalios 2005 JBJS (original); NOT replicated", "clinical_notes": "CAUTION: Original stats (Sn 91%, Sp 97%) not replicated in independent studies. Recent multi-centre data shows no advantage over McMurray. Use with caution.", "pitfalls": null, "kb_panel_show": 1}, {"id": 14, "name": "History of Catching or Locking", "also_known_as": null, "test_type": "History", "domain": "subjective", "patient_position": "N/A - patient reported", "procedure": "Ask: Have you experienced the knee catching, locking, or inability to fully extend?", "positive_finding": "Patient reports history of mechanical symptoms: catching, true locking, or inability to fully extend", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Lowery et al. 2006", "clinical_notes" c utility. More useful as cluster component. Stresses two SIJs simultaneously.", "pitfalls": null, "kb_panel_show": 1}, {"id": 21, "name": "Gaenslen's Test (Left)", "also_known_as": null, "test_type": "Provocation", "domain": "objective", "patient_position": "Supine; test leg to full knee and hip flexion, opposite hip extended (left side)", "procedure": "Same as Gaenslens Right but testing left SIJ", "positive_finding": "Reproduction of familiar left SIJ or buttock pain", "sn": 0.5, "sn_ci": null, "sp": 0.77, "sp_ci": null, "plr": 2.21, "plr_ci": null, "nlr": 0.65, "nlr_ci": null, "kappa": null, "reference": "Laslett et al. 2005", "clinical_notes": "Slight side difference in stats. Include both sides in the 5-test cluster.", "pitfalls": null, "kb_panel_show": 1}, {"id": 22, "name": "ULTT-A (Median Nerve Bias)", "also_known_as": "Upper Limb Tension Test A / ULTT1 / ULTT-1 / Median Nerve Bias / Brachial Plexus Tension Test / Median Nerve Tension Test / Elvey Test", "test_type": "Neurodynamic", "domain": "objective", "patient_position": "Supine; arm at side", "procedure": "Shoulder abducted 90 deg, externally rotated; forearm supinated, wrist/fingers extended; elbow progressively extended. Sensitise with ipsilateral/contralateral cervical lateral flexion.", "positive_finding": "(A) symptom reproduction; (B) elbow extension side-to-side difference >10 deg; OR (C) cervical lateral flexion alters symptoms", "sn": 0.97, "sn_ci": "(0.72-0.97)", "sp": 0.22, "sp_ci": "(0.11-0.33)", "plr": 1.3, "plr_ci": null, "nlr": 0.12, "nlr_ci": null, "kappa": 0.76, "reference": "Wainner et al. 2003; JOSPT 2012", "clinical_notes": "Negative ULTT-A (-LR 0.12) very useful to RULE OUT cervical radiculopathy. High sensitivity, low specificity. Best screening test in cluster.", "pitfalls": null, "kb_panel_show": 1}, {"id": 23, "name": "Cervical Rotation ROM (Involved Side)", "also_known_as": "Active ROM measurement", "test_type": "Range of Motion", "domain": "objective", "patient_position": "Sitting; upright", "procedure": "Active cervical rotation measured with goniometer or inclinometer on involved (symptomatic) side only", "positive_finding": "Involved-side cervical rotation < 60 degrees", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Wainner et al. 2003", "clinical_notes": "Simple goniometric measurement. Restriction reflects foraminal compromise on symptomatic side.", "pitfalls": null, "kb_panel_show": 1}, {"id": 24, "name": "Cervical Distraction Test", "also_known_as": "Neck Distraction", "test_type": "Provocation/Relief", "domain": "objective", "patient_position": "Supine", "procedure": "One hand under chin, one at occiput; neck gently flexed to position of comfort; axial traction up to 10-15 kg gradually applied", "positive_finding": "REDUCTION or elimination of arm/neck symptoms with distraction", "sn": 0.44, "sn_ci": null, "sp": 0.9, "sp_ci": "(0.90-0.97)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Wainner et al. 2003; Cochrane systematic review", "clinical_notes": "High specificity (0.90-0.97). Symptom relief with distraction suggests foraminal/nerve root compression source.", "pitfalls": null, "kb_panel_show": 1}, {"id": 25, "name": "Spurling's Test A", "also_known_as": "Foraminal Compression / Spurling Compression", "test_type": "Provocation", "domain": "objective", "patient_position": "Sitting; upright", "procedure": "Patient laterally flexes and slightly rotates toward symptomatic side; examiner applies compressive force ~7 kg through top of head", "positive_finding": "Reproduction of familiar arm or radicular symptoms (not just local neck pain)", "sn": 0.5, "sn_ci": "(0.27-0.73)", "sp": 0.88, "sp_ci": "(0.77-0.94)", "plr": 3.5, "plr_ci": null, "nlr": 0.47, "nlr_ci": "(0.47-0.58)", "kappa": 0.6, "reference": "Wainner et al. 2003; Sleijser-Koehorst 2021", "clinical_notes": "Low Sn (50%) but high Sp (88%). NOT useful for screening. Positive = strong indicator of radiculopathy. Kappa 0.60 = good reliability.", "pitfalls": null, "kb_panel_show": 1}, {"id": 26, "name": "Age < 40 Years", "also_known_as": "Age criterion", "test_type": "History / Demographics", "domain": "subjective", "patient_position": "N/A - patient history", "procedure": "Ask date of birth; calculate age at assessment", "positive_finding": "Patient age is less than 40 years", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": 3.7, "plr_ci": "(individual +LR)", "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Hicks et al. 2005", "clinical_notes": "Strongest individual predictor (+LR 3.7). Younger LBP patients more likely to have instability pattern amenable to stabilisation.", "pitfalls": null, "kb_panel_show": 1}, {"id": 27, "name": "SLR > 91 Degrees", "also_known_as": "Hypermobile SLR", "test_type": "Range of Motion", "domain": "objective", "patient_position": "Supine; inclinometer on tibial tubercle", "procedure": "Leg raised passively with knee fully extended; inclinometer or goniometer measures ROM", "positive_finding": "Average SLR range of motion exceeds 91 degrees", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Hicks et al. 2005", "clinical_notes": "High SLR ROM suggests hypermobility. Counterintuitive finding: high flexibility associated with instability pattern.", "pitfalls": null, "kb_panel_show": 1}, {"id": 28, "name": "Aberrant Motion with Trunk Flexion", "also_known_as": "Instability catch / Gowers sign", "test_type": "Observation", "domain": "objective", "patient_position": "Standing", "procedure": "Patient bends forward then straightens. Observe throughout.", "positive_finding": "Any of: instability catch; painful arc; thigh climbing (Gowers sign); reversal of lumbopelvic rhythm on return", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": 0.6, "reference": "Hicks et al. 2005", "clinical_notes": "Kappa 0.60 = moderate reliability. Part of validated 2-item modified CPR (Rabin 2014).", "pitfalls": null, "kb_panel_show": 1}, {"id": 29, "name": "Prone Instability Test (PIT) Positive", "also_known_as": "PIT", "test_type": "Stability / Provocation", "domain": "objective", "patient_position": "Prone; feet on floor hanging off table edge", "procedure": "PA pressure to each lumbar spinous process with legs down (muscles relaxed), then repeated with legs raised (muscles active)", "positive_finding": "Pain present with legs DOWN that is REDUCED or ELIMINATED when legs RAISED", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": 0.87, "reference": "Hicks et al. 2005; JOSPT 2013", "clinical_notes": "Excellent reliability (kappa 0.87). Part of validated 2-item modified CPR (Rabin 2014). Rationale: passive instability restored by active muscle stabilisation.", "pitfalls": null, "kb_panel_show": 1}, {"id": 30, "name": "Two-Stage Treadmill Test", "also_known_as": null, "test_type": "Functional/Provocation", "domain": "objective", "patient_position": "Standing; treadmill walking", "procedure": "Stage 1: walk on LEVEL treadmill at 1.0 mph up to 10 min. Stage 2: 10 min rest seated. Stage 3: walk on 15-deg INCLINE treadmill. Record time to symptom onset and recovery.", "positive_finding": "Greater walking tolerance on inclined (flexed posture) vs level (extended posture) treadmill", "sn": 0.5, "sn_ci": null, "sp": 0.923, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Fritz et al. 1997; Cook et al. 2020", "clinical_notes": "Low Sn (50%) but high Sp (92.3%). Increased inclined walking time highly associated with LSS. Differentiates neurogenic from vascular claudication (neurogenic improves with flexion).", "pitfalls": null, "kb_panel_show": 1}, {"id": 31, "name": "Bicycle Test of Van Gelderen", "also_known_as": null, "test_type": "Functional/Provocation", "domain": "objective", "patient_position": "Seated on stationary bike", "procedure": "Patient cycles both UPRIGHT and LEANING FORWARD. Record symptom provocation in each position.", "positive_finding": "Symptoms reproduced upright AND relieved leaning forward (flexed posture decompresses canal)", "sn": 0.98, "sn_ci": "(submaximal protocol)", "sp": 0.86, "sp_ci": "(submaximal protocol)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Bicycle Test of Van Gelderen page", "clinical_notes": "Excellent sensitivity (98%) for detecting intermittent claudication. Useful alternative for patients who cannot perform treadmill test. Submaximal protocol preferred.", "pitfalls": null, "kb_panel_show": 1}, {"id": 32, "name": "Marching Test (Jensen)", "also_known_as": "March in Place Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Standing; in place", "procedure": "Patient marches in place for up to 2 minutes while examiner observes and records symptom onset time and character", "positive_finding": "Reproduction of typical neurogenic claudication symptoms (leg pain, heaviness, numbness) with in-place marching", "sn": 0.63, "sn_ci": null, "sp": 0.8, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Jensen et al. 1989; Physiotutors LSS review 2024", "clinical_notes": "Moderate utility (Sn 63%, Sp 80%). Simple bedside test. Positive when typical symptoms reproduced during marching.", "pitfalls": null, "kb_panel_show": 1}, {"id": 33, "name": "Romberg Test (modified for LSS)", "also_known_as": null, "test_type": "Balance/Neurological", "domain": "objective", "patient_position": "Standing; feet together", "procedure": "Standard Romberg (eyes open then closed) OR single-leg stance. Positive if significantly abnormal.", "positive_finding": "Significantly impaired balance with eyes closed suggesting proprioceptive/neurological compromise", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Cook et al. 2020 Eur Spine J", "clinical_notes": "Abnormal Romberg included in LSS cluster (Cook 2020 systematic review). May indicate central or peripheral neurological compromise from stenosis.", "pitfalls": null, "kb_panel_show": 1}, {"id": 34, "name": "FADIR Test", "also_known_as": "Flexion Adduction Internal Rotation / Hip Impingement Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Supine", "procedure": "Hip passively moved to: (1) full flexion, (2) adduction, (3) internal rotation. Apply gentle overpressure.", "positive_finding": "Pain in groin area, reproduction of symptoms, apprehension, or click", "sn": 0.96, "sn_ci": "(systematic review)", "sp": 0.11, "sp_ci": "(systematic review)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": 0.63, "reference": "Physiopedia FADIR; Tijssen 2012 Arthroscopy; Reiman 2013 BJSM", "clinical_notes": "Highest sensitivity (96%) for intra-articular pathology but very low specificity (11%). Excellent screening test - negative FADIR effectively rules out FAI. Do NOT use alone to confirm diagnosis.", "pitfalls": "- Extremely sensitive (0.96) but very low specificity (0.11) \u2014 almost everyone with hip pain will test positive | **Pitfall:** FADIR positive \u2260 FAI \u2014 it is a screening tool only; a negative is useful to rule out intra-articular pathology, a positive tells you almost nothing specific", "kb_panel_show": 1}, {"id": 35, "name": "FABER Test", "also_known_as": "Patrick Test / Figure-4 Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Supine; test leg in figure-4 position (hip flexed, abducted, externally rotated; ankle proximal to contralateral knee)", "procedure": "Examiner stabilises contralateral ASIS and applies gentle downward overpressure to ipsilateral knee toward floor", "positive_finding": "Pain reproduced in hip/groin OR restricted range vs contralateral side", "sn": 0.88, "sn_ci": "(for hip labral pathology)", "sp": 0.25, "sp_ci": "(Maslowski et al. 2010)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": 0.63, "reference": "Physiopedia FABER Test; Martin 2008 JOSPT; Reiman 2013; Maslowski et al. 2010", "clinical_notes": "Sensitivity 88% for labral pathology. Also useful for SIJ (transfers force through femur to SIJ). Test stresses both hip and SIJ. Context-dependent interpretation. Specificity 25% (Maslowski 2010) \u2014 low specificity limits rule-in value for FAI; useful for sensitivity.", "pitfalls": "- Sensitive for intra-articular pathology but also positive in SIJ dysfunction, hip flexor tightness, and adductor pathology | **Pitfall:** Always consider which structure is being stressed \u2014 anterior groin pain = hip joint; posterior pain = SIJ; medial = adductor \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 ## Knee", "kb_panel_show": 1}, {"id": 36, "name": "Log Roll Test", "also_known_as": "Passive Hip Rotation / Freiberg Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Supine; hip and knee extended, leg in neutral", "procedure": "Examiner gently rolls entire leg into full internal then external rotation. Assess pain and end feel.", "positive_finding": "Groin pain reproduced with passive internal or external rotation OR asymmetric range of motion vs contralateral", "sn": 0.56, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "AAFP 2014; Physiopedia Hip Assessment", "clinical_notes": "Moderate sensitivity for intra-articular pathology. Very specific when positive for hip joint involvement. Minimal musculotendinous involvement makes it a cleaner test of the hip joint.", "pitfalls": null, "kb_panel_show": 1}, {"id": 37, "name": "FAIR Test", "also_known_as": "Flexion Adduction Internal Rotation (Piriformis)", "test_type": "Provocation", "domain": "objective", "patient_position": "Sidelying; tested hip on top", "procedure": "Hip passively moved to 90 deg flexion, adduction, and internal rotation. Examiner stabilises hip and applies downward pressure to knee.", "positive_finding": "Pain in sciatic/gluteal area (piriformis provocation) or groin (FAI))", "sn": 0.88, "sn_ci": null, "sp": 0.83, "sp_ci": null, "plr": 5.2, "plr_ci": null, "nlr": 0.14, "nlr_ci": null, "kappa": null, "reference": "Physiopedia FAIR Test page; piriformis syndrome studies", "clinical_notes": "Diagnostic accuracy: Sn 0.88, Sp 0.83, +LR 5.2, -LR 0.14. Primarily for piriformis syndrome diagnosis. Also provokes FAI. Note location of pain to differentiate: gluteal = piriformis; groin = FAI/labral.", "pitfalls": null, "kb_panel_show": 1}, {"id": 38, "name": "Phalen's Test", "also_known_as": "Wrist Flexion Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Sitting or standing; elbows on surface", "procedure": "Patient pushes dorsum of hands together (wrists in full flexion) and holds for 60 seconds", "positive_finding": "Reproduction of paresthesia (burning, tingling, numbness) along median nerve distribution (thumb, index, middle, radial half of ring finger)", "sn": 0.7, "sn_ci": "(median across 48 studies)", "sp": 0.8, "sp_ci": "(median)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Ozdag et al. 2023 meta-analysis 67 studies; Physiopedia Phalens Test", "clinical_notes": "Median Sn 0.70, Sp 0.80 across 67 studies. Most diagnostically significant individual test per meta-analysis. Use for 60 sec (not 30).", "pitfalls": null, "kb_panel_show": 1}, {"id": 39, "name": "Tinel's Sign at Wrist", "also_known_as": "Tinel Test / Percussion Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Sitting or supine; wrist in neutral", "procedure": "Examiner taps over carpal tunnel (flexor retinaculum) with reflex hammer or fingertip; 2-3 taps", "positive_finding": "Tingling or electric sensation radiating into thumb, index, middle, or radial half of ring finger along median nerve distribution", "sn": 0.51, "sn_ci": "(median, range 0.45-0.74)", "sp": 0.9, "sp_ci": "(median)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Tinels Test; Ozdag 2023 meta-analysis", "clinical_notes": "Median Sn 0.51, Sp 0.90. Low sensitivity but high specificity. When positive, strong indicator of CTS. Best used to confirm rather than screen.", "pitfalls": null, "kb_panel_show": 1}, {"id": 40, "name": "Durkan Test (Carpal Compression Test)", "also_known_as": "Durkan Direct Compression Test", "test_type": "Provocation", "domain": "objective", "patient_position": "Sitting; wrist in neutral", "procedure": "Examiner applies firm direct pressure over carpal tunnel with both thumbs for 30 seconds", "positive_finding": "Reproduction of paresthesia along median nerve distribution within 30 seconds", "sn": 0.67, "sn_ci": "(median Ozdag)", "sp": 0.8, "sp_ci": "(median)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Ozdag 2023; Physiopedia Carpal Compression Test; Durkan 1991", "clinical_notes": "Median Sn 0.67, Sp 0.80. Some studies show higher Sn and Sp than Phalen or Tinel individually. When both Durkan and Tinel positive, diagnosis more likely.", "pitfalls": null, "kb_panel_show": 1}, {"id": 41, "name": "Hand Diagram (Katz Hand Diagram)", "also_known_as": "Katz Diagram / Classic Pattern", "test_type": "History/Symptom Map", "domain": "subjective", "patient_position": "N/A - patient self-reported", "procedure": "Patient shades area of symptoms on standardised hand diagram. Examiner classifies pattern: Classic (thumb/index/middle), Probable, Possible, or Unlikely CTS.", "positive_finding": "Classic or probable pattern on Katz hand diagram (numbness/tingling predominantly in thumb, index, middle and radial half of ring finger)", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Katz et al. 1987; Wainner 2005", "clinical_notes": "High specificity for classic pattern. Part of Wainner CTS CPR. Helps identify atypical presentations that may have other diagnosis.", "pitfalls": null, "kb_panel_show": 1}, {"id": 42, "name": "Symptom Relief with Hand Shaking", "also_known_as": "Flick Sign", "test_type": "History", "domain": "subjective", "patient_position": "N/A - patient reported", "procedure": "Ask: Do your symptoms improve when you shake or flick your hand?", "positive_finding": "Patient reports shaking or flicking hand provides relief of symptoms", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Wainner 2005; Pryse-Phillips 1984", "clinical_notes": "Part of Wainner CTS CPR. High specificity for true CTS. Reflects positional compression of median nerve relieved by hand movement.", "pitfalls": null, "kb_panel_show": 1}, {"id": 43, "name": "Cozen's Test", "also_known_as": "Resisted Wrist Extension Test / Thomsen Maneuver", "test_type": "Provocation/Strength", "domain": "objective", "patient_position": "Seated; elbow extended, forearm pronated, wrist radially abducted, hand in fist", "procedure": "Examiner stabilises elbow (palpating lateral epicondyle) with one hand; other placed on dorsum of fist. Patient resists wrist extension while examiner applies flexion force.", "positive_finding": "Pain at or near lateral epicondyle during resisted wrist extension", "sn": 0.91, "sn_ci": "(Karanasios 2022)", "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Karanasios et al. 2022; Physiopedia Cozens Test", "clinical_notes": "Highest sensitivity (91%). Useful to RULE OUT lateral epicondylalgia when negative. Low specificity limits use as sole confirmatory test.", "pitfalls": null, "kb_panel_show": 1}, {"id": 44, "name": "Maudsley's Test", "also_known_as": "Middle Finger Extension Test", "test_type": "Provocation/Strength", "domain": "objective", "patient_position": "Seated; shoulder neutral, elbow 90 deg, forearm pronated, wrist neutral", "procedure": "Patient extends middle finger against resistance applied by examiner (isometric contraction of extensor digitorum communis)", "positive_finding": "Pain reproduced in lateral epicondyle region with resisted middle finger extension", "sn": 0.88, "sn_ci": "(one study with USG as reference)", "sp": 0.85, "sp_ci": "(positive predictive value with USG)", "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Maudsleys Test; Saroja 2014", "clinical_notes": "Sn 88%, PPV 85% correlated with ultrasound. Tests extensor digitorum communis (EDC) specifically. May distinguish EDC pathology from ECRB.", "pitfalls": null, "kb_panel_show": 1}, {"id": 45, "name": "Mill's Test", "also_known_as": "Mills Manipulation", "test_type": "Provocation / Range of Motion", "domain": "objective", "patient_position": "Standing or sitting; shoulder 90 deg flexion, elbow fully extended, forearm pronated, wrist fully flexed", "procedure": "Examiner passively extends elbow fully while maintaining forearm pronation and full wrist flexion (maximally stretches common extensor origin)", "positive_finding": "Pain reproduced at lateral epicondyle during passive stretch", "sn": 0.53, "sn_ci": "(Saroja 2014)", "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Mill's Test; Saroja 2014", "clinical_notes": "Lower sensitivity (53%) than Cozen or Maudsley. Tests passive extensibility of ECRB/common extensor origin. High specificity in some studies (100% in one small study).", "pitfalls": null, "kb_panel_show": 1}, {"id": 46, "name": "Lateral Epicondyle Palpation", "also_known_as": "Tenderness to palpation at LE", "test_type": "Palpation", "domain": "objective", "patient_position": "Seated; elbow slightly flexed", "procedure": "Palpate directly over lateral epicondyle and 1-2 cm distal (ECRB origin) with firm pressure", "positive_finding": "Pain on direct palpation at or distal to lateral epicondyle", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Physiopedia Assessment of Tennis Elbow", "clinical_notes": "Essential component of diagnosis. Local tenderness is hallmark finding. Considered mandatory for diagnosis by most criteria.", "pitfalls": null, "kb_panel_show": 1}, {"id": 47, "name": "Pain-Free Grip Strength Difference", "also_known_as": "PFGS Test", "test_type": "Strength/Function", "domain": "objective", "patient_position": "Seated; elbow at 90 deg flexion AND at full extension", "procedure": "Dynamometer measurement of pain-free grip strength in both positions. Compare sides and between positions.", "positive_finding": "5-10% difference between elbow flexion and extension grip strength", "sn": null, "sn_ci": null, "sp": null, "sp_ci": null, "plr": null, "plr_ci": null, "nlr": null, "nlr_ci": null, "kappa": null, "reference": "Karanasios 2022; Physiopedia Lateral Epicondylalgia page", "clinical_notes": "Sn 78-83%, Sp 80-90% per Karanasios 2022. Best objective measure with combined good Sn and Sp. Pain-free (not maximum) grip is measured. Reliable functional outcome measure.", "pitfalls": null, "kb_panel_show": 1}, {"id": 48, "name": "Roos Stress Test (EAST)", "also_known_as": "Elevated Arm Stress Test / Roos Test", "test_type": "Provocation", "domain": "object
